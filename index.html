  --brass:light-dark(#b38e4f,#c9a96d);
  --brasst:light-dark(#7c5c24,#dcc18c);
  --link:var(--brasst);
  --red:light-dark(#a3281d,#f29b8f);
  --redbg:light-dark(#f7e7e3,#3a1a16);
  --redf:light-dark(#b23a2d,#c4493c);
  --amb:light-dark(#875600,#ebc070);
  --ambbg:light-dark(#f5ecd7,#33270f);
  --ambf:light-dark(#d99c35,#d9a441);
  --good:light-dark(#2b6944,#93cfa8);
  --goodbg:light-dark(#e2eee5,#14301f);
  --s1:light-dark(#1f6a53,#6cc3a0);
  --s2:light-dark(#b0853a,#d8b46e);
  --s3:light-dark(#4f6a95,#93a9d8);
  --side:light-dark(#183229,#10201a);
  --side-ink:#efe9dd;
  --side-ink2:rgba(239,233,221,.64);
  --champ:#d6bc86;
  --sh1:0 1px 2px light-dark(rgba(20,32,27,.05),rgba(0,0,0,.3));
  --sh2:0 18px 40px light-dark(rgba(16,30,24,.16),rgba(0,0,0,.55)),0 4px 12px light-dark(rgba(16,30,24,.08),rgba(0,0,0,.35));
  --ring:0 0 0 1px var(--edge);
  --f:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tb:58px;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-padding-top:90px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-synthesis:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);overflow-x:clip;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
p{margin:0 0 10px}
.muted{color:var(--ink2)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--brass) 32%,transparent)}

/* barra in alto */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;height:calc(var(--tb) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.tb-brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0;transition:opacity .18s}
.tb-names{display:grid;line-height:1.15;min-width:0}
.tb-names b{font-size:18px;font-weight:650;line-height:1.15;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-names small{font-size:12.5px;color:var(--ink2);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title{position:absolute;left:64px;right:110px;bottom:0;height:var(--tb);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:650;letter-spacing:-.01em;opacity:0;pointer-events:none;transition:opacity .18s;white-space:nowrap;overflow:hidden}
.topbar.scrolled .tb-brand{opacity:0}
.topbar.scrolled .tb-title{opacity:1}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:radial-gradient(130% 120% at 28% 18%,#2f5d4e 0%,#1b382f 55%,#12271f 100%);color:#f1e8d8;flex:none;box-shadow:inset 0 0 0 1px rgba(214,188,134,.42),0 1px 2px rgba(10,22,17,.25)}
.logo svg{width:25px;height:25px}
.sync{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.sync.warn{background:var(--ambbg);color:var(--amb)}
.sync:empty{display:none}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;flex:none;text-decoration:none}
.iconbtn:hover{background:var(--surf2)}
.searchbox{display:none}

/* navigazione */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:color-mix(in srgb,var(--surf) 90%,transparent);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--line)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;padding:3px 0 2px;color:var(--ink2);text-decoration:none;font-size:12px;font-weight:550;letter-spacing:.01em;line-height:1.1}
.tabs a .ic{display:grid;place-items:center;width:56px;height:31px;border-radius:999px;transition:background .2s,color .2s}
.tabs a[aria-current=page]{color:var(--ink);font-weight:650}
.tabs a[aria-current=page] .ic{background:var(--pritint);color:var(--pri)}
.fab{justify-self:center;align-self:center;display:grid;place-items:center;width:58px;height:58px;margin-top:-24px;border-radius:50%;border:0;background:var(--pri);color:var(--onpri);box-shadow:inset 0 0 0 3px var(--pri),inset 0 0 0 4px light-dark(rgba(214,188,134,.85),rgba(18,32,27,.28)),var(--sh2);cursor:pointer;transition:transform .12s}
.fab:active{transform:scale(.94)}
.fab svg.i{width:26px;height:26px;stroke-width:1.8}
.tabs .side-brand,.tabs .newbtn,.tabs .side-only,.tabs .side-nav{display:none}
main{display:block;padding:6px 16px calc(124px + env(safe-area-inset-bottom));max-width:1140px;margin:0 auto;outline:none}
@media(min-width:960px){
  .app{display:grid;grid-template-columns:268px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100dvh}
  .tabs{position:sticky;top:0;grid-row:1/3;grid-column:1;height:100dvh;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:22px 16px 18px;background:var(--side);color:var(--side-ink);border-top:0;border-right:1px solid light-dark(transparent,var(--line));backdrop-filter:none;-webkit-backdrop-filter:none}
  .tabs .side-brand{display:flex;align-items:center;gap:12px;margin:0 6px 26px}
  .tabs .side-brand .tb-names b{font-size:19px}
  .tabs .side-brand .tb-names small{color:var(--side-ink2)}
  .tabs .newbtn{display:flex;margin:0 0 18px;justify-content:flex-start}
  .tabs .btn.newbtn{background:var(--champ);color:#13241e}
  .tabs .btn.newbtn:hover{background:color-mix(in srgb,var(--champ) 88%,#fff)}
  .tabs a{flex-direction:row;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;font-size:15.5px;font-weight:500;letter-spacing:0;color:var(--side-ink2);transition:background .15s,color .15s}
  .tabs a .ic{width:auto;height:auto;background:none!important;color:inherit!important}
  .tabs a:hover{background:rgba(239,233,221,.06);color:var(--side-ink)}
  .tabs a[aria-current=page]{background:rgba(239,233,221,.09);color:var(--side-ink);font-weight:600}
  .tabs a[aria-current=page] .ic{color:var(--champ)!important}
  .tabs .side-only{display:flex;margin-top:auto}
  .tabs .side-nav{display:flex}
  .tabs :focus-visible{outline-color:var(--champ)}
  .fab{display:none}
  .topbar{grid-column:2;padding:0 32px;gap:10px}
  .tb-brand{display:none}
  .tb-title{left:32px;right:auto;justify-content:flex-start}
  .topbar.scrolled .tb-title{opacity:1}
  .searchbox{display:flex;align-items:center;gap:10px;margin-left:auto;width:min(380px,40vw);height:42px;padding:0 14px;border-radius:12px;border:0;background:var(--surf);box-shadow:var(--ring);color:var(--ink3);font-size:15px;cursor:pointer}
  .searchbox:hover{box-shadow:0 0 0 1px var(--line2)}
  .searchbox kbd{margin-left:auto;font:600 12px var(--f);padding:2px 7px;border-radius:6px;background:var(--surf2);color:var(--ink2)}
  .topbar .iconbtn.search,.topbar #cfgLink{display:none}
  main{grid-column:2;grid-row:2;margin:0 auto;width:100%;padding:10px 44px 64px}
}

/* testate */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 18px;margin:6px 0 22px}
.ph h1{font-size:clamp(34px,9vw,44px);font-weight:600;line-height:1.05;letter-spacing:-.032em;margin:0;text-wrap:balance}
.ph p{margin:8px 0 0;color:var(--ink2);max-width:60ch;font-size:15.5px}
.ph .kick{margin:0 0 4px;font-size:15px;font-weight:500;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
h2{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:22px;font-weight:650;line-height:1.2;letter-spacing:-.02em;margin:34px 0 12px}
h2 .h2a{display:flex;gap:6px}
h3{font-size:15.5px;line-height:1.3;font-weight:600;margin:24px 0 10px;color:var(--ink)}
.subnav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}

/* bottoni e campi */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--surf);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);font-family:var(--f);font-weight:600;font-size:15px;letter-spacing:.004em;line-height:1;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .08s,background .15s,opacity .15s}
.btn:hover{background:var(--surf2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);color:var(--onpri);box-shadow:none}
.btn.pri:hover{background:color-mix(in srgb,var(--pri) 88%,#fff)}
.btn.dan{background:var(--redbg);color:var(--red);box-shadow:none}
.btn.dan:hover{background:color-mix(in srgb,var(--redbg) 88%,var(--red))}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{height:38px;min-height:38px;padding:0 14px;border-radius:10px;font-size:14px}
.btn.icon{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn input[type=file]{display:none}
.lnk{appearance:none;background:none;border:0;padding:2px 0;color:var(--link);font-family:var(--f);font-weight:600;cursor:pointer;text-align:left;text-decoration:none}
.lnk:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
input[type=text],input[type=search],input[type=date],select,textarea{width:100%;min-height:48px;padding:10px 14px;font-size:16px;color:var(--ink);background:var(--surf);border:1px solid var(--line2);border-radius:12px;transition:border-color .15s,background .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
input[disabled],select[disabled]{opacity:.55}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.fld{display:grid;gap:6px;margin:0 0 14px}
.fld-d{margin:0 0 14px}
.fld-d .fld{margin:0 0 8px}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{appearance:none;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--surf2);color:var(--ink2);font:600 13.5px var(--f);cursor:pointer;transition:background .15s,color .15s}
.dchip:hover{color:var(--ink)}
.dchip[aria-pressed=true]{background:var(--pri);color:var(--onpri)}
.fld>span{font-size:13.5px;font-weight:550;color:var(--ink2)}
.hint{display:block;font-size:14px;color:var(--ink2);margin:2px 0 0;line-height:1.45}
.err{color:var(--red);font-weight:600;background:var(--redbg);padding:10px 14px;border-radius:12px}
.err:empty{display:none}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px;align-items:start}
@media(max-width:520px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g3>:first-child{grid-column:1/-1}}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:500;margin:0 0 6px}
.chk input{width:21px;height:21px;accent-color:var(--pri);flex:none}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:13px;background:light-dark(#e7e7e0,#0f1714);box-shadow:inset 0 0 0 1px var(--edge);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;flex:none;min-height:38px;padding:0 15px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font-family:var(--f);font-weight:550;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:light-dark(#ffffff,#26332e);color:var(--ink);font-weight:600;box-shadow:0 1px 2px light-dark(rgba(20,32,27,.1),rgba(0,0,0,.4)),0 0 0 1px var(--edge)}
.sheet .seg,.sheet-g .seg{background:light-dark(#ecece5,#0f1714)}
.fld .seg{flex-wrap:wrap;overflow:visible}
.algrid{display:flex;flex-wrap:wrap;gap:8px}
.altog{appearance:none;min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:var(--surf);color:var(--ink);font-family:var(--f);font-weight:550;font-size:14px;cursor:pointer}
.altog[aria-pressed=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.srch{position:relative;flex:1 1 240px}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--ink3);pointer-events:none}
.srch input{padding-left:42px;background:var(--surf);border-color:var(--edge);box-shadow:var(--sh1)}
.srch input:focus{border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
.sheet .srch input,.sheet-g .srch input{background:var(--surf);box-shadow:none;border-color:var(--line2)}

/* elementi */
.chip{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:3px 10px;border-radius:999px;font-family:var(--f);font-size:12.5px;font-weight:600;letter-spacing:.005em;line-height:1.25;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.chip.red,.chip.up{background:var(--redbg);color:var(--red)}
.chip.amb{background:var(--ambbg);color:var(--amb)}
.chip.down,.chip.okk{background:var(--goodbg);color:var(--good)}
.chip.al{background:var(--surf);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.chip.ok{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.up{color:var(--red)}.down{color:var(--good)}
.arw{display:inline-block;font-family:var(--f);font-size:.6em;line-height:1;vertical-align:.14em}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surf);border-radius:14px;padding:12px 14px;font-size:14.5px;color:var(--ink2);margin:0 0 16px;box-shadow:var(--ring)}
.note.warn{background:var(--ambbg);color:var(--amb);box-shadow:none}
.note svg.i{width:20px;height:20px;margin-top:1px}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:30px 22px;border-radius:18px;background:var(--surf);color:var(--ink2);box-shadow:var(--ring);font-size:15px}
.empty .ei{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--surf);color:var(--brasst);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brass) 55%,transparent)}
.sheet .empty,.sheet-g .empty{box-shadow:inset 0 0 0 1px var(--line)}

/* liste raggruppate */
.list{display:block;background:var(--surf);border-radius:18px;box-shadow:var(--sh1),var(--ring);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:12px 16px;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none}
div.row{cursor:default}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:68px;border-top:1px solid var(--line)}
.list.plain .row+.row::before{left:16px}
button.row:hover,.row.has-act:hover{background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
button.row::after{content:"";flex:none;width:7px;height:7px;margin:0 3px 0 0;border-top:1.5px solid var(--ink3);border-right:1.5px solid var(--ink3);transform:rotate(45deg)}
.row .av{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--surf2);color:var(--ink2);font:650 11px/1 var(--f);letter-spacing:.05em;text-align:center}
.row .av svg.i{width:19px;height:19px}
.av.red{background:var(--redbg);color:var(--red)}
.av.amb{background:var(--ambbg);color:var(--amb)}
.av.good{background:var(--goodbg);color:var(--good)}
.av.pri{background:var(--pri);color:var(--onpri)}
.row .m{flex:1;display:grid;gap:1px;min-width:0}
.row .m b{font-weight:550;font-size:16px;line-height:1.3;letter-spacing:-.003em}
.row .m>span{font-size:14px;color:var(--ink2);line-height:1.4}
.row .s{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right;max-width:45%}
.row .s:empty{display:none}
.row .mc{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.row .mc:empty{display:none}
.row.has-act{padding:0 14px 0 0;cursor:default}
.row-main{flex:1;display:flex;align-items:center;gap:14px;min-width:0;min-height:66px;padding:12px 0 12px 16px;border:0;background:none;text-align:left;color:inherit;cursor:pointer}
.q{font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q small{font-weight:500;color:var(--ink2);font-size:13px}
.grp{margin:0 0 24px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 4px 8px}

/* il registro della giornata */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:0 0 4px;background:var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh1),var(--ring)}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{appearance:none;position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:8px;min-height:118px;padding:16px 16px 15px;border:0;border-radius:0;background:var(--surf);color:var(--ink);text-align:left;cursor:pointer;transition:background .15s}
.tile:hover{background:color-mix(in srgb,var(--surf) 97%,var(--ink))}
.tile:active{background:var(--surf2)}
.tile .ti{position:absolute;top:15px;right:15px;display:grid;color:var(--ink3)}
.tile .ti svg.i{width:19px;height:19px}
.tile b{font-size:44px;font-weight:550;line-height:.95;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--ink3)}
.tile span{font-size:14px;line-height:1.28;font-weight:500;color:var(--ink2)}
.tile.red .ti,.tile.red b{color:var(--red)}
.tile.amb .ti,.tile.amb b{color:var(--amb)}
.tile[aria-pressed=true]{background:color-mix(in srgb,var(--pri) 6%,var(--surf))}
.tile[aria-pressed=true]::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:var(--pri)}
.skel .tiles{background:none;box-shadow:none;gap:12px;border-radius:0;overflow:visible}

/* da fare, per urgenza */
#da-controllare .lnk{font-size:15px}
.todo{display:grid;gap:20px}
.todo-h{display:flex;align-items:center;gap:8px;min-height:34px;margin:0 4px 8px}
.todo-h h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.todo-n{font-size:13.5px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.todo-h .btn{margin-left:auto}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.dot.red{background:var(--red)}.dot.amb{background:var(--ambf)}
.empty.done{padding:34px 22px}
.empty.done .ei{width:56px;height:56px;color:var(--good);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 40%,transparent)}
.empty.done b{font-size:18px;font-weight:650;color:var(--ink);letter-spacing:-.015em}

/* i cartellini della vetrina */

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:959px){.deskonly{display:none!important}}
body.ro .w{display:none!important}
body.nodl .dl{display:none!important}

/* banco: lo scontrino interno. Tasti grandi da toccare con una mano; in basso lo scontrino in corso con Invio
   (sopra la barra delle sezioni, alta --navh), da 960px un riquadro di lato */
:root{--navh:67px}
@media(min-width:960px){.mobonly{display:none!important}}
.btn.bk-entry{background:var(--pri);color:var(--onpri);box-shadow:none;border-radius:999px;padding:0 20px 0 15px}
.btn.bk-entry svg.i{width:21px;height:21px}
.bk{display:block}
.bk-gh{margin:22px 4px 10px;font-size:13.5px;font-weight:600;color:var(--ink2);letter-spacing:.01em}
.bk-main>.bar+.bk-gh,.bk-main>.note+.bk-gh{margin-top:6px}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:600px){.bgrid{grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}}
.bt{position:relative;display:flex}
.bt-add{appearance:none;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:110px;padding:14px 14px 12px;border:0;border-radius:18px;background:var(--surf);color:var(--ink);font-family:var(--f);text-align:left;cursor:pointer;box-shadow:var(--sh1),var(--ring);touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .08s,background .15s,box-shadow .15s}
.bt-add:active{transform:scale(.97)}
.bt-n{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:17px;font-weight:600;line-height:1.24;letter-spacing:-.012em;overflow-wrap:anywhere}
.bt-f{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-height:22px;font-variant-numeric:tabular-nums}
.bt-s{font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.bt-p{margin-left:auto;font-size:15.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.bt.sel .bt-add{background:color-mix(in srgb,var(--pri) 8%,var(--surf));box-shadow:inset 0 0 0 2px var(--pri),var(--sh1)}
.bt.sel .bt-n{padding-right:42px}
.bt.sel .bt-s{visibility:hidden}
.bt-q{position:absolute;top:10px;right:10px;display:grid;place-items:center;min-width:36px;height:36px;padding:0 10px;border-radius:999px;background:var(--pri);color:var(--onpri);font-size:17px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;pointer-events:none}
.bt.pop .bt-q{animation:bk-pop .24s cubic-bezier(.3,1.6,.5,1)}
@keyframes bk-pop{from{transform:scale(.55)}to{transform:none}}
.bt-sub{appearance:none;position:absolute;left:8px;bottom:8px;display:grid;place-items:center;width:48px;height:40px;border:0;border-radius:12px;background:var(--surf);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;touch-action:manipulation}
.bt-sub svg.i{width:20px;height:20px;stroke-width:2}
.bt.off .bt-add{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);cursor:default}
.bt.off .bt-add:active{transform:none}
.bt.off .bt-n,.bt.off .bt-p{color:var(--ink3)}
.bt.off .bt-s{font-weight:600;color:var(--ink3)}
.bt.exp .bt-s{color:var(--red)}
.bk-new{margin-top:14px}
/* lo scontrino in corso sul telefono: una barra che galleggia sopra le sezioni */
.bk-bar{position:fixed;left:10px;right:10px;bottom:calc(var(--navh) + 12px + env(safe-area-inset-bottom));z-index:29;display:flex;align-items:center;gap:6px;min-height:66px;padding:8px 8px 8px 16px;border-radius:20px;background:var(--surf);color:var(--ink);box-shadow:var(--sh2),var(--ring)}
.bk-bar.on{background:var(--pri);color:var(--onpri);box-shadow:var(--sh2)}
.bk-bar .m{flex:1;display:grid;gap:1px;min-width:0}
.bk-bar .m b{font-size:15px;font-weight:600}
.bk-bar .m span{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-sum{appearance:none;flex:1;display:grid;gap:1px;min-width:0;padding:4px 0;border:0;background:none;color:inherit;font-family:var(--f);text-align:left;cursor:pointer}
.bk-sum b{font-size:18px;font-weight:650;line-height:1.2;letter-spacing:-.015em}
.bk-sum span{font-size:14px;opacity:.82;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-x{appearance:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer;opacity:.8}
.bk-x:hover{opacity:1;background:color-mix(in srgb,var(--onpri) 12%,transparent)}
.bk-inv{appearance:none;height:52px;padding:0 28px;border:0;border-radius:14px;background:var(--onpri);color:var(--pri);font:700 17.5px var(--f);letter-spacing:-.005em;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.bk-inv:active{transform:scale(.96)}
.bk-bar :focus-visible{outline-color:var(--champ)}
@media(max-width:959px){
  #v-banco.has-bar{padding-bottom:84px}
  body:has(#v-banco.has-bar) #toast{bottom:calc(var(--navh) + 90px + env(safe-area-inset-bottom))}
}
/* righe e totale dello scontrino (riquadro di lato e foglio del telefono) */
.bk-rows{display:grid}
.bk-r{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.bk-rows .bk-r:first-child{border-top:0}
.bk-rn{flex:1;display:grid;gap:2px;min-width:0}
.bk-rn b{font-size:15px;font-weight:600;line-height:1.3}
.bk-rn small{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bk-st{display:flex;align-items:center;gap:4px;flex:none}
.bk-st .btn.icon{width:40px;height:40px;min-height:40px;background:var(--surf);box-shadow:inset 0 0 0 1px var(--line2)}
.bk-st .btn.icon svg.i{width:18px;height:18px;stroke-width:2}
.bk-st input{width:54px;min-height:40px;height:40px;padding:4px 6px;border-radius:10px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
.bk-u{font-size:13px;color:var(--ink2);margin-right:2px}
.bk-tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 0 0;padding-top:12px;border-top:1px solid var(--line2)}
.bk-tot span{font-weight:550;color:var(--ink2)}
.bk-tot b{font-size:28px;font-weight:650;line-height:1.1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.bk-senza{margin:6px 0 0;font-size:13.5px}
.bk-side{display:none}
@media(min-width:960px){
  .bk{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
  .bk-side{display:grid;gap:12px;position:sticky;top:calc(var(--tb) + 14px)}
  .bk-bar{display:none}
}
.bk-card{background:var(--surf);border-radius:20px;padding:16px 16px 14px;box-shadow:var(--sh1),var(--ring)}
.bk-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 4px}
.bk-h h2{margin:0;font-size:20px}
.bk-vuoto{margin:8px 0 14px;font-size:14.5px;color:var(--ink2)}
.bk-ok{width:100%;height:58px;margin-top:14px;border-radius:14px;font-size:18px}
.bk-kbd{margin:8px 0 0;text-align:center;font-size:13px}
@media(pointer:coarse){.bk-kbd{display:none}}
.bk-last{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--surf);box-shadow:var(--ring)}
.bk-last .m{flex:1;display:grid;gap:1px;min-width:0}
.bk-last .m b{font-size:14.5px;font-weight:600}
.bk-last .m span{font-size:13.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-stat{margin:-4px 4px 12px;font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bk-list .row-main{cursor:default}

/* fatture dalla posta */
ol.steps{margin:4px 0 18px;padding-left:22px;display:grid;gap:10px;line-height:1.5}
ol.steps li::marker{font-weight:650;color:var(--brasst)}
ol.steps .acts{display:flex;margin-top:8px}
.posta-gs pre{max-height:240px;overflow:auto;font-size:12px}
.note.posta-bar{margin-bottom:12px}
.note.posta-bar .lnk{display:block;margin:4px 0 0}
ol.steps a{color:var(--link);font-weight:600;text-decoration:none}
.btn .chip{margin-left:4px;font-size:12px}
.posta-link{white-space:pre-wrap;word-break:break-all;font-size:13px;background:var(--surf2,rgba(0,0,0,.04));padding:10px 12px;border-radius:12px;user-select:all}
.notif-temi{margin:2px 0 12px}
.notif-temi .chk{min-height:40px;margin:0}

</style>
</head>

{

/* ---------- utilità ---------- */

/* archivio locale: usato fuori da claude.ai (dati nel browser) o in prova (dati in memoria) */
function localDB(key) {
  let store = {};
  if (key) { try { store = JSON.parse(lsGet(key) || '{}') || {}; } catch { store = {}; } }
  const subs = {};
  const save = () => { if (key) lsSet(key, JSON.stringify(store)); };
  const snap = c => {
    const docs = Object.entries(store[c] || {}).map(([id, v]) => ({id, exists: true, data: () => v, metadata: {fromCache: false, hasPendingWrites: false}}));
    return {docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {fromCache: false, hasPendingWrites: false}};
  };
  const emit = c => setTimeout(() => (subs[c] || []).forEach(f => f(snap(c))), 0);
  return {
    collection(c) {
      return {
        onSnapshot(next) { (subs[c] ||= []).push(next); emit(c); return () => { subs[c] = subs[c].filter(f => f !== next); }; },
        doc(id) {
          return {
            async set(v) { (store[c] ||= {})[id] = clone(v); save(); emit(c); },
            async delete() { if (store[c]) delete store[c][id]; save(); emit(c); },
            async get() { const v = store[c]?.[id]; return {id, exists: !!v, data: () => v}; }
          };
        }
      };
    },
    /* tante scritture insieme, salvate una volta sola */
    async bulk(ops) {
      for (const [c, id, v] of ops) { if (v == null) { if (store[c]) delete store[c][id]; } else (store[c] ||= {})[id] = clone(v); }
      save(); [...new Set(ops.map(o => o[0]))].forEach(emit);
    }
  };
}

async function put(col, id, doc, quiet) {
  doc = clone(doc); delete doc.id;
  if (col !== 'impostazioni' && !doc.esempio && !S.data[col].has(id) && countSample()) doc.esempio = true;   // durante la prova anche quello che crei è di prova
  S.data[col].set(id, {...doc, id}); bump();
  for (let tent = 0; tent < 2; tent++) {
    try { await S.db.collection(col).doc(id).set(doc); return true; }
    catch (e) {
      if (tent === 0 && (e?.code === 'unavailable' || e?.code === 'resource_exhausted')) { await sleep(700 + Math.random() * 900); continue; }
      if (!quiet) dbErr(e);
      return false;
    }
  }
  return false;
}
async function del(col, id, quiet) {
  S.data[col].delete(id); bump();
  try { await S.db.collection(col).doc(id).delete(); return true; }
  catch (e) { if (!quiet) dbErr(e); return false; }
}
function dbErr(e) {
  const c = e?.code;
  if (c === 'invalid_argument') toast('Salvataggio rifiutato: probabilmente hai solo accesso in lettura.', true);
  else if (c === 'quota_exceeded') toast("L'archivio è pieno: esporta un backup ed elimina dati vecchi.", true);
  else if (c === 'resource_exhausted') toast('Troppe operazioni ravvicinate: riprova tra qualche secondo.', true);
  else if (c === 'revoked') toast("L'accesso ai dati è stato ritirato.", true);
  else toast('Salvataggio non riuscito. Controlla la connessione e riprova.', true);
}
async function pool(items, n, fn) {
  let i = 0;
  const run = async () => { while (i < items.length) { const it = items[i++]; await fn(it); } };
  await Promise.all(Array.from({length: Math.min(n, items.length)}, run));
}

function st(l) {

  if (!l.scad) return {c: '', t: 'Senza scadenza', n: Infinity};

  if (n <= w) return {c: 'amb', t: n === 1 ? 'Scade domani' : `Scade tra ${n} giorni`, n};

function stockOf(lots) {
  const t = today(); let usable = 0, expired = 0, next = null, n = 0;
  for (const l of lots || []) if (l.res > EPS) {

/* allergeni, elenco ingredienti, costi (anche su bozze di schede) */
function recAllergensOf(r, path = []) {
  const out = new Set();
  for (const g of (r?.ingredienti || [])) {
    if (g.tipo === 'ric') {
      if (path.includes(g.refId)) continue;
      const s = S.data.ricette.get(g.refId);
      if (s) recAllergensOf(s, [...path, g.refId]).forEach(a => out.add(a));
    } else (S.data.articoli.get(g.refId)?.allergeni || []).forEach(a => out.add(a));
  }
  return out;
}
function recTracceOf(r, path = []) {
  const out = new Set(Array.isArray(r?.tracce) ? r.tracce : []);
  for (const g of (r?.ingredienti || [])) if (g.tipo === 'ric' && !path.includes(g.refId)) {
    const s = S.data.ricette.get(g.refId);
    if (s) recTracceOf(s, [...path, g.refId]).forEach(a => out.add(a));
  }

}
const curPrice = id => drv().lastCost.get(id) ?? null;
function recCostOf(r, path = [], pf = curPrice) {
  let tot = 0; const miss = new Set();
  for (const g of (r?.ingredienti || [])) {
    const it = itemOf(g.tipo, g.refId);
    if (!it) { miss.add('ingrediente eliminato'); continue; }
    const qb = conv(+g.qta, g.unita, baseOf(g.tipo, it), +it.pesoPz || 0);
    if (!(qb >= 0)) { miss.add(it.nome); continue; }
    if (g.tipo === 'ric') {
      if (path.includes(g.refId) || !(+it.resaQta > 0)) { miss.add(it.nome); continue; }
      const sub = recCostOf(it, [...path, g.refId], pf);
      sub.miss.forEach(m => miss.add(m));
      tot += qb * sub.tot / +it.resaQta;
    } else {
      const c = pf(g.refId);
      if (c == null) { miss.add(it.nome); continue; }
      tot += qb * c;
    }
  }
  return {tot, miss: [...miss]};
}

  const qb = conv(+g.qta, g.unita, baseOf(g.tipo, it), +it.pesoPz || 0);

const TAB = {schede: 'produzione', prezzi: 'acquisti', fornitori: 'acquisti'};
const route = () => { const h = location.hash.slice(1); return VIEWS[h] ? h : 'oggi'; };

function renderChrome() {
  const r = route(), tab = TAB[r] || r;
  $$('#tabs a').forEach(a => a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const cl = $('#cfgLink'); if (r === 'impostazioni') cl.setAttribute('aria-current', 'page'); else cl.removeAttribute('aria-current');
  const sub = cfg().nome || 'Banco e laboratorio';
  $('#bizName').textContent = sub; $('#bizName2').textContent = sub;
  $('#tbTitle').textContent = TITOLI[r];
  const sy = $('#sync'); let t = '', w = false;
  if (S.mode === 'local') t = 'Dati nel browser';
  else if (S.mode === 'temp') { t = 'Prova: non salva'; w = true; }
  else if (S.mode === 'cloud') {
    if (S.ro) t = 'Sola lettura';
    else if (S.slow) { t = 'Connessione lenta'; w = true; }
    else if (S.fresh.size < COLS.length) t = 'Aggiorno…';
  }
  const demo = S.mode !== 'loading' && countSample() > 0;
  $('#demoPill').hidden = !demo;
  sy.textContent = demo && !w ? '' : t; sy.classList.toggle('warn', w);
}
function renderMain() {
  const main = $('#main');
  const ae = document.activeElement;
  const fid = ae && main.contains(ae) && ae.id ? ae.id : null;
  const sel = fid && typeof ae.selectionStart === 'number' ? [ae.selectionStart, ae.selectionEnd] : null;
  const html = (S.mode === 'loading' || (S.got.size < COLS.length && !S.slow))
    ? `<div class="skel" role="status" aria-label="Carico i dati"><div class="sk" style="height:22px;width:40%"></div><div class="sk" style="height:42px;width:65%"></div><div class="tiles"><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div></div><div class="sk" style="height:66px"></div><div class="sk" style="height:66px"></div><div class="sk" style="height:66px"></div></div>`
    : VIEWS[route()]();
  if (main._h === html) return;
  main.innerHTML = html; main._h = html;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({preventScroll: true}); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch { /* campo senza selezione */ } } } }
}

const search = (k, ph) => `<label class="srch">${IC.search}<input type="search" id="q-${k}" data-q="${k}" value="${esc(UI.q[k])}" placeholder="${esc(ph)}" aria-label="${esc(ph)}" autocomplete="off"></label>`;
const seg = (k, opts) => `<div class="seg" role="group">${opts.map(([v, t]) => `<button type="button" data-act="seg" data-k="${k}" data-v="${esc(v)}" aria-pressed="${UI[k] === v}">${esc(t)}</button>`).join('')}</div>`;

const algChips = (al, tr) => `<div class="chips">${al.length ? al.map(a => `<span class="chip al">${esc(ALGN[a])}</span>`).join('') : '<span class="chip">Nessuno dei 14 allergeni</span>'}${(tr || []).map(a => `<span class="chip">Tracce: ${esc(ALGN[a].toLowerCase())}</span>`).join('')}</div>`;
/* i riquadri di «Oggi» filtrano l'elenco delle cose da fare; toccati di nuovo lo riaprono tutto */
const tile = (cls, n, label, f, ic) => `<button type="button" class="tile ${n ? cls : ''}" id="tile-${f}" data-act="todo-f" data-f="${f}" aria-pressed="${UI.todoF === f}" aria-controls="todo"><span class="ti">${ic}</span><b>${n}</b><span>${esc(label)}</span></button>`;

  if (S.mode === 'local') return `<p class="note">${IC.info}<span>I dati sono salvati solo in questo browser. Esporta un backup ogni tanto da Impostazioni.</span></p>`;

function underRow(a) {

function spark(s) {
  if (!s || s.length < 2) return '';
  const W = 72, H = 26, ps = s.map(x => x.p), lo = Math.min(...ps), hi = Math.max(...ps);
  const t0 = parseIso(s[0].date).getTime(), t1 = parseIso(s[s.length - 1].date).getTime();
  const X = x => t1 > t0 ? 4 + (parseIso(x.date).getTime() - t0) / (t1 - t0) * (W - 8) : W / 2;
  const Y = v => hi > lo ? 4 + (1 - (v - lo) / (hi - lo)) * (H - 8) : H / 2;
  const l = s[s.length - 1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${s.map(x => `${X(x).toFixed(1)},${Y(x.p).toFixed(1)}`).join(' ')}"/><circle cx="${X(l).toFixed(1)}" cy="${Y(l.p).toFixed(1)}" r="3.5"/></svg>`;
}
const dcls = x => x == null || !isFinite(x) || Math.abs(x) < 0.005 ? '' : x > 0 ? 'up' : 'down';
const arw = up => `<span class="arw" aria-hidden="true">${up ? '▲' : '▼'}</span>`;
const delta = (x, label) => (x == null || !isFinite(x)) ? '' : `<span class="chip ${dcls(x)}"><span>${Math.abs(x) < 0.005 ? 'Stabile' : `${arw(x > 0)} ${pct(x)}`}${label ? ' ' + esc(label) : ''}</span></span>`;

/* ---------- Oggi ---------- */
function rincariRecenti() {
  const t = today(), soglia = cfg().sogliaRincaro / 100, d30 = addDays(t, -30);
  return [...drv().prices.entries()].map(([id, s]) => {
    const a = S.data.articoli.get(id); if (!a || a.archiviato || s.length < 2) return null;
    const l = s[s.length - 1], pv = s[s.length - 2], ch = pv.p > 0 ? (l.p - pv.p) / pv.p : 0;
    return l.date >= d30 && ch > 0.0001 && ch >= soglia ? {a, l, pv, ch} : null;
  }).filter(Boolean).sort((x, y) => y.ch - x.ch);
}

function vOggi() {
  if (showWelcome()) return vBenvenuto();
  const Dd = drv(), t = today(), w = cfg().giorniAvviso, F = UI.todoF;
  const lots = [...Dd.acq.values(), ...Dd.prod.values()].filter(l => l.res > EPS && l.scad);
  const exp = lots.filter(l => l.scad < t).sort(byScad);
  const soon = lots.filter(l => l.scad >= t && daysBetween(t, l.scad) <= w).sort(byScad);
  const dueToday = soon.filter(l => l.scad === t), later = soon.filter(l => l.scad > t);
  const under = [...S.data.articoli.values()].filter(a => !a.archiviato && +a.scortaMin > 0 && artStock(a.id).usable < +a.scortaMin).sort(byName);
  const rincari = rincariRecenti();
  const nToday = [...S.data.produzioni.values()].filter(p => p.data === t).length;
  const active = [...Dd.prod.values()].filter(l => l.res > EPS).sort(byScad);
  const h = new Date().getHours(), greet = h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera';

  const more = !UI.todoAll && F !== 'scadenza' && later.length > 5 ? later.length - 4 : 0;
  const laterRows = (more ? later.slice(0, 4) : later).map(l => lotRow(l));

    {id: 'scaduti', f: 'scaduti', t: 'Da smaltire', tone: 'red', rows: exp.map(l => lotRow(l, smal(l))), act: exp.length > 1 && !S.ro ? '<button type="button" class="btn sm dan w" data-act="smaltisci-tutti">Smaltisci tutti</button>' : ''},

    {id: 'posta', f: '', t: 'Fatture da importare', tone: 'amb', rows: posta ? [posta] : []},
    {id: 'prossimi', f: 'scadenza', t: w === 1 ? 'Scade domani' : `Scade nei prossimi ${w} giorni`, tone: 'amb', rows: laterRows, n: later.length},
    {id: 'scorta', f: 'scorta', t: 'Da ordinare', tone: 'amb', rows: under.map(underRow)},
    {id: 'rincari', f: 'rincari', t: 'Prezzi in aumento', tone: 'red', rows: rincari.map(x => `<button type="button" class="row" data-act="open-prezzi" data-id="${esc(x.a.id)}">${av(IC.trend, 'red')}<span class="m"><b>${esc(x.a.nome)}</b><span>Rincaro: pagato ${EUR(x.l.p)} ${perU(x.a.unita)} il ${fmtD(x.l.date)}, prima ${EUR(x.pv.p)}</span><span class="mc">${delta(x.ch)}</span></span></button>`)}
  ].filter(g => g.rows.length && (!F || g.f === F));

    <div class="tiles">${tile('red', exp.length, 'Lotti scaduti da smaltire', 'scaduti', IC.alert)}${tile('amb', soon.length, w === 1 ? 'In scadenza entro domani' : `In scadenza entro ${w} giorni`, 'scadenza', IC.clock)}${tile('amb', under.length, 'Articoli sotto scorta', 'scorta', IC.box)}${tile('amb', rincari.length, 'Rincari recenti', 'rincari', IC.trend)}</div>

function vProduzione() {
  const q = UI.q.prod.trim().toLowerCase();
  let lots = [...drv().prod.values()];
  if (UI.prodF === 'attivi') lots = lots.filter(l => l.res > EPS);
  else if (UI.prodF === 'esauriti') lots = lots.filter(l => l.res <= EPS);
  if (q) lots = lots.filter(l => `${l.p.lotto} ${lotName(l)} ${l.p.operatore || ''}`.toLowerCase().includes(q));
  lots.sort((a, b) => b.data.localeCompare(a.data) || (b.p.creato || 0) - (a.p.creato || 0));
  const nRic = [...S.data.ricette.values()].filter(r => !r.archiviato).length;
  return `<section id="v-produzione"><div class="ph"><div><h1>Produzione</h1><p>Ogni lotto conserva gli ingredienti usati, i lotti dei fornitori con le loro fatture e la scadenza.</p></div>

    ${prodNav('produzione')}

    <div class="bar">${search('prod', 'Cerca lotto, prodotto o operatore')}${seg('prodF', [['attivi', 'Con giacenza'], ['esauriti', 'Esauriti'], ['tutti', 'Tutti']])}</div>
    ${lots.length ? `<div class="list">${lots.map(prodRow).join('')}</div>` : empty(q ? 'Nessun lotto corrisponde alla ricerca.' : 'Nessun lotto in questo elenco.', IC.chef)}</section>`;

function ricCard(r) {
  const al = algSort([...recAllergensOf(r, [r.id])]);
  const c = recCostOf(r, [r.id]), rq = +r.resaQta, s = ricStock(r.id), u = unitOk(r.resaUnita);

function artRow(a) {
  const s = artStock(a.id), chips = [];

  if (s.next) {
    const n = daysBetween(today(), s.next);
    if (n <= cfg().giorniAvviso) { chips.push(`<span class="chip amb">${n === 0 ? 'Scade oggi' : n === 1 ? 'Scade domani' : `Scade tra ${n} giorni`}</span>`); tone ||= 'amb'; }

  return `<button type="button" class="row" data-act="open-art" data-id="${esc(a.id)}">${av(catIc(a.categoria), tone)}
    <span class="m"><b>${esc(a.nome)}</b><span>${esc(CAT[a.categoria] || CAT.materia)} · ${s.n === 1 ? '1 lotto' : `${s.n} lotti`} in giacenza</span><span class="mc">${chips.join('')}</span></span>

function magAcq() {

function magProd() {
  const q = UI.q.mag.trim().toLowerCase(), Dd = drv();
  const out = [...S.data.ricette.values()].sort(byName).map(r => {
    const lots = (Dd.ricLots.get(r.id) || []).filter(l => l.res > EPS && (!q || `${r.nome} ${l.p.lotto}`.toLowerCase().includes(q)));

  }).join('');
  return out || empty(q ? 'Nessun prodotto corrisponde alla ricerca.' : 'Nessun prodotto in giacenza.', IC.chef);
}

/* ---------- Prezzi d'acquisto ---------- */
function vPrezzi() {
  const k = PERIODI[UI.prezziP] ? UI.prezziP : '3m', start = periodStart(k), Dd = drv(), q = UI.q.prz.trim().toLowerCase();
  const rows = [];
  for (const id of Dd.prices.keys()) { const a = S.data.articoli.get(id); if (a) rows.push({a, ps: priceStats(id, start)}); }
  const head = `<section id="v-prezzi"><div class="ph"><div><h1>Prezzi d'acquisto</h1><p>Prezzo al kg, al litro o al pezzo preso da fatture e DDT, IVA esclusa: così confronti anche confezioni di misura diversa.</p></div>
    <div class="acts"><button type="button" class="btn dl" data-act="dl-prezzi">${IC.down}Esporta CSV</button></div></div>
    <div class="subnav">${acqNav('prezzi')}</div>`;
  if (!rows.length) return head + empty('Ancora nessun prezzo: registra fatture o DDT con gli importi delle righe. Puoi inserire anche fatture vecchie spuntando «Solo storico prezzi», così vedi subito l’andamento.', IC.tag) + '</section>';
  const tot = r6(rows.reduce((t, r) => t + r.ps.extra, 0));
  const act = rows.filter(r => r.ps.inP.length && r.ps.before || r.ps.inP.length > 1);
  const up = act.filter(r => r.ps.chg > 0.005), down = act.filter(r => r.ps.chg < -0.005);
  const lbl = k === 'tutto' ? 'Dal primo acquisto registrato' : `Negli ultimi ${PERIODI[k][0]}`;
  const ref = k === 'tutto' ? 'ai primi prezzi registrati' : 'ai prezzi di inizio periodo';
  const worst = [...rows].sort((x, y) => y.ps.extra - x.ps.extra)[0], best = [...rows].sort((x, y) => x.ps.extra - y.ps.extra)[0];
  const finding = tot > 0.005
    ? `${lbl} hai speso ${EUR(tot)} in più rispetto ${ref}${worst.ps.extra > 0.005 ? `: il rincaro che pesa di più è ${worst.a.nome} (+${EUR(worst.ps.extra)})` : ''}.`
    : tot < -0.005 ? `${lbl} hai risparmiato ${EUR(-tot)} rispetto ${ref}${best.ps.extra < -0.005 ? `, soprattutto su ${best.a.nome}` : ''}.`
    : `${lbl} i prezzi sono rimasti stabili.`;
  let list = q ? rows.filter(r => String(r.a.nome).toLowerCase().includes(q)) : rows;
  list = [...list].sort((x, y) => (y.ps.extra - x.ps.extra) || ((y.ps.chg ?? 0) - (x.ps.chg ?? 0)) || byName(x.a, y.a));
  const prodRows = list.map(({a, ps}) => `<button type="button" class="row" data-act="open-prezzi" data-id="${esc(a.id)}">${av(catIc(a.categoria), ps.inP.length ? (dcls(ps.chg) === 'up' ? 'red' : dcls(ps.chg) === 'down' ? 'good' : '') : '')}
      <span class="m"><b>${esc(a.nome)}</b><span>Ultimo ${EUR(ps.last.p)} ${perU(a.unita)} il ${fmtD(ps.last.date)}${fornName(ps.last.forn) ? ' · ' + esc(fornName(ps.last.forn)) : ''}</span><span>${ps.s.length === 1 ? '1 acquisto' : ps.s.length + ' acquisti'}${Math.abs(ps.extra) >= 0.005 ? ` · ${ps.extra > 0 ? `+${EUR(ps.extra)} spesi in più` : `${EUR(-ps.extra)} risparmiati`}` : ''}</span><span class="mc">${ps.inP.length ? delta(ps.chg) : '<span class="chip">Nessun acquisto nel periodo</span>'}</span></span>
      <span class="s">${spark(ps.s)}</span></button>`).join('');
  const iva = cfg().iva;
  const imp = [...S.data.ricette.values()].filter(r => !r.archiviato).map(r => {
    const rq = +r.resaQta, now = recCostOf(r, [r.id]), then = recCostOf(r, [r.id], id => priceAt(id, start));
    if (!(rq > 0) || now.miss.length || then.miss.length || !(then.tot > 0)) return null;
    const cN = now.tot / rq, cT = then.tot / rq, pr = +r.prezzoVendita, net = pr > 0 ? pr / (1 + iva / 100) : 0;
    return {r, cN, cT, ch: (cN - cT) / cT, fN: net ? cN / net * 100 : null, fT: net ? cT / net * 100 : null};
  }).filter(x => x && Math.abs(x.ch) >= 0.005).sort((x, y) => y.ch - x.ch);
  const fc = v => num(Math.round(v * 10) / 10) + '%';
  const impRows = imp.map(x => { const u = unitOk(x.r.resaUnita); return `<button type="button" class="row" data-act="open-ric" data-id="${esc(x.r.id)}">${av(esc(x.r.sigla || autoSigla(x.r.nome)), dcls(x.ch) === 'up' ? 'red' : 'good')}<span class="m"><b>${esc(x.r.nome)}</b><span>Costo ${u === 'pz' ? 'al pezzo' : 'al ' + u}: ${EUR(x.cT)} → ${EUR(x.cN)}</span>${x.fN != null ? `<span>Food cost ${fc(x.fT)} → ${fc(x.fN)}</span>` : ''}<span class="mc">${delta(x.ch)}</span></span></button>`; }).join('');
  const missing = [...S.data.documenti.values()].filter(d => d.tipo !== 'inventario' && (d.righe || []).some(r => r.importo == null || r.importo === '')).sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));
  return head + `<div class="bar">${seg('prezziP', Object.entries(PERIODI).map(([v, [t]]) => [v, t]))}</div>
    <p class="finding">${esc(finding)}</p>
    <div class="stats"><div class="stat ${tot > 0.005 ? 'up' : tot < -0.005 ? 'down' : ''}"><b>${tot > 0.005 ? '+' : tot < -0.005 ? '−' : ''}${EUR(Math.abs(tot))}</b><span>${tot < -0.005 ? 'Risparmiati' : 'Spesi in più'} rispetto ${esc(ref)}</span></div><div class="stat"><b>${up.length}</b><span>${up.length === 1 ? 'Prodotto rincarato' : 'Prodotti rincarati'}</span></div><div class="stat"><b>${down.length}</b><span>${down.length === 1 ? 'Prodotto calato' : 'Prodotti calati'}</span></div></div>
    <h2>Prodotti</h2><p class="muted" style="margin-top:-4px">Variazione del prezzo ${k === 'tutto' ? 'dal primo acquisto registrato' : `negli ultimi ${PERIODI[k][0]}`}, dai rincari che pesano di più.</p>
    <div class="bar">${search('prz', 'Cerca prodotto')}</div>
    ${prodRows ? `<div class="list">${prodRows}</div>` : empty('Nessun prodotto corrisponde alla ricerca.', IC.search)}
    <h2>Costo delle schede</h2>
    <p class="muted" style="margin-top:-4px">Costo per unità oggi e con i prezzi di ${k === 'tutto' ? 'quando hai iniziato a registrarli' : 'inizio periodo'}.</p>
    ${impRows ? `<div class="list">${impRows}</div>` : empty('Nessuna variazione di costo nelle schede in questo periodo.', IC.doc)}
    ${missing.length ? `<h2>Prezzi da completare</h2><p class="muted" style="margin-top:-4px">${missing.length === 1 ? 'Un documento ha' : missing.length + ' documenti hanno'} righe senza importo. Quando arriva la fattura, apri il documento e inserisci gli importi: entrano subito nello storico.</p><div class="list">${missing.slice(0, 8).map(d => `<button type="button" class="row" data-act="open-doc" data-id="${esc(d.id)}">${av(DOCAB[d.tipo] || 'DOC', 'amb')}<span class="m"><b>${esc(docName(d))}</b><span>${esc(fornName(d.fornitoreId) || 'Fornitore non indicato')}</span><span class="mc"><span class="chip amb">Prezzi da inserire</span></span></span></button>`).join('')}</div>` : ''}</section>`;
}

/* ---------- fogli (dettagli e moduli) ---------- */
const stack = [];
const top = () => stack[stack.length - 1];
function openSheet(o) {
  o.prevFocus = document.activeElement;
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet${o.small ? ' small' : ''}${o.form ? ' form' : ''}" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div><div class="sh-head"><h2></h2><button type="button" class="btn icon" data-act="close" aria-label="Chiudi">${IC.x}</button></div><div class="sh-body"></div><div class="sh-foot"></div></div>`;
  wrap.addEventListener('click', e => { if (e.target === wrap) requestClose(); });
  dragToClose(wrap);
  o.el = wrap; stack.push(o);
  $('#sheets').append(wrap);
  document.documentElement.style.overflow = 'hidden';
  holdHistory();
  paintSheet(o);
  o.mount?.(o);
  const f = o.form && matchMedia('(pointer: fine)').matches ? $('.sh-body input:not([type=file]):not([disabled]), .sh-body select:not([disabled])', wrap) : null;
  (f || $('[data-act=close]', wrap)).focus({preventScroll: true});
  return o;
}
function paintSheet(o) {
  const title = typeof o.title === 'function' ? o.title() : o.title;
  const h = $('.sh-head h2', o.el); h.textContent = title; $('.sheet', o.el).setAttribute('aria-label', title);
  const b = $('.sh-body', o.el), f = $('.sh-foot', o.el);
  const html = o.body(); if (b._h !== html) { b.innerHTML = html; b._h = html; }
  const ft = o.foot ? o.foot() : '';
  if (f._h !== ft) { f.innerHTML = ft; f._h = ft; }
  f.hidden = !ft.trim();
  drawCharts(o.el);
  o.after?.(o);
}
/* trascina in basso la testata per chiudere il foglio (telefono) */
function dragToClose(wrap) {
  const sheet = $('.sheet', wrap), zones = [$('.grab', wrap), $('.sh-head', wrap)];
  let y0 = null, dy = 0, t0 = 0;
  const down = e => { if (e.target.closest('button') || matchMedia('(min-width: 760px)').matches) return; y0 = e.clientY; dy = 0; t0 = Date.now(); sheet.style.transition = 'none'; e.currentTarget.setPointerCapture?.(e.pointerId); };
  const move = e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = dy ? `translateY(${dy}px)` : ''; };
  const up = () => {
    if (y0 == null) return; y0 = null;
    const fast = dy > 60 && dy / Math.max(1, Date.now() - t0) > 0.6;
    sheet.style.transition = 'transform .22s ease-out';
    // chiudendo, il foglio riparte da dove l'ha lasciato il dito; se la chiusura non avviene torna su
    if (!(dy > 140 || fast)) { sheet.style.transform = ''; return; }
    const o = stack.find(x => x.el === wrap);
    requestClose().then(() => { if (stack.includes(o)) sheet.style.transform = ''; });
  };

}
function closeSheet() {

/* il foglio chiuso esce subito dal DOM; al suo posto scende una copia inerte, così nessuna logica aspetta l'animazione */
function leaveSheet(wrap) {
  if (!wrap.isConnected || !wrap.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) { wrap.remove(); return; }
  const body = $('.sh-body', wrap), y = body ? body.scrollTop : 0;
  const ghost = wrap.cloneNode(true), panel = ghost.firstElementChild;
  ghost.className = 'sheet-ghost'; ghost.inert = true; ghost.setAttribute('aria-hidden', 'true');
  panel.className = panel.className.replace(/\bsheet\b/, 'sheet-g');
  panel.removeAttribute('role'); panel.removeAttribute('aria-modal');
  for (const el of [ghost, ...ghost.querySelectorAll('[id],[data-act]')]) { el.removeAttribute('id'); el.removeAttribute('data-act'); }
  wrap.replaceWith(ghost);
  const gb = $('.sh-body', ghost); if (gb) gb.scrollTop = y;
  const wide = matchMedia('(min-width: 760px)').matches;
  const pa = panel.animate(wide ? [{opacity: 1, transform: 'none'}, {opacity: 0, transform: 'scale(.97) translateY(8px)'}] : [{}, {transform: 'translateY(105%)'}], {duration: wide ? 160 : 240, easing: 'cubic-bezier(.4,0,.9,.6)', fill: 'forwards'});
  ghost.animate([{opacity: 1}, {opacity: 0}], {duration: wide ? 160 : 240, easing: 'ease-in', fill: 'forwards'});

/* il tasto Indietro (del telefono o del browser) chiude il foglio in cima invece di lasciare la pagina:

const hist = {held: false, hash: '', skip: 0};
function holdHistory() {
  if (hist.held) return;

function releaseHistory() {
  queueMicrotask(() => {

    hist.held = false;

}
window.addEventListener('popstate', () => {

async function requestClose() {

}
function refreshSheets() { for (const o of stack) if (o.live) { const b = $('.sh-body', o.el), y = b.scrollTop; paintSheet(o); b.scrollTop = y; } }
function ask(msg, okLabel = 'Conferma', danger = false, noLabel = 'Annulla') {
  return new Promise(res => {
    let done = false;
    const o = openSheet({title: 'Conferma', small: true, body: () => `<p>${esc(msg)}</p>`, foot: () => `<button type="button" class="btn" data-act="ask" data-v="0">${esc(noLabel)}</button><button type="button" class="btn ${danger ? 'dan' : 'pri'}" data-act="ask" data-v="1">${esc(okLabel)}</button>`});
    o.resolve = v => { if (done) return; done = true; if (top() === o) closeSheet(); res(v); };

function toast(msg, bad, action) {
  const box = $('#toast'), t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  const sp = document.createElement('span'); sp.textContent = msg; t.append(sp);
  if (action) {

    b.addEventListener('click', () => { t.remove(); action.fn(); });

    ${d.tipo === 'ddt' && d.fatturaRif ? `<p class="muted">Fattura collegata: ${esc(d.fatturaRif)}</p>` : ''}
    ${d.soloPrezzi ? '<p class="note">Documento registrato solo per lo storico dei prezzi: non ha caricato merce in magazzino.</p>' : ''}
    ${(d.allegati || []).length ? `<h3>Allegati</h3>${allegatiHTML(d)}` : ''}
    <h3>${d.soloPrezzi ? 'Righe e prezzi' : 'Righe e lotti caricati'}</h3><div class="list">${righe || empty('Nessuna riga.')}</div>

    <div class="morebar w"><button type="button" class="btn dan" data-act="del-doc" data-id="${esc(id)}">Elimina documento</button></div>`;
}
function docFoot(id) {
  if (!S.data.documenti.get(id) || S.ro) return '';
  return `<button type="button" class="btn pri" data-act="edit-doc" data-id="${esc(id)}">Modifica documento</button>`;
}

/* ---------- moduli ---------- */
const opt = (v, t, cur) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(t)}</option>`;
const fseg = (k, cur, opts) => `<div class="seg" role="group">${opts.map(([v, t]) => `<button type="button" data-act="fseg" data-k="${k}" data-v="${esc(v)}" aria-pressed="${cur === v}">${esc(t)}</button>`).join('')}</div>`;
const algToggles = (k, arr) => `<div class="algrid">${ALG.map(([v, t]) => `<button type="button" class="altog" data-act="altog" data-k="${k}" data-v="${v}" aria-pressed="${arr.includes(v)}">${esc(t)}</button>`).join('')}</div>`;
const fornOpts = cur => [...S.data.fornitori.values()].sort(byName).map(f => opt(f.id, f.nome, cur)).join('');
/* nei documenti d'acquisto i fornitori usati di recente stanno in cima */
function fornOptsRecenti(cur) {
  const all = [...S.data.fornitori.values()].sort(byName), last = new Map();
  for (const d of S.data.documenti.values()) if (d.fornitoreId && validIso(d.data) && d.tipo !== 'inventario' && (last.get(d.fornitoreId) || '') < d.data) last.set(d.fornitoreId, d.data);
  const rec = all.filter(f => last.has(f.id)).sort((a, b) => last.get(b.id).localeCompare(last.get(a.id))).slice(0, 4);
  if (all.length <= 5 || rec.length < 2) return all.map(f => opt(f.id, f.nome, cur)).join('');
  return `<optgroup label="Usati di recente">${rec.map(f => opt(f.id, f.nome, cur)).join('')}</optgroup><optgroup label="Tutti i fornitori">${all.map(f => opt(f.id, f.nome, cur)).join('')}</optgroup>`;
}
/* gli articoli che compri di solito da un fornitore, dai più frequenti */
function artAbituali(fornId) {
  const n = new Map();
  for (const d of S.data.documenti.values()) if (fornId && d.fornitoreId === fornId) for (const r of d.righe || []) n.set(r.articoloId, (n.get(r.articoloId) || 0) + 1);
  return [...n.entries()].map(([id, k]) => ({a: S.data.articoli.get(id), k})).filter(x => x.a && !x.a.archiviato).sort((x, y) => y.k - x.k || byName(x.a, y.a)).slice(0, 8).map(x => x.a);
}
/* una data con le scelte rapide Oggi e Ieri */
function dateFld(k, label, v) {
  const t = today(), y = addDays(t, -1);
  return `<div class="fld-d"><label class="fld"><span>${esc(label)}</span><input type="date" data-k="${k}" value="${esc(v)}"></label><span class="dchips">${[[t, 'Oggi'], [y, 'Ieri']].map(([d, n]) => `<button type="button" class="dchip" data-act="dset" data-k="${k}" data-v="${d}" aria-pressed="${v === d}" aria-label="${esc(label)}: ${n.toLowerCase()}">${n}</button>`).join('')}</span></div>`;
}
const strip = o => { const c = clone(o) || {}; delete c.id; return c; };
const splitRef = ref => { const i = String(ref || '').indexOf(':'); return i < 0 ? ['art', ''] : [ref.slice(0, i), ref.slice(i + 1)]; };
const foot = (label) => `<button type="button" class="btn" data-act="close">Annulla</button><button type="button" class="btn pri" data-act="save">${esc(label)}</button>`;
/* ridisegna il modulo tenendo il punto in cui eri */
function repaintKeep(o, el) { const k = el?.dataset?.k; paintSheet(o); if (k) $(`[data-k="${k}"]`, o.el)?.focus({preventScroll: true}); }
function setPath(o, path, v) { const ks = path.split('.'); let x = o; for (let i = 0; i < ks.length - 1; i++) { x = x[ks[i]]; if (x == null) return; } x[ks[ks.length - 1]] = v; }
function artOptions(cur) {
  const arts = [...S.data.articoli.values()].filter(a => !a.archiviato || a.id === cur).sort(byName);
  return Object.keys(CAT).map(c => { const xs = arts.filter(a => (a.categoria || 'materia') === c); return xs.length ? `<optgroup label="${CAT[c]}">${xs.map(a => opt(a.id, a.nome, cur)).join('')}</optgroup>` : ''; }).join('');
}

/* articolo */
function formArticolo(id, onSaved, pre) {
  const ex = id ? S.data.articoli.get(id) : null;
  const st = ex
    ? {nome: ex.nome || '', categoria: CAT[ex.categoria] ? ex.categoria : 'materia', unita: unitOk(ex.unita) || 'kg', pesoPz: +ex.pesoPz > 0 ? fmtIn(+ex.pesoPz) : '', etichetta: ex.etichetta || '', allergeni: algSort(ex.allergeni || []), conservazione: CONS[ex.conservazione] ? ex.conservazione : 'ambiente', scortaMin: +ex.scortaMin > 0 ? fmtIn(+ex.scortaMin) : '', fornitoreId: ex.fornitoreId || '', prezzoVendita: +ex.prezzoVendita > 0 ? fmtIn(+ex.prezzoVendita) : '', note: ex.note || ''}
    : {nome: pre?.nome || '', categoria: CAT[pre?.categoria] ? pre.categoria : 'materia', unita: unitOk(pre?.unita) || 'kg', pesoPz: '', etichetta: '', allergeni: [], conservazione: 'ambiente', scortaMin: '', fornitoreId: pre?.fornitoreId && S.data.fornitori.has(pre.fornitoreId) ? pre.fornitoreId : '', prezzoVendita: '', note: ''};
  const locked = !!ex && ((drv().artLots.get(id) || []).length > 0 || [...S.data.ricette.values()].some(r => (r.ingredienti || []).some(g => g.tipo !== 'ric' && g.refId === id)));
  openSheet({form: true, st, title: ex ? 'Modifica articolo' : 'Nuovo articolo',
    body: () => `<label class="fld"><span>Nome</span><input type="text" data-k="nome" value="${esc(st.nome)}" placeholder="Es. Farina 00" autocomplete="off"></label>
      <div class="fld"><span>Tipo di articolo</span>${fseg('categoria', st.categoria, [['materia', 'Materia prima'], ['rivendita', 'Rivendita'], ['imballaggio', 'Imballaggio']])}</div>
      <div class="g2"><label class="fld"><span>Unità di giacenza</span><select data-k="unita" ${locked ? 'disabled' : ''}>${opt('kg', 'Chili (kg)', st.unita)}${opt('l', 'Litri (l)', st.unita)}${opt('pz', 'Pezzi (pz)', st.unita)}</select>${locked ? '<small class="hint">Bloccata: l’articolo ha già lotti o è in una scheda.</small>' : ''}</label>
      <label class="fld" id="f-pz" ${st.unita === 'pz' ? '' : 'hidden'}><span>Peso di un pezzo (g)</span><input type="text" inputmode="decimal" data-k="pesoPz" value="${esc(st.pesoPz)}" placeholder="Es. 55"><small class="hint">Permette di usarlo in grammi nelle ricette.</small></label></div>
      <label class="fld" id="f-pv" ${st.categoria === 'rivendita' ? '' : 'hidden'}><span>Prezzo di vendita € IVA inclusa, <span id="f-pv-u">${perU(st.unita)}</span></span><input type="text" inputmode="decimal" data-k="prezzoVendita" value="${esc(st.prezzoVendita)}" placeholder="Facoltativo" autocomplete="off"><small class="hint">Compare sul tasto del Banco e fa il totale dello scontrino.</small></label>
      <label class="fld"><span>Nome nell'elenco ingredienti</span><input type="text" data-k="etichetta" value="${esc(st.etichetta)}" placeholder="Es. farina di GRANO tenero tipo 00" autocomplete="off"><small class="hint">Scrivi in MAIUSCOLO la parola dell'allergene. Se lo lasci vuoto viene usato il nome, con l'allergene tra parentesi.</small></label>
      <div class="fld"><span>Allergeni contenuti</span>${algToggles('allergeni', st.allergeni)}</div>
      <div class="g2"><label class="fld"><span>Conservazione</span><select data-k="conservazione">${opt('ambiente', 'Ambiente', st.conservazione)}${opt('frigo', 'Frigorifero', st.conservazione)}${opt('freezer', 'Congelatore', st.conservazione)}</select></label>
      <label class="fld"><span>Scorta minima</span><input type="text" inputmode="decimal" data-k="scortaMin" value="${esc(st.scortaMin)}" placeholder="Nessuna"></label></div>
      <label class="fld"><span>Fornitore abituale</span><select data-k="fornitoreId"><option value="">Nessuno</option>${fornOpts(st.fornitoreId)}</select></label>
      <label class="fld"><span>Note</span><textarea data-k="note" rows="3">${esc(st.note)}</textarea></label>
      <p class="err" id="ferr" role="alert"></p>`,
    foot: () => foot(ex ? 'Salva modifiche' : 'Crea articolo'),
    onField: (k, o) => {
      if (k === 'unita') { $('#f-pz', o.el).hidden = st.unita !== 'pz'; $('#f-pv-u', o.el).textContent = perU(st.unita); }
      if (k === 'categoria') $('#f-pv', o.el).hidden = st.categoria !== 'rivendita';
    },
    onSave: async o => {
      const nome = st.nome.trim();
      if (!nome) return ferr(o, "Scrivi il nome dell'articolo.");
      if ([...S.data.articoli.values()].some(a => a.id !== id && String(a.nome || '').trim().toLowerCase() === nome.toLowerCase())) return ferr(o, 'Esiste già un articolo con questo nome.');
      let pesoPz = null;
      if (st.unita === 'pz' && String(st.pesoPz).trim()) { pesoPz = pnum(st.pesoPz); if (!(pesoPz > 0)) return ferr(o, 'Peso del pezzo non valido.'); }
      let sm = 0;
      if (String(st.scortaMin).trim()) { sm = pnum(st.scortaMin); if (!(sm >= 0)) return ferr(o, 'Scorta minima non valida.'); }
      // il prezzo di vendita serve solo a quello che si rivende al banco
      let pv = null;
      if (st.categoria === 'rivendita' && String(st.prezzoVendita).trim()) { pv = pnum(st.prezzoVendita); if (!(pv >= 0)) return ferr(o, 'Prezzo di vendita non valido.'); pv = pv > 0 ? r6(pv) : null; }
      const doc = {...(ex ? strip(ex) : {}), nome, categoria: st.categoria, unita: locked ? ex.unita : st.unita, pesoPz, etichetta: st.etichetta.trim(), allergeni: algSort(st.allergeni), conservazione: st.conservazione, scortaMin: sm, fornitoreId: st.fornitoreId, prezzoVendita: pv, note: st.note.trim(), archiviato: !!ex?.archiviato, creato: ex?.creato || Date.now()};
      const nid = id || uid();
      if (await put('articoli', nid, doc)) { o.dirty = false; closeSheet(); toast(ex ? 'Articolo aggiornato' : `Articolo «${nome}» creato`); onSaved?.(nid); }
    }});
}

/* documento d'acquisto: ogni riga è un lotto */
function formDocumento(id, pre) {
  const ex = id ? S.data.documenti.get(id) : null;
  const newRiga = () => ({id: uid(), articoloId: '', qta: '', unita: '', importo: '', lotto: '', scadenza: ''});
  const st = ex
    ? {tipo: TIPI[ex.tipo] ? ex.tipo : 'fattura', numero: ex.numero || '', data: ex.data || today(), fornitoreId: ex.fornitoreId || '', fatturaRif: ex.fatturaRif || '', soloPrezzi: !!ex.soloPrezzi, note: ex.note || '', allegati: clone(ex.allegati || []), righe: (ex.righe || []).map(r => ({id: r.id, articoloId: r.articoloId, qta: fmtIn(+r.qta), unita: unitOk(S.data.articoli.get(r.articoloId)?.unita) || 'kg', importo: r.importo == null || r.importo === '' ? '' : fmtIn(+r.importo), lotto: r.lotto || '', scadenza: r.scadenza || ''}))}
    : {tipo: TIPI[pre?.tipo] ? pre.tipo : 'fattura', tipoTouched: !!pre?.tipo, numero: '', data: today(), fornitoreId: pre?.fornitoreId && S.data.fornitori.has(pre.fornitoreId) ? pre.fornitoreId : '', fatturaRif: '', soloPrezzi: false, note: '', allegati: [], righe: pre?.articoloId ? [{...newRiga(), articoloId: pre.articoloId, unita: unitOk(S.data.articoli.get(pre.articoloId)?.unita) || 'kg'}] : [newRiga()]};
  if (!st.righe.length) st.righe.push(newRiga());
  const priceOnly = () => st.soloPrezzi && st.tipo !== 'inventario';
  const usedLot = rid => { if (!ex) return null; const l = drv().acq.get(`${id}:${rid}`); return l && (l.used.length || l.mov.length) ? l : null; };
  const rigaHTML = (r, i) => {
    const a = S.data.articoli.get(r.articoloId), units = a ? buyUnits(a.unita) : ['kg'], used = usedLot(r.id), abit = artAbituali(st.fornitoreId);
    return `<div class="card"><div class="card-h"><b>Riga ${i + 1}</b>${used ? '<span class="chip">Già usata o scaricata</span>' : st.righe.length > 1 ? `<button type="button" class="btn" data-act="del-riga" data-i="${i}">Togli riga</button>` : ''}</div>
      <label class="fld"><span>Articolo</span><select data-k="righe.${i}.articoloId" ${used ? 'disabled' : ''}><option value="">Scegli l'articolo…</option>${abit.length ? `<optgroup label="Di solito da ${esc(fornName(st.fornitoreId))}">${abit.map(a => opt(a.id, a.nome, r.articoloId)).join('')}</optgroup>` : ''}${artOptions(r.articoloId)}<option value="__new">+ Nuovo articolo…</option></select></label>
      <div class="g3"><label class="fld"><span>Quantità</span><input type="text" inputmode="decimal" data-k="righe.${i}.qta" value="${esc(r.qta)}" placeholder="0" autocomplete="off"></label>
      <label class="fld"><span>Unità</span><select data-k="righe.${i}.unita">${units.map(u => opt(u, u, units.includes(r.unita) ? r.unita : units[0])).join('')}</select></label>
      <label class="fld"><span>Importo € senza IVA</span><input type="text" inputmode="decimal" data-k="righe.${i}.importo" value="${esc(r.importo)}" placeholder="0,00" autocomplete="off"></label></div>
      <div class="g2" ${priceOnly() ? 'hidden' : ''}><label class="fld"><span>Lotto del fornitore</span><input type="text" data-k="righe.${i}.lotto" value="${esc(r.lotto)}" placeholder="Come sulla confezione" autocomplete="off"></label>
      <label class="fld"><span>Scadenza</span><input type="date" data-k="righe.${i}.scadenza" value="${esc(r.scadenza)}"></label></div></div>`;
  };
  const attHTML = o => `<div class="att">${st.allegati.map((a, i) => `<span class="chip">${esc(a.nome || 'Allegato')}<button type="button" class="attx" data-act="del-att" data-i="${i}" aria-label="Togli ${esc(a.nome || 'allegato')}">×</button></span>`).join('')}</div>
    ${S.assets ? `<label class="btn">${IC.plus}Allega foto o PDF<input type="file" accept="image/*,application/pdf" data-file="att" multiple></label>${o?.uploading ? ' <span class="hint">Caricamento in corso…</span>' : ''}` : '<small class="hint">Gli allegati si possono aggiungere aprendo la pagina su claude.ai come proprietario o editor.</small>'}`;
  openSheet({form: true, st, title: ex ? 'Modifica documento' : 'Registra acquisto',
    body: () => { const o = stack.find(x => x.st === st); return `<div class="fld"><span>Tipo di documento</span>${fseg('tipo', st.tipo, [['fattura', 'Fattura'], ['ddt', 'DDT'], ['scontrino', 'Scontrino'], ['inventario', 'Inventario iniziale']])}</div>
      ${st.tipo === 'inventario' ? '<p class="note">«Inventario iniziale» serve a caricare la merce che hai già in magazzino quando cominci a usare Barista Flow.</p>' : ''}

      ${dateFld('data', 'Data', st.data)}</div>
      <label class="fld"><span>Fornitore${st.tipo === 'inventario' ? ' (facoltativo)' : ''}</span><select data-k="fornitoreId"><option value="">Scegli il fornitore…</option>${fornOptsRecenti(st.fornitoreId)}<option value="__new">+ Nuovo fornitore…</option></select></label>
      ${st.tipoAuto ? `<p class="hint" style="margin:-6px 0 14px">${esc(TIPI[st.tipo] || 'Documento')}, come l’ultimo documento di ${esc(fornName(st.fornitoreId))}.</p>` : ''}
      ${st.tipo === 'ddt' ? `<label class="fld"><span>Fattura collegata (facoltativa)</span><input type="text" data-k="fatturaRif" value="${esc(st.fatturaRif)}" placeholder="Es. n. 1203 del 30/11, quando arriva" autocomplete="off"></label>` : ''}
      ${st.tipo !== 'inventario' ? `<label class="chk"><input type="checkbox" data-k="soloPrezzi" ${st.soloPrezzi ? 'checked' : ''}>Solo storico prezzi: non carica merce in magazzino</label><p class="hint" style="margin:-4px 0 14px">Per inserire fatture vecchie e vedere subito l’andamento dei prezzi, senza toccare le giacenze.</p>` : ''}
      <div class="fld"><span>Foto o PDF del documento</span>${attHTML(o)}</div>
      <h3>Righe del documento</h3><p class="hint" style="margin:-4px 0 10px">${priceOnly() ? 'Per lo storico bastano articolo, quantità e importo della riga.' : 'Ogni riga diventa un lotto in magazzino: indica il lotto e la scadenza scritti sulla confezione. L’importo serve allo storico dei prezzi.'}</p>
      ${st.righe.map(rigaHTML).join('')}
      <p><button type="button" class="btn" data-act="add-riga">${IC.plus}Aggiungi riga</button></p>
      <label class="fld"><span>Note</span><textarea data-k="note" rows="3">${esc(st.note)}</textarea></label>
      <p class="err" id="ferr" role="alert"></p>`; },
    foot: () => foot(ex ? 'Salva modifiche' : 'Registra documento'),
    onField: (k, o, kind, el) => {
      const m = k.match(/^righe\.(\d+)\.articoloId$/);
      if (m) {
        const r = st.righe[+m[1]];
        if (r.articoloId === '__new') { r.articoloId = ''; el.value = ''; formArticolo(null, nid => { r.articoloId = nid; r.unita = unitOk(S.data.articoli.get(nid)?.unita) || 'kg'; paintSheet(o); }); return; }
        r.unita = unitOk(S.data.articoli.get(r.articoloId)?.unita) || 'kg'; paintSheet(o); return;
      }
      if (k === 'fornitoreId' && st.fornitoreId === '__new') { st.fornitoreId = ''; el.value = ''; formFornitore(null, nid => { st.fornitoreId = nid; paintSheet(o); }); return; }
      if (k === 'fornitoreId') {

async function uploadAtt(o, files) {
  if (!S.assets) return;

    const n = String(f.name || '');

    if (!type) { toast(`${n}: formato non supportato. Usa una foto JPG o PNG oppure un PDF.`, true); continue; }
    try { const r = await S.assets.upload(f, {type}); o.st.allegati.push({id: r.id, nome: n.slice(0, 120) || 'Allegato', tipo: type}); o.dirty = true; }
