<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d0c" media="(prefers-color-scheme: dark)">
<meta name="description" content="Barista Flow: schede tecniche, lotti di produzione, scadenze, giacenze e prezzi d'acquisto per bar e laboratori.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barista Flow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Barista Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<style>
/* VOICE: un'app da banco moderna e calma, veloce da usare con una mano sola
   IDEA: superfici chiare come un bancone pulito; l'espresso solo per azioni e navigazione; i lotti come etichette di laboratorio
   PICTURE: la giornata al banco: riepilogo, cose da fare con azione diretta, etichette in vetrina
   COLOUR and TYPE: latte e bianco, espresso per le azioni, rosso/ambra/verde solo per gli stati; Plus Jakarta Sans
   LAYOUT: barra in alto traslucida, tab in basso con il + al centro sul telefono, barra laterale da 960px */
:root{
  color-scheme:light dark;
  --bg:light-dark(#f4f1ed,#0f0d0c);
  --surf:light-dark(#ffffff,#1b1816);
  --surf2:light-dark(#f0ebe5,#26221f);
  --surf3:light-dark(#e6dfd7,#322d29);
  --edge:light-dark(rgba(0,0,0,0),rgba(255,255,255,.06));
  --ink:light-dark(#1d1714,#f4efea);
  --ink2:light-dark(#6c625a,#b4aaa0);
  --ink3:light-dark(#a0968d,#80766e);
  --line:light-dark(rgba(29,23,20,.09),rgba(255,255,255,.09));
  --pri:light-dark(#2d1e16,#f1e3d1);
  --onpri:light-dark(#ffffff,#1d1714);
  --pritint:light-dark(rgba(45,30,22,.08),rgba(241,227,209,.12));
  --link:light-dark(#8c4c12,#e8ae70);
  --red:light-dark(#c3281c,#ff9286);
  --redbg:light-dark(#fdebe8,#3b1714);
  --redf:light-dark(#d92d20,#d8433a);
  --amb:light-dark(#9c4f05,#ffcb6b);
  --ambbg:light-dark(#fff2d4,#392a0d);
  --ambf:light-dark(#f5a623,#e39b24);
  --good:light-dark(#127a39,#4fd17a);
  --goodbg:light-dark(#e2f5e7,#13301d);
  --s1:light-dark(#2a78d6,#3987e5);
  --s2:light-dark(#eb6834,#d95926);
  --s3:light-dark(#1baf7a,#199e70);
  --sh1:0 1px 2px light-dark(rgba(40,25,15,.06),rgba(0,0,0,.4)),0 2px 6px light-dark(rgba(40,25,15,.04),rgba(0,0,0,.2));
  --sh2:0 12px 32px light-dark(rgba(40,25,15,.12),rgba(0,0,0,.5)),0 3px 8px light-dark(rgba(40,25,15,.06),rgba(0,0,0,.3));
  --f:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tb:58px;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-padding-top:90px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
p{margin:0 0 10px}
.muted{color:var(--ink2)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--link) 55%,transparent);outline-offset:2px}

/* barra in alto */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;height:calc(var(--tb) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0 16px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:saturate(170%) blur(18px);-webkit-backdrop-filter:saturate(170%) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.tb-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;transition:opacity .18s}
.tb-names{display:grid;line-height:1.15;min-width:0}
.tb-names b{font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-names small{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title{position:absolute;left:64px;right:110px;bottom:0;height:var(--tb);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:17px;opacity:0;pointer-events:none;transition:opacity .18s;white-space:nowrap;overflow:hidden}
.topbar.scrolled .tb-brand{opacity:0}
.topbar.scrolled .tb-title{opacity:1}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(150deg,#4a3022,#22150f);color:#f3e5d3;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.logo svg{width:24px;height:24px}
.sync{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.sync.warn{background:var(--ambbg);color:var(--amb)}
.sync:empty{display:none}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;flex:none;text-decoration:none}
.iconbtn:hover{background:var(--surf2)}
.searchbox{display:none}

/* navigazione */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:saturate(170%) blur(18px);-webkit-backdrop-filter:saturate(170%) blur(18px);border-top:1px solid var(--line)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;padding:3px 0 2px;color:var(--ink2);text-decoration:none;font-size:13px;font-weight:650;letter-spacing:-.01em;line-height:1.1}
.tabs a .ic{display:grid;place-items:center;width:58px;height:32px;border-radius:999px;transition:background .2s}
.tabs a[aria-current=page]{color:var(--ink);font-weight:800}
.tabs a[aria-current=page] .ic{background:var(--pritint)}
.fab{justify-self:center;align-self:center;display:grid;place-items:center;width:58px;height:58px;margin-top:-22px;border-radius:20px;border:0;background:var(--pri);color:var(--onpri);box-shadow:var(--sh2);cursor:pointer;transition:transform .12s}
.fab:active{transform:scale(.94)}
.fab svg.i{width:28px;height:28px;stroke-width:2.2}
.tabs .side-brand,.tabs .newbtn,.tabs .side-only{display:none}
main{display:block;padding:6px 16px calc(124px + env(safe-area-inset-bottom));max-width:1140px;margin:0 auto;outline:none}
@media(min-width:960px){
  .app{display:grid;grid-template-columns:264px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100dvh}
  .tabs{position:sticky;top:0;grid-row:1/3;grid-column:1;height:100dvh;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:18px 14px 18px;background:var(--surf);border-top:0;border-right:1px solid var(--line);backdrop-filter:none;-webkit-backdrop-filter:none}
  .tabs .side-brand{display:flex;align-items:center;gap:10px;margin:2px 8px 20px}
  .tabs .newbtn{display:flex;margin:0 0 16px;justify-content:flex-start}
  .tabs a{flex-direction:row;gap:12px;min-height:46px;padding:0 12px;border-radius:13px;font-size:15.5px;font-weight:650}
  .tabs a .ic{width:auto;height:auto;background:none!important}
  .tabs a:hover{background:var(--surf2)}
  .tabs a[aria-current=page]{background:var(--pritint)}
  .tabs .side-only{display:flex;margin-top:auto}
  .fab{display:none}
  .topbar{grid-column:2;padding:0 28px;gap:10px}
  .tb-brand{display:none}
  .tb-title{left:28px;right:auto;justify-content:flex-start}
  .topbar.scrolled .tb-title{opacity:1}
  .searchbox{display:flex;align-items:center;gap:10px;margin-left:auto;width:min(380px,40vw);height:42px;padding:0 14px;border-radius:13px;border:0;background:var(--surf2);color:var(--ink3);font-size:15px;cursor:pointer}
  .searchbox kbd{margin-left:auto;font:600 12.5px var(--f);padding:2px 7px;border-radius:6px;background:var(--surf);color:var(--ink2);box-shadow:var(--sh1)}
  .topbar .iconbtn.search,.topbar #cfgLink{display:none}
  main{grid-column:2;grid-row:2;margin:0 auto;width:100%;padding:8px 40px 64px}
}

/* testate */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 18px;margin:4px 0 20px}
.ph h1{font-size:clamp(30px,7.5vw,40px);line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--ink2);max-width:62ch;font-size:15.5px}
.ph .kick{margin:0 0 4px;font-size:15px;font-weight:650;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
h2{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:20px;line-height:1.2;font-weight:780;letter-spacing:-.015em;margin:30px 0 12px}
h2 .h2a{display:flex;gap:6px}
h3{font-size:16px;line-height:1.3;font-weight:750;margin:22px 0 10px;color:var(--ink)}
.subnav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}

/* bottoni e campi */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;min-height:48px;padding:0 18px;border:0;border-radius:14px;background:var(--surf2);color:var(--ink);font-weight:700;font-size:15.5px;line-height:1;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .08s,background .15s,opacity .15s}
.btn:hover{background:var(--surf3)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);color:var(--onpri)}
.btn.pri:hover{background:color-mix(in srgb,var(--pri) 88%,var(--bg))}
.btn.dan{background:var(--redbg);color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{height:40px;min-height:40px;padding:0 14px;border-radius:12px;font-size:14.5px}
.btn.icon{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn input[type=file]{display:none}
.lnk{appearance:none;background:none;border:0;padding:2px 0;color:var(--link);font-weight:700;cursor:pointer;text-align:left;text-decoration:none}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
input[type=text],input[type=search],input[type=date],select,textarea{width:100%;min-height:48px;padding:10px 14px;font-size:16px;color:var(--ink);background:var(--surf2);border:1.5px solid transparent;border-radius:14px;transition:border-color .15s,background .15s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);background-color:var(--surf)}
input[disabled],select[disabled]{opacity:.55}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.fld{display:grid;gap:6px;margin:0 0 14px}
.fld>span{font-size:14px;font-weight:700;color:var(--ink2)}
.hint{display:block;font-size:14px;color:var(--ink2);margin:2px 0 0;line-height:1.4}
.err{color:var(--red);font-weight:700;background:var(--redbg);padding:10px 14px;border-radius:12px}
.err:empty{display:none}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}
@media(max-width:520px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g3>:first-child{grid-column:1/-1}}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:650;margin:0 0 6px}
.chk input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:15px;background:var(--surf3);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{appearance:none;flex:none;min-height:40px;padding:0 15px;border:0;border-radius:11px;background:transparent;color:var(--ink2);font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--surf);color:var(--ink);box-shadow:var(--sh1)}
.sheet .seg{background:var(--surf2)}
.fld .seg{flex-wrap:wrap;overflow:visible}
.algrid{display:flex;flex-wrap:wrap;gap:8px}
.altog{appearance:none;min-height:42px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font-weight:650;font-size:14.5px;cursor:pointer}
.altog[aria-pressed=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.srch{position:relative;flex:1 1 240px}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--ink3);pointer-events:none}
.srch input{padding-left:42px;background:var(--surf);box-shadow:var(--sh1),inset 0 0 0 1px var(--edge)}
.sheet .srch input{background:var(--surf2);box-shadow:none}

/* elementi */
.chip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;line-height:1.25;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.chip.red,.chip.up{background:var(--redbg);color:var(--red)}
.chip.amb{background:var(--ambbg);color:var(--amb)}
.chip.down,.chip.okk{background:var(--goodbg);color:var(--good)}
.chip.al{background:var(--surf);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.ok{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.up{color:var(--red)}.down{color:var(--good)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surf);border-radius:16px;padding:12px 14px;font-size:14.5px;color:var(--ink2);margin:0 0 16px;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge)}
.note.warn{background:var(--ambbg);color:var(--amb);box-shadow:none}
.note svg.i{width:20px;height:20px;margin-top:1px}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:26px 20px;border-radius:20px;background:var(--surf);color:var(--ink2);box-shadow:var(--sh1),inset 0 0 0 1px var(--edge);font-size:15px}
.empty .ei{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--surf2);color:var(--ink2)}
.sheet .empty{box-shadow:inset 0 0 0 1px var(--line)}

/* liste raggruppate */
.list{display:block;background:var(--surf);border-radius:20px;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:11px 14px;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none}
div.row{cursor:default}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:66px;border-top:1px solid var(--line)}
.list.plain .row+.row::before{left:14px}
button.row:hover,.row.has-act:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
button.row::after{content:"";flex:none;width:8px;height:8px;margin:0 2px 0 0;border-top:2px solid var(--ink3);border-right:2px solid var(--ink3);transform:rotate(45deg)}
.row .av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--surf2);color:var(--ink2);font-weight:800;font-size:12.5px;letter-spacing:-.01em;text-align:center;line-height:1}
.row .av svg.i{width:20px;height:20px}
.av.red{background:var(--redbg);color:var(--red)}
.av.amb{background:var(--ambbg);color:var(--amb)}
.av.good{background:var(--goodbg);color:var(--good)}
.av.pri{background:var(--pri);color:var(--onpri)}
.row .m{flex:1;display:grid;gap:1px;min-width:0}
.row .m b{font-weight:700;font-size:16px;line-height:1.3}
.row .m span{font-size:14px;color:var(--ink2);line-height:1.38}
.row .s{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right;max-width:45%}
.row .s:empty{display:none}
.row .mc{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.row .mc:empty{display:none}
.row.has-act{padding:0 12px 0 0;cursor:default}
.row-main{flex:1;display:flex;align-items:center;gap:12px;min-width:0;min-height:66px;padding:11px 0 11px 14px;border:0;background:none;text-align:left;color:inherit;cursor:pointer}
.q{font-weight:800;font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.q small{font-weight:600;color:var(--ink2);font-size:13px}
.grp{margin:0 0 22px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 4px 8px}

/* indicatori */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 4px}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:108px;padding:14px;border:0;border-radius:20px;background:var(--surf);color:var(--ink);text-align:left;cursor:pointer;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge);transition:transform .08s}
.tile:active{transform:scale(.98)}
.tile .ti{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--surf2);color:var(--ink2)}
.tile .ti svg.i{width:20px;height:20px}
.tile b{font-size:32px;line-height:1;font-weight:800;letter-spacing:-.03em}
.tile span{font-size:14px;line-height:1.25;font-weight:650;color:var(--ink2)}
.tile.red .ti{background:var(--redbg);color:var(--red)}.tile.red b{color:var(--red)}
.tile.amb .ti{background:var(--ambbg);color:var(--amb)}.tile.amb b{color:var(--amb)}

/* etichette dei lotti */
.labels{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,80%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:0 -16px;padding:4px 16px 16px;scrollbar-width:none;outline:none}
.labels::-webkit-scrollbar{display:none}
.labels>*{scroll-snap-align:start}
@media(min-width:960px){.labels{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-columns:auto;overflow:visible;margin:0;padding:4px 0 6px}.carnav{display:none!important}}
.lab{appearance:none;position:relative;display:flex;flex-direction:column;border:0;border-radius:20px;padding:0;background:var(--surf);color:var(--ink);text-align:left;cursor:pointer;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge);transition:transform .08s}
.lab:active{transform:scale(.985)}
.lab-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-radius:20px 20px 0 0;background:var(--pritint);color:var(--ink);font-size:13px;font-weight:750}
.lab.red .lab-top{background:var(--redf);color:#fff}
.lab.amb .lab-top{background:var(--ambf);color:#2a1800}
.lab-body{position:relative;display:grid;gap:3px;padding:12px 16px 14px}
.lab-body::before,.lab-body::after{content:"";position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.lab-body::before{left:-8px}.lab-body::after{right:-8px}
.lab-name{font-size:18px;line-height:1.25;font-weight:780;letter-spacing:-.01em}
.lab-lot{font-size:14px;font-weight:750;color:var(--ink2);font-variant-numeric:tabular-nums}
.lab-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px;padding-top:12px;border-top:1.5px dashed var(--line)}
.lab-grid small{display:block;font-size:12.5px;color:var(--ink2);font-weight:600}
.lab-grid b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}

/* schede tecniche */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.rc{appearance:none;display:grid;gap:10px;align-content:start;padding:16px;border:0;border-radius:20px;background:var(--surf);color:var(--ink);text-align:left;cursor:pointer;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge);transition:transform .08s}
.rc:active{transform:scale(.985)}
.rc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rc-h b{font-size:18px;line-height:1.25;font-weight:780;letter-spacing:-.01em}
.rc-m{font-size:14px;color:var(--ink2)}
.rc-f{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:14px;font-weight:650;padding-top:10px;border-top:1px solid var(--line)}

/* dettagli */
.dh{display:grid;gap:8px;justify-items:start;margin:0 0 6px}
.dh .muted{font-size:15px;font-weight:650;margin:0}
.big{font-size:clamp(28px,7.5vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin:14px 0 8px}
.kv>div{background:var(--surf);border-radius:16px;padding:12px 14px;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge)}
.kv small{display:block;font-size:13px;color:var(--ink2);line-height:1.3;font-weight:600}
.kv b{display:block;font-size:21px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.3}
.kv b.up{color:var(--red)}.kv b.down{color:var(--good)}
.trace{display:grid;gap:10px}
.tr{background:var(--surf);border-radius:16px;padding:12px 14px;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge)}
.tr.warn{background:var(--ambbg);box-shadow:none}
.tr-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tr-h b{font-weight:750}
.tr-meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;color:var(--ink2);margin-top:4px}
.tr .sub{display:grid;gap:8px;margin:12px 0 2px 2px;padding-left:12px;border-left:2px solid var(--line)}
.tr .sub .tr{background:var(--bg);box-shadow:none}
.labeltext{background:var(--surf);border-radius:16px;padding:14px 16px;line-height:1.6;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge)}
.labeltext b{font-weight:800}
.tw{border-radius:16px;overflow:hidden;background:var(--surf);box-shadow:var(--sh1),inset 0 0 0 1px var(--edge)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:13px;color:var(--ink2);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:800;background:var(--surf2)}
.tbl small{display:block;color:var(--ink2);font-size:13px}
.prose{white-space:pre-wrap;background:var(--surf);border-radius:16px;padding:14px 16px;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge);line-height:1.6}
.morebar{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
.att{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.att a{display:inline-flex;align-items:center;gap:8px;color:var(--link);font-weight:700;text-decoration:none}
.att img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:var(--surf2)}
.attx{appearance:none;border:0;background:none;color:var(--ink2);font-size:18px;line-height:1;min-width:32px;min-height:32px;cursor:pointer;border-radius:8px}

/* moduli */
.card{background:var(--surf);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge)}
.sheet.form .card{background:var(--bg);box-shadow:none}
.sheet.form .card input,.sheet.form .card select{background-color:var(--surf)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
.card-h b{font-size:16px}
.ing-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
.lotpick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lotpick .t{display:grid;gap:1px}
.lotpick .t b{font-size:15px}
.lotpick .t span{font-size:13.5px;color:var(--ink2)}
.lotpick .in{display:flex;align-items:center;gap:6px;flex:none}
.lotpick input{width:100px;text-align:right}
.preview{background:var(--bg);border-radius:18px;padding:14px 16px;margin:6px 0 14px}
.preview h3{margin:0 0 8px}
.preview p{margin:0 0 8px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{text-align:center}
.stepper .btn{flex:none;width:48px;padding:0}
.lotcode{display:flex;align-items:center;gap:10px;margin:2px 0 14px;padding:12px 14px;border-radius:16px;background:var(--bg);font-weight:700}
.lotcode b{font-size:18px;font-variant-numeric:tabular-nums}

/* fogli che salgono dal basso */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,10,8,.44);animation:fade .2s ease-out}
.sheet{position:relative;width:100%;max-width:780px;max-height:calc(100dvh - 12px - env(safe-area-inset-top));display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.2);animation:up .3s cubic-bezier(.2,.85,.25,1);will-change:transform}
.sheet.form{height:calc(100dvh - 12px - env(safe-area-inset-top));background:var(--surf)}
.sheet.small{max-width:460px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--surf3);margin:8px auto 0;flex:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:6px 12px 10px 20px;touch-action:none;cursor:grab;user-select:none}
.sh-head h2{flex:1;margin:0;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .btn.icon{background:var(--surf2)}
.sh-body{flex:1;overflow:auto;padding:4px 16px 28px;overscroll-behavior:contain}
.sh-body>:first-child{margin-top:0}
.sh-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);background:inherit;border-radius:0}
.sh-foot .btn{flex:1 1 0}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:760px){
  .sheet-wrap{align-items:center;padding:24px}
  .sheet,.sheet.form{height:auto;max-height:calc(100dvh - 48px);border-radius:26px}
  .grab{display:none}
  .sh-head{padding-top:14px;cursor:default}
  .sh-foot{border-radius:0 0 26px 26px}
  .sh-foot .btn{flex:0 0 auto}
}

/* azioni rapide e ricerca */
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa{appearance:none;display:grid;gap:8px;align-content:start;min-height:112px;padding:14px;border:0;border-radius:18px;background:var(--surf);color:var(--ink);text-align:left;cursor:pointer;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge);transition:transform .08s}
.qa:active{transform:scale(.97)}
.qa .ti{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--pritint);color:var(--ink)}
.qa b{font-size:16px;font-weight:780;line-height:1.2;color:var(--ink)}
.qa span span{font-size:13.5px;color:var(--ink2);line-height:1.3}
.qa.main b{color:inherit}
.qa.main{grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr;align-items:center;background:var(--pri);color:var(--onpri)}
.qa.main .ti{background:rgba(255,255,255,.14);color:inherit}
.qa.main span span{color:inherit;opacity:.8}
.sres h3{margin:18px 4px 8px;font-size:13px;color:var(--ink2);font-weight:750}

/* analisi prezzi */
.finding{font-size:19px;line-height:1.4;font-weight:700;letter-spacing:-.01em;margin:0 0 16px;max-width:62ch;text-wrap:pretty}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 6px}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}.stats>:first-child{grid-column:1/-1}}
.stat{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:96px;padding:14px 16px;border-radius:20px;background:var(--surf);box-shadow:var(--sh1),inset 0 0 0 1px var(--edge)}
.stat b{font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.stat span{font-size:14px;line-height:1.3;color:var(--ink2);font-weight:650}
.stat.up{background:var(--redbg);box-shadow:none}.stat.up b{color:var(--red)}
.stat.down{background:var(--goodbg);box-shadow:none}.stat.down b{color:var(--good)}
.spark{flex:none;display:block}
.spark polyline{fill:none;stroke:var(--ink3);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--s1);stroke:var(--surf);stroke-width:1.5}
.chartcard{background:var(--surf);border-radius:20px;padding:14px 10px 8px;margin:14px 0 6px;box-shadow:var(--sh1),inset 0 0 0 1px var(--edge)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;font-weight:650;color:var(--ink2);margin:0 6px 6px}
.legend span{display:inline-flex;align-items:center;gap:8px}
i.k{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;background:var(--s1)}
i.k.c1{background:var(--s2)}i.k.c2{background:var(--s3)}
.fig{position:relative;height:clamp(230px,44vw,320px);outline:none;touch-action:pan-y;border-radius:10px}
.fig:focus-visible{outline:3px solid color-mix(in srgb,var(--link) 55%,transparent);outline-offset:2px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig .gl{stroke:var(--line);stroke-width:1}
.fig .ax{fill:var(--ink2);font-size:13px;font-family:var(--f);font-variant-numeric:tabular-nums}
.fig .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke:var(--s1)}
.fig .ln.c1{stroke:var(--s2)}.fig .ln.c2{stroke:var(--s3)}
.fig .pt{fill:var(--s1);stroke:var(--surf);stroke-width:2}
.fig .pt.c1{fill:var(--s2)}.fig .pt.c2{fill:var(--s3)}
.fig .xh{stroke:var(--ink2);stroke-width:1}
.fig .lbl{fill:var(--ink);font-size:13px;font-weight:800;font-family:var(--f)}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--surf);border-radius:12px;padding:9px 12px;box-shadow:var(--sh2),inset 0 0 0 1px var(--line);min-width:160px;max-width:230px}
.tip .d{font-size:13px;color:var(--ink2);margin:0 0 4px;font-weight:600}
.tip .r{display:grid;grid-template-columns:16px 1fr;gap:0 8px;align-items:center;margin-top:4px}
.tip b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.tip small{grid-column:2;color:var(--ink2);font-size:13px;line-height:1.3}
.tbl td small .lnk{font-size:13px}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack tr:last-child{border-bottom:0}.stack td{display:flow-root;border:0;padding:3px 14px;padding-inline-start:calc(14px + 7.5em);text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--ink2);font-size:13px;white-space:normal}.stack td.n{text-align:start}}

.setgrp{margin:0 0 22px}

.welcome .logo{width:64px;height:64px;border-radius:20px}
.welcome .logo svg{width:38px;height:38px}

.wl-hint{margin:14px 2px 0;max-width:680px}

.demo .m span{font-size:14.5px;color:var(--ink2);line-height:1.4}
.demo-a{display:flex;flex-wrap:wrap;gap:8px}
.demo .btn:not(.pri):not(.dan){background:color-mix(in srgb,var(--surf) 75%,transparent)}
@media(max-width:600px){.demo-a{width:100%}.demo-a .btn{flex:1 1 0}}
.steps{margin:0 0 22px}
.steps-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.steps-h h2{margin:0}
.steps-h .lnk{margin-left:auto}
.row.done .m b{color:var(--ink2)}
.prog{height:10px;border-radius:5px;background:var(--surf2);overflow:hidden;margin:4px 0 12px}
.prog span{display:block;height:100%;border-radius:5px;background:var(--pri);transition:width .2s}
.regbox p{margin:0 0 12px}
button.sync{border:0;cursor:pointer}
.dp-s{display:none}

/* importazione delle fatture elettroniche */
.fe-line .fe-d{margin:0 0 2px;line-height:1.35;overflow-wrap:anywhere}

#toast{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:90;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;width:max-content;max-width:min(100%,520px);padding:12px 12px 12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:650;font-size:15px;line-height:1.35;box-shadow:var(--sh2);pointer-events:auto;animation:up .22s cubic-bezier(.2,.85,.25,1)}
.toast.bad{background:var(--redf);color:#fff}
.toast button{appearance:none;flex:none;border:0;background:color-mix(in srgb,var(--bg) 16%,transparent);color:inherit;font-weight:800;font-size:14.5px;min-height:36px;padding:0 12px;border-radius:10px;cursor:pointer}

.skel{display:grid;gap:14px;padding-top:6px}
.sk{border-radius:16px;background:linear-gradient(90deg,var(--surf2) 0%,var(--surf3) 50%,var(--surf2) 100%);background-size:200% 100%;animation:shim 1.3s linear infinite}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

body.ro .w{display:none!important}

"use strict";
{

/* archivio locale: usato fuori da claude.ai (dati nel browser) o in prova (dati in memoria) */
function localDB(key) {
  let store = {};
  if (key) { try { store = JSON.parse(lsGet(key) || '{}') || {}; } catch { store = {}; } }
  const subs = {};
  const save = () => { if (key) lsSet(key, JSON.stringify(store)); };
  const snap = c => {
    const docs = Object.entries(store[c] || {}).map(([id, v]) => ({id, exists: true, data: () => v, metadata: {fromCache: false, hasPendingWrites: false}}));
    return {docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {fromCache: false, hasPendingWrites: false}};
  };
  const emit = c => setTimeout(() => (subs[c] || []).forEach(f => f(snap(c))), 0);
  return {
    collection(c) {
      return {
        onSnapshot(next) { (subs[c] ||= []).push(next); emit(c); return () => { subs[c] = subs[c].filter(f => f !== next); }; },
        doc(id) {
          return {
            async set(v) { (store[c] ||= {})[id] = clone(v); save(); emit(c); },
            async delete() { if (store[c]) delete store[c][id]; save(); emit(c); },
            async get() { const v = store[c]?.[id]; return {id, exists: !!v, data: () => v}; }
          };
        }
      };
    },
    /* tante scritture insieme, salvate una volta sola */
    async bulk(ops) {
      for (const [c, id, v] of ops) { if (v == null) { if (store[c]) delete store[c][id]; } else (store[c] ||= {})[id] = clone(v); }
      save(); [...new Set(ops.map(o => o[0]))].forEach(emit);
    }
  };
}

async function put(col, id, doc, quiet) {
  doc = clone(doc); delete doc.id;
  if (col !== 'impostazioni' && !doc.esempio && !S.data[col].has(id) && countSample()) doc.esempio = true;   // durante la prova anche quello che crei è di prova
  S.data[col].set(id, {...doc, id}); bump();
  for (let tent = 0; tent < 2; tent++) {
    try { await S.db.collection(col).doc(id).set(doc); return true; }
    catch (e) {
      if (tent === 0 && (e?.code === 'unavailable' || e?.code === 'resource_exhausted')) { await sleep(700 + Math.random() * 900); continue; }
      if (!quiet) dbErr(e);
      return false;
    }
  }
  return false;
}
async function del(col, id, quiet) {
  S.data[col].delete(id); bump();
  try { await S.db.collection(col).doc(id).delete(); return true; }
  catch (e) { if (!quiet) dbErr(e); return false; }
}
function dbErr(e) {
  const c = e?.code;
  if (c === 'invalid_argument') toast('Salvataggio rifiutato: probabilmente hai solo accesso in lettura.', true);
  else if (c === 'quota_exceeded') toast("L'archivio è pieno: esporta un backup ed elimina dati vecchi.", true);
  else if (c === 'resource_exhausted') toast('Troppe operazioni ravvicinate: riprova tra qualche secondo.', true);
  else if (c === 'revoked') toast("L'accesso ai dati è stato ritirato.", true);
  else toast('Salvataggio non riuscito. Controlla la connessione e riprova.', true);
}
async function pool(items, n, fn) {
  let i = 0;
  const run = async () => { while (i < items.length) { const it = items[i++]; await fn(it); } };
  await Promise.all(Array.from({length: Math.min(n, items.length)}, run));
}

/* ---------- Prezzi d'acquisto ---------- */
function vPrezzi() {
  const k = PERIODI[UI.prezziP] ? UI.prezziP : '3m', start = periodStart(k), Dd = drv(), q = UI.q.prz.trim().toLowerCase();
  const rows = [];
  for (const id of Dd.prices.keys()) { const a = S.data.articoli.get(id); if (a) rows.push({a, ps: priceStats(id, start)}); }
  const head = `<section id="v-prezzi"><div class="ph"><div><h1>Prezzi d'acquisto</h1><p>Prezzo al kg, al litro o al pezzo preso da fatture e DDT, IVA esclusa: così confronti anche confezioni di misura diversa.</p></div>
    <div class="acts"><button type="button" class="btn dl" data-act="dl-prezzi">${IC.down}Esporta CSV</button></div></div>
    <div class="subnav">${acqNav('prezzi')}</div>`;
  if (!rows.length) return head + empty('Ancora nessun prezzo: registra fatture o DDT con gli importi delle righe. Puoi inserire anche fatture vecchie spuntando «Solo storico prezzi», così vedi subito l’andamento.', IC.tag) + '</section>';
  const tot = r6(rows.reduce((t, r) => t + r.ps.extra, 0));
  const act = rows.filter(r => r.ps.inP.length && r.ps.before || r.ps.inP.length > 1);
  const up = act.filter(r => r.ps.chg > 0.005), down = act.filter(r => r.ps.chg < -0.005);
  const lbl = k === 'tutto' ? 'Dal primo acquisto registrato' : `Negli ultimi ${PERIODI[k][0]}`;
  const ref = k === 'tutto' ? 'ai primi prezzi registrati' : 'ai prezzi di inizio periodo';
  const worst = [...rows].sort((x, y) => y.ps.extra - x.ps.extra)[0], best = [...rows].sort((x, y) => x.ps.extra - y.ps.extra)[0];
  const finding = tot > 0.005
    ? `${lbl} hai speso ${EUR(tot)} in più rispetto ${ref}${worst.ps.extra > 0.005 ? `: il rincaro che pesa di più è ${worst.a.nome} (+${EUR(worst.ps.extra)})` : ''}.`
    : tot < -0.005 ? `${lbl} hai risparmiato ${EUR(-tot)} rispetto ${ref}${best.ps.extra < -0.005 ? `, soprattutto su ${best.a.nome}` : ''}.`
    : `${lbl} i prezzi sono rimasti stabili.`;
  let list = q ? rows.filter(r => String(r.a.nome).toLowerCase().includes(q)) : rows;
  list = [...list].sort((x, y) => (y.ps.extra - x.ps.extra) || ((y.ps.chg ?? 0) - (x.ps.chg ?? 0)) || byName(x.a, y.a));
  const prodRows = list.map(({a, ps}) => `<button type="button" class="row" data-act="open-prezzi" data-id="${esc(a.id)}">${av(catIc(a.categoria), ps.inP.length ? (dcls(ps.chg) === 'up' ? 'red' : dcls(ps.chg) === 'down' ? 'good' : '') : '')}
      <span class="m"><b>${esc(a.nome)}</b><span>Ultimo ${EUR(ps.last.p)} ${perU(a.unita)} il ${fmtD(ps.last.date)}${fornName(ps.last.forn) ? ' · ' + esc(fornName(ps.last.forn)) : ''}</span><span>${ps.s.length === 1 ? '1 acquisto' : ps.s.length + ' acquisti'}${Math.abs(ps.extra) >= 0.005 ? ` · ${ps.extra > 0 ? `+${EUR(ps.extra)} spesi in più` : `${EUR(-ps.extra)} risparmiati`}` : ''}</span><span class="mc">${ps.inP.length ? delta(ps.chg) : '<span class="chip">Nessun acquisto nel periodo</span>'}</span></span>
      <span class="s">${spark(ps.s)}</span></button>`).join('');
  const iva = cfg().iva;
  const imp = [...S.data.ricette.values()].filter(r => !r.archiviato).map(r => {
    const rq = +r.resaQta, now = recCostOf(r, [r.id]), then = recCostOf(r, [r.id], id => priceAt(id, start));
    if (!(rq > 0) || now.miss.length || then.miss.length || !(then.tot > 0)) return null;
    const cN = now.tot / rq, cT = then.tot / rq, pr = +r.prezzoVendita, net = pr > 0 ? pr / (1 + iva / 100) : 0;
    return {r, cN, cT, ch: (cN - cT) / cT, fN: net ? cN / net * 100 : null, fT: net ? cT / net * 100 : null};
  }).filter(x => x && Math.abs(x.ch) >= 0.005).sort((x, y) => y.ch - x.ch);
  const fc = v => num(Math.round(v * 10) / 10) + '%';
  const impRows = imp.map(x => { const u = unitOk(x.r.resaUnita); return `<button type="button" class="row" data-act="open-ric" data-id="${esc(x.r.id)}">${av(esc(x.r.sigla || autoSigla(x.r.nome)), dcls(x.ch) === 'up' ? 'red' : 'good')}<span class="m"><b>${esc(x.r.nome)}</b><span>Costo ${u === 'pz' ? 'al pezzo' : 'al ' + u}: ${EUR(x.cT)} → ${EUR(x.cN)}</span>${x.fN != null ? `<span>Food cost ${fc(x.fT)} → ${fc(x.fN)}</span>` : ''}<span class="mc">${delta(x.ch)}</span></span></button>`; }).join('');
  const missing = [...S.data.documenti.values()].filter(d => d.tipo !== 'inventario' && (d.righe || []).some(r => r.importo == null || r.importo === '')).sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));
  return head + `<div class="bar">${seg('prezziP', Object.entries(PERIODI).map(([v, [t]]) => [v, t]))}</div>
    <p class="finding">${esc(finding)}</p>
    <div class="stats"><div class="stat ${tot > 0.005 ? 'up' : tot < -0.005 ? 'down' : ''}"><b>${tot > 0.005 ? '+' : tot < -0.005 ? '−' : ''}${EUR(Math.abs(tot))}</b><span>${tot < -0.005 ? 'Risparmiati' : 'Spesi in più'} rispetto ${esc(ref)}</span></div><div class="stat"><b>${up.length}</b><span>${up.length === 1 ? 'Prodotto rincarato' : 'Prodotti rincarati'}</span></div><div class="stat"><b>${down.length}</b><span>${down.length === 1 ? 'Prodotto calato' : 'Prodotti calati'}</span></div></div>
    <h2>Prodotti</h2><p class="muted" style="margin-top:-4px">Variazione del prezzo ${k === 'tutto' ? 'dal primo acquisto registrato' : `negli ultimi ${PERIODI[k][0]}`}, dai rincari che pesano di più.</p>
    <div class="bar">${search('prz', 'Cerca prodotto')}</div>
    ${prodRows ? `<div class="list">${prodRows}</div>` : empty('Nessun prodotto corrisponde alla ricerca.', IC.search)}
    <h2>Costo delle schede</h2>
    <p class="muted" style="margin-top:-4px">Costo per unità oggi e con i prezzi di ${k === 'tutto' ? 'quando hai iniziato a registrarli' : 'inizio periodo'}.</p>
    ${impRows ? `<div class="list">${impRows}</div>` : empty('Nessuna variazione di costo nelle schede in questo periodo.', IC.doc)}
    ${missing.length ? `<h2>Prezzi da completare</h2><p class="muted" style="margin-top:-4px">${missing.length === 1 ? 'Un documento ha' : missing.length + ' documenti hanno'} righe senza importo. Quando arriva la fattura, apri il documento e inserisci gli importi: entrano subito nello storico.</p><div class="list">${missing.slice(0, 8).map(d => `<button type="button" class="row" data-act="open-doc" data-id="${esc(d.id)}">${av(DOCAB[d.tipo] || 'DOC', 'amb')}<span class="m"><b>${esc(docName(d))}</b><span>${esc(fornName(d.fornitoreId) || 'Fornitore non indicato')}</span><span class="mc"><span class="chip amb">Prezzi da inserire</span></span></span></button>`).join('')}</div>` : ''}</section>`;
}

/* ---------- Impostazioni ---------- */

      <p class="hint" style="margin:-4px 0 0">Compaiono in alto nell'app e sulle schede tecniche e sui documenti dei lotti che scarichi o stampi.</p></div></div>`;

/* ---------- fogli (dettagli e moduli) ---------- */
const stack = [];
const top = () => stack[stack.length - 1];
function openSheet(o) {
  o.prevFocus = document.activeElement;
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet${o.small ? ' small' : ''}${o.form ? ' form' : ''}" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div><div class="sh-head"><h2></h2><button type="button" class="btn icon" data-act="close" aria-label="Chiudi">${IC.x}</button></div><div class="sh-body"></div><div class="sh-foot"></div></div>`;
  wrap.addEventListener('click', e => { if (e.target === wrap) requestClose(); });
  dragToClose(wrap);
  o.el = wrap; stack.push(o);
  $('#sheets').append(wrap);
  document.documentElement.style.overflow = 'hidden';
  paintSheet(o);
  o.mount?.(o);
  const f = o.form && matchMedia('(pointer: fine)').matches ? $('.sh-body input:not([type=file]):not([disabled]), .sh-body select:not([disabled])', wrap) : null;
  (f || $('[data-act=close]', wrap)).focus({preventScroll: true});
  return o;
}
function paintSheet(o) {
  const title = typeof o.title === 'function' ? o.title() : o.title;
  const h = $('.sh-head h2', o.el); h.textContent = title; $('.sheet', o.el).setAttribute('aria-label', title);
  const b = $('.sh-body', o.el), f = $('.sh-foot', o.el);
  const html = o.body(); if (b._h !== html) { b.innerHTML = html; b._h = html; }
  const ft = o.foot ? o.foot() : '';
  if (f._h !== ft) { f.innerHTML = ft; f._h = ft; }
  f.hidden = !ft.trim();
  drawCharts(o.el);
  o.after?.(o);
}
/* trascina in basso la testata per chiudere il foglio (telefono) */
function dragToClose(wrap) {
  const sheet = $('.sheet', wrap), zones = [$('.grab', wrap), $('.sh-head', wrap)];
  let y0 = null, dy = 0, t0 = 0;
  const down = e => { if (e.target.closest('button') || matchMedia('(min-width: 760px)').matches) return; y0 = e.clientY; dy = 0; t0 = Date.now(); sheet.style.transition = 'none'; e.currentTarget.setPointerCapture?.(e.pointerId); };
  const move = e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = dy ? `translateY(${dy}px)` : ''; };
  const up = () => {
    if (y0 == null) return; y0 = null;
    const fast = dy > 60 && dy / Math.max(1, Date.now() - t0) > 0.6;
    sheet.style.transition = 'transform .22s ease-out'; sheet.style.transform = '';
    if (dy > 140 || fast) requestClose();
  };
  for (const z of zones) { z.addEventListener('pointerdown', down); z.addEventListener('pointermove', move); z.addEventListener('pointerup', up); z.addEventListener('pointercancel', up); }
}
function closeSheet() {
  const o = stack.pop(); if (!o) return;
  o.el.remove(); o.onClose?.();
  if (!stack.length) document.documentElement.style.overflow = '';
  if (o.prevFocus && document.contains(o.prevFocus)) o.prevFocus.focus({preventScroll: true});
}
async function requestClose() {
  const o = top(); if (!o) return;
  if (o.form && o.dirty && !(await ask('Chiudere senza salvare le modifiche?', 'Chiudi senza salvare', true))) return;
  if (top() === o) closeSheet();
}
function refreshSheets() { for (const o of stack) if (o.live) { const b = $('.sh-body', o.el), y = b.scrollTop; paintSheet(o); b.scrollTop = y; } }
function ask(msg, okLabel = 'Conferma', danger = false) {
  return new Promise(res => {
    let done = false;
    const o = openSheet({title: 'Conferma', small: true, body: () => `<p>${esc(msg)}</p>`, foot: () => `<button type="button" class="btn" data-act="ask" data-v="0">Annulla</button><button type="button" class="btn ${danger ? 'dan' : 'pri'}" data-act="ask" data-v="1">${esc(okLabel)}</button>`});
    o.resolve = v => { if (done) return; done = true; if (top() === o) closeSheet(); res(v); };
    o.onClose = () => { if (!done) { done = true; res(false); } };
  });
}
function toast(msg, bad, action) {
  const box = $('#toast'), t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  const sp = document.createElement('span'); sp.textContent = msg; t.append(sp);
  if (action) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label;
    b.addEventListener('click', () => { t.remove(); action.fn(); });
    t.append(b);
  }
  box.append(t);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => t.remove(), action ? 7000 : bad ? 6500 : 2800);
}
const ferr = (o, msg) => { const e = $('#ferr', o.el); if (e) { e.textContent = msg; e.scrollIntoView({block: 'nearest'}); } else toast(msg, true); return false; };

/* ---------- pezzi comuni dei dettagli ---------- */
function allegatiHTML(doc) {
  const a = (doc.allegati || []).filter(x => x && typeof x.id === 'string' && /^[A-Za-z0-9_-]+$/.test(x.id));
  if (!a.length) return '';
  return `<div class="att">${a.map(x => {
    const url = '/_blob/' + encodeURIComponent(x.id), img = /^image\//.test(x.tipo || '');
    return `<a href="${url}" target="_blank" rel="noopener">${img ? `<img src="${url}" alt="" loading="lazy">` : ''}${esc(x.nome || 'Allegato')}</a>`;
  }).join('')}</div>`;
}
function movList(l) {
  if (!l.mov.length) return empty('Nessuno scarico o rettifica registrati.');
  const u = lotUnit(l);
  const ic = {vendita: IC.sell, scarto: IC.trash, uso: IC.chef, rettifica: IC.box};
  return `<div class="list">${[...l.mov].sort((a, b) => String(b.data).localeCompare(String(a.data)) || (b.creato || 0) - (a.creato || 0)).map(m => `<div class="row">${av(ic[m.tipo] || IC.box, m.tipo === 'scarto' ? 'red' : '')}<span class="m"><b>${esc(MOV[m.tipo] || 'Movimento')} · ${fmtQ(Math.abs(+m.delta || 0), u)}${+m.delta > 0 ? ' in più' : ''}</b><span>${fmtD(m.data)}${m.nota ? ' · ' + esc(m.nota) : ''}</span></span><span class="s"><button type="button" class="btn sm w" data-act="del-mov" data-id="${esc(m.id)}">Elimina</button></span></div>`).join('')}</div>`;
}
function consumoItem(c, path) {
  const Dd = drv(), it = itemOf(c.tipo, c.refId), nome = it?.nome || c.nome || 'Ingrediente eliminato';
  const qty = fmtQ(+c.qta, it ? baseOf(c.tipo, it) : '');
  if (!c.lotId) return `<div class="tr warn"><div class="tr-h"><b>${esc(nome)}</b><span class="q">${qty}</span></div><div class="tr-meta"><span>Usato senza un lotto registrato in magazzino</span></div></div>`;
  if (c.tipo === 'ric') {
    const lp = Dd.prod.get(c.lotId);
    if (!lp) return `<div class="tr warn"><div class="tr-h"><b>${esc(nome)}</b><span class="q">${qty}</span></div><div class="tr-meta"><span>Il lotto del semilavorato è stato eliminato</span></div></div>`;
    const sub = path.includes(c.lotId) ? '' : `<div class="sub"><p class="hint" style="margin:0">Ingredienti del lotto ${esc(lp.p.lotto)} (quantità riferite all'intero lotto)</p>${(lp.p.consumi || []).map(cc => consumoItem(cc, [...path, c.lotId])).join('')}</div>`;
    return `<div class="tr"><div class="tr-h"><b>${esc(nome)}</b><span class="q">${qty}</span></div><div class="tr-meta"><span>Semilavorato, <button type="button" class="lnk" data-act="open-lotto" data-id="${esc(lp.key)}">lotto ${esc(lp.p.lotto)}</button></span><span>prodotto il ${fmtD(lp.data)}</span><span>scadenza ${fmtD(lp.scad)}</span></div>${sub}</div>`;
  }
  const la = Dd.acq.get(c.lotId);
  if (!la) return `<div class="tr warn"><div class="tr-h"><b>${esc(nome)}</b><span class="q">${qty}</span></div><div class="tr-meta"><span>Il documento d'acquisto di questo lotto è stato eliminato</span></div></div>`;
  return `<div class="tr"><div class="tr-h"><b>${esc(nome)}</b><span class="q">${qty}</span></div>
    <div class="tr-meta"><span>Lotto fornitore <b>${esc(la.lottoF || 'non indicato')}</b></span><span>scadenza ${fmtD(la.scad)}</span>${fornName(la.doc.fornitoreId) ? `<span>${esc(fornName(la.doc.fornitoreId))}</span>` : ''}</div>
    <div class="tr-meta"><button type="button" class="lnk" data-act="open-doc" data-id="${esc(la.doc.id)}">${esc(docName(la.doc))}</button>${la.doc.tipo === 'ddt' && la.doc.fatturaRif ? `<span>fattura ${esc(la.doc.fatturaRif)}</span>` : ''}<button type="button" class="lnk" data-act="open-acq" data-id="${esc(la.key)}">dettaglio lotto</button></div>${allegatiHTML(la.doc)}</div>`;
}
function fwdTree(l, depth = 0) {
  if (!l.used.length) return depth ? '' : empty('Non ancora usato in produzione.');
  const u = lotUnit(l), Dd = drv();
  return `<div class="${depth ? 'sub' : 'trace'}">${l.used.map(x => {
    const lp = Dd.prod.get(x.prodId); if (!lp) return '';
    const s = st(lp);
    return `<div class="tr"><div class="tr-h"><button type="button" class="lnk" data-act="open-lotto" data-id="${esc(lp.key)}">${esc(lp.p.lotto)}</button><span class="q">${fmtQ(x.qta, u)}</span></div>
      <div class="tr-meta"><span>${esc(lotName(lp))}</span><span>prodotto il ${fmtD(lp.data)}</span><span>residuo ${fmtQ(lp.res, lotUnit(lp))}</span><span class="chip ${s.c}">${esc(s.t)}</span></div>${depth < 4 ? fwdTree(lp, depth + 1) : ''}</div>`;
  }).join('')}</div>`;
}

/* ---------- dettaglio lotto di produzione (tracciabilità) ---------- */
function sheetLotto(id) {

}
function lottoBody(id) {
  const l = drv().prod.get(id); if (!l) return empty('Questo lotto non esiste più.');
  const p = l.p, s = st(l), u = lotUnit(l), cost = lotCost(id);
  const al = algSort(p.allergeni || []), tr = algSort((p.tracce || []).filter(x => !al.includes(x)));
  const r = l.item;
  return `<div class="dh"><p class="muted">${esc(lotName(l))}</p><div class="big">${esc(p.lotto)}</div><span class="chip ${s.c}">${esc(s.t)}</span></div>
    <div class="kv"><div><small>Prodotto il</small><b>${fmtD(p.data)}</b></div><div><small>${esc(scadLabel(p.tipoScadenza))}</small><b>${fmtD(l.scad)}</b></div><div><small>Quantità prodotta</small><b>${fmtQ(l.qta, u)}</b></div><div><small>Residuo</small><b>${fmtQ(l.res, u)}</b></div></div>

    <h3>Allergeni</h3>${algChips(al, tr)}

    <h3>Costo del lotto</h3>
    <p>${EUR(cost.tot)} in totale, ${l.qta > 0 ? EUR(cost.tot / l.qta) : '—'} ${u === 'pz' ? 'al pezzo' : 'al ' + u}${cost.partial ? ' <span class="muted">(in parte stimato: manca il prezzo di qualche lotto)</span>' : ''}</p>
    ${l.used.length ? `<h3>Usato come ingrediente in</h3>${fwdTree(l)}` : ''}
    <h3>Scarichi e rettifiche</h3>${movList(l)}
    ${p.note ? `<h3>Note</h3><div class="prose">${esc(p.note)}</div>` : ''}
    <div class="morebar"><button type="button" class="btn dl" data-act="dl-lotto" data-id="${esc(id)}">${IC.down}Scarica scheda lotto</button><button type="button" class="btn w" data-act="edit-prod" data-id="${esc(id)}">Modifica</button><button type="button" class="btn dan w" data-act="del-prod" data-id="${esc(id)}">Elimina lotto</button></div>`;

function lottoFoot(id) {
  const l = drv().prod.get(id); if (!l || S.ro) return '';

  return s.c === 'red'
    ? `<button type="button" class="btn" data-act="mov" data-kind="prod" data-id="${esc(id)}">Scarico o rettifica</button><button type="button" class="btn pri" data-act="smaltisci" data-kind="prod" data-id="${esc(id)}">Smaltisci il residuo</button>`
    : `<button type="button" class="btn" data-act="esaurito" data-id="${esc(id)}">Segna esaurito</button><button type="button" class="btn pri" data-act="mov" data-kind="prod" data-id="${esc(id)}">Registra scarico</button>`;
}

    return `<button type="button" class="row" data-act="open-acq" data-id="${esc(l.key)}">${av(catIc(l.item?.categoria), s.c)}<span class="m"><b>${esc(lotName(l))}</b><span>${fmtQ(l.qta, u)}${r.importo != null && r.importo !== '' ? ' · ' + EUR(+r.importo) : ''} · lotto ${esc(l.lottoF || 'non indicato')} · scad. ${fmtD(l.scad)}</span><span>${l.used.length ? `Usato in ${l.used.length === 1 ? '1 produzione' : l.used.length + ' produzioni'}` : 'Non ancora usato'}</span><span class="mc"><span class="chip ${s.c}">${esc(s.t)}</span></span></span><span class="s"><span class="q">${fmtQ(l.res, u)}</span><small class="muted">residuo</small></span></button>`;
  }).join('');
  const f = S.data.fornitori.get(d.fornitoreId);
  return `<div class="kv"><div><small>Documento</small><b>${esc(TIPI[d.tipo] || 'Documento')}${d.numero ? ' ' + esc(d.numero) : ''}</b></div><div><small>Data</small><b>${fmtD(d.data)}</b></div><div><small>Fornitore</small><b style="font-stretch:90%;font-size:18px">${f ? esc(f.nome) : '—'}</b></div><div><small>Totale senza IVA</small><b>${EUR(docTot(d))}</b></div></div>
    ${d.tipo === 'ddt' && d.fatturaRif ? `<p class="muted">Fattura collegata: ${esc(d.fatturaRif)}</p>` : ''}
    ${d.soloPrezzi ? '<p class="note">Documento registrato solo per lo storico dei prezzi: non ha caricato merce in magazzino.</p>' : ''}
    ${(d.allegati || []).length ? `<h3>Allegati</h3>${allegatiHTML(d)}` : ''}
    <h3>${d.soloPrezzi ? 'Righe e prezzi' : 'Righe e lotti caricati'}</h3><div class="list">${righe || empty('Nessuna riga.')}</div>
    ${d.note ? `<h3>Note</h3><div class="prose">${esc(d.note)}</div>` : ''}
    <div class="morebar w"><button type="button" class="btn dan" data-act="del-doc" data-id="${esc(id)}">Elimina documento</button></div>`;
}
function docFoot(id) {
  if (!S.data.documenti.get(id) || S.ro) return '';
  return `<button type="button" class="btn pri" data-act="edit-doc" data-id="${esc(id)}">Modifica documento</button>`;
}

/* ---------- moduli ---------- */
const opt = (v, t, cur) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(t)}</option>`;
const fseg = (k, cur, opts) => `<div class="seg" role="group">${opts.map(([v, t]) => `<button type="button" data-act="fseg" data-k="${k}" data-v="${esc(v)}" aria-pressed="${cur === v}">${esc(t)}</button>`).join('')}</div>`;
const algToggles = (k, arr) => `<div class="algrid">${ALG.map(([v, t]) => `<button type="button" class="altog" data-act="altog" data-k="${k}" data-v="${v}" aria-pressed="${arr.includes(v)}">${esc(t)}</button>`).join('')}</div>`;
const fornOpts = cur => [...S.data.fornitori.values()].sort(byName).map(f => opt(f.id, f.nome, cur)).join('');
const strip = o => { const c = clone(o) || {}; delete c.id; return c; };
const splitRef = ref => { const i = String(ref || '').indexOf(':'); return i < 0 ? ['art', ''] : [ref.slice(0, i), ref.slice(i + 1)]; };
const foot = (label) => `<button type="button" class="btn" data-act="close">Annulla</button><button type="button" class="btn pri" data-act="save">${esc(label)}</button>`;
function setPath(o, path, v) { const ks = path.split('.'); let x = o; for (let i = 0; i < ks.length - 1; i++) { x = x[ks[i]]; if (x == null) return; } x[ks[ks.length - 1]] = v; }
function artOptions(cur) {
  const arts = [...S.data.articoli.values()].filter(a => !a.archiviato || a.id === cur).sort(byName);
  return Object.keys(CAT).map(c => { const xs = arts.filter(a => (a.categoria || 'materia') === c); return xs.length ? `<optgroup label="${CAT[c]}">${xs.map(a => opt(a.id, a.nome, cur)).join('')}</optgroup>` : ''; }).join('');
}

/* articolo */

  const st = ex
    ? {nome: ex.nome || '', categoria: CAT[ex.categoria] ? ex.categoria : 'materia', unita: unitOk(ex.unita) || 'kg', pesoPz: +ex.pesoPz > 0 ? fmtIn(+ex.pesoPz) : '', etichetta: ex.etichetta || '', allergeni: algSort(ex.allergeni || []), conservazione: CONS[ex.conservazione] ? ex.conservazione : 'ambiente', scortaMin: +ex.scortaMin > 0 ? fmtIn(+ex.scortaMin) : '', fornitoreId: ex.fornitoreId || '', note: ex.note || ''}
    : {nome: pre?.nome || '', categoria: CAT[pre?.categoria] ? pre.categoria : 'materia', unita: unitOk(pre?.unita) || 'kg', pesoPz: '', etichetta: '', allergeni: [], conservazione: 'ambiente', scortaMin: '', fornitoreId: pre?.fornitoreId && S.data.fornitori.has(pre.fornitoreId) ? pre.fornitoreId : '', note: ''};
  const locked = !!ex && ((drv().artLots.get(id) || []).length > 0 || [...S.data.ricette.values()].some(r => (r.ingredienti || []).some(g => g.tipo !== 'ric' && g.refId === id)));
  openSheet({form: true, st, title: ex ? 'Modifica articolo' : 'Nuovo articolo',
    body: () => `<label class="fld"><span>Nome</span><input type="text" data-k="nome" value="${esc(st.nome)}" placeholder="Es. Farina 00" autocomplete="off"></label>
      <div class="fld"><span>Tipo di articolo</span>${fseg('categoria', st.categoria, [['materia', 'Materia prima'], ['rivendita', 'Rivendita'], ['imballaggio', 'Imballaggio']])}</div>
      <div class="g2"><label class="fld"><span>Unità di giacenza</span><select data-k="unita" ${locked ? 'disabled' : ''}>${opt('kg', 'Chili (kg)', st.unita)}${opt('l', 'Litri (l)', st.unita)}${opt('pz', 'Pezzi (pz)', st.unita)}</select>${locked ? '<small class="hint">Bloccata: l’articolo ha già lotti o è in una scheda.</small>' : ''}</label>
      <label class="fld" id="f-pz" ${st.unita === 'pz' ? '' : 'hidden'}><span>Peso di un pezzo (g)</span><input type="text" inputmode="decimal" data-k="pesoPz" value="${esc(st.pesoPz)}" placeholder="Es. 55"><small class="hint">Permette di usarlo in grammi nelle ricette.</small></label></div>
      <label class="fld"><span>Nome nell'elenco ingredienti</span><input type="text" data-k="etichetta" value="${esc(st.etichetta)}" placeholder="Es. farina di GRANO tenero tipo 00" autocomplete="off"><small class="hint">Scrivi in MAIUSCOLO la parola dell'allergene. Se lo lasci vuoto viene usato il nome, con l'allergene tra parentesi.</small></label>
      <div class="fld"><span>Allergeni contenuti</span>${algToggles('allergeni', st.allergeni)}</div>
      <div class="g2"><label class="fld"><span>Conservazione</span><select data-k="conservazione">${opt('ambiente', 'Ambiente', st.conservazione)}${opt('frigo', 'Frigorifero', st.conservazione)}${opt('freezer', 'Congelatore', st.conservazione)}</select></label>
      <label class="fld"><span>Scorta minima</span><input type="text" inputmode="decimal" data-k="scortaMin" value="${esc(st.scortaMin)}" placeholder="Nessuna"></label></div>
      <label class="fld"><span>Fornitore abituale</span><select data-k="fornitoreId"><option value="">Nessuno</option>${fornOpts(st.fornitoreId)}</select></label>
      <label class="fld"><span>Note</span><textarea data-k="note" rows="3">${esc(st.note)}</textarea></label>
      <p class="err" id="ferr" role="alert"></p>`,
    foot: () => foot(ex ? 'Salva modifiche' : 'Crea articolo'),
    onField: (k, o) => { if (k === 'unita') { $('#f-pz', o.el).hidden = st.unita !== 'pz'; } },
    onSave: async o => {
      const nome = st.nome.trim();
      if (!nome) return ferr(o, "Scrivi il nome dell'articolo.");
      if ([...S.data.articoli.values()].some(a => a.id !== id && String(a.nome || '').trim().toLowerCase() === nome.toLowerCase())) return ferr(o, 'Esiste già un articolo con questo nome.');
      let pesoPz = null;
      if (st.unita === 'pz' && String(st.pesoPz).trim()) { pesoPz = pnum(st.pesoPz); if (!(pesoPz > 0)) return ferr(o, 'Peso del pezzo non valido.'); }
      let sm = 0;
      if (String(st.scortaMin).trim()) { sm = pnum(st.scortaMin); if (!(sm >= 0)) return ferr(o, 'Scorta minima non valida.'); }
      const doc = {...(ex ? strip(ex) : {}), nome, categoria: st.categoria, unita: locked ? ex.unita : st.unita, pesoPz, etichetta: st.etichetta.trim(), allergeni: algSort(st.allergeni), conservazione: st.conservazione, scortaMin: sm, fornitoreId: st.fornitoreId, note: st.note.trim(), archiviato: !!ex?.archiviato, creato: ex?.creato || Date.now()};
      const nid = id || uid();
      if (await put('articoli', nid, doc)) { o.dirty = false; closeSheet(); toast(ex ? 'Articolo aggiornato' : `Articolo «${nome}» creato`); onSaved?.(nid); }
    }});
}

      const doc = {...(ex ? strip(ex) : {}), nome, piva: st.piva.trim(), telefono: st.telefono.trim(), email: st.email.trim(), note: st.note.trim(), creato: ex?.creato || Date.now()};

/* documento d'acquisto: ogni riga è un lotto */
function formDocumento(id, pre) {
  const ex = id ? S.data.documenti.get(id) : null;
  const newRiga = () => ({id: uid(), articoloId: '', qta: '', unita: '', importo: '', lotto: '', scadenza: ''});
  const st = ex
    ? {tipo: TIPI[ex.tipo] ? ex.tipo : 'fattura', numero: ex.numero || '', data: ex.data || today(), fornitoreId: ex.fornitoreId || '', fatturaRif: ex.fatturaRif || '', soloPrezzi: !!ex.soloPrezzi, note: ex.note || '', allegati: clone(ex.allegati || []), righe: (ex.righe || []).map(r => ({id: r.id, articoloId: r.articoloId, qta: fmtIn(+r.qta), unita: unitOk(S.data.articoli.get(r.articoloId)?.unita) || 'kg', importo: r.importo == null || r.importo === '' ? '' : fmtIn(+r.importo), lotto: r.lotto || '', scadenza: r.scadenza || ''}))}
    : {tipo: TIPI[pre?.tipo] ? pre.tipo : 'fattura', numero: '', data: today(), fornitoreId: pre?.fornitoreId && S.data.fornitori.has(pre.fornitoreId) ? pre.fornitoreId : '', fatturaRif: '', soloPrezzi: false, note: '', allegati: [], righe: pre?.articoloId ? [{...newRiga(), articoloId: pre.articoloId, unita: unitOk(S.data.articoli.get(pre.articoloId)?.unita) || 'kg'}] : [newRiga()]};
  if (!st.righe.length) st.righe.push(newRiga());
  const priceOnly = () => st.soloPrezzi && st.tipo !== 'inventario';
  const usedLot = rid => { if (!ex) return null; const l = drv().acq.get(`${id}:${rid}`); return l && (l.used.length || l.mov.length) ? l : null; };
  const rigaHTML = (r, i) => {
    const a = S.data.articoli.get(r.articoloId), units = a ? buyUnits(a.unita) : ['kg'], used = usedLot(r.id);
    return `<div class="card"><div class="card-h"><b>Riga ${i + 1}</b>${used ? '<span class="chip">Già usata o scaricata</span>' : st.righe.length > 1 ? `<button type="button" class="btn" data-act="del-riga" data-i="${i}">Togli riga</button>` : ''}</div>
      <label class="fld"><span>Articolo</span><select data-k="righe.${i}.articoloId" ${used ? 'disabled' : ''}><option value="">Scegli l'articolo…</option>${artOptions(r.articoloId)}<option value="__new">+ Nuovo articolo…</option></select></label>
      <div class="g3"><label class="fld"><span>Quantità</span><input type="text" inputmode="decimal" data-k="righe.${i}.qta" value="${esc(r.qta)}" placeholder="0" autocomplete="off"></label>
      <label class="fld"><span>Unità</span><select data-k="righe.${i}.unita">${units.map(u => opt(u, u, units.includes(r.unita) ? r.unita : units[0])).join('')}</select></label>
      <label class="fld"><span>Importo € senza IVA</span><input type="text" inputmode="decimal" data-k="righe.${i}.importo" value="${esc(r.importo)}" placeholder="0,00" autocomplete="off"></label></div>
      <div class="g2" ${priceOnly() ? 'hidden' : ''}><label class="fld"><span>Lotto del fornitore</span><input type="text" data-k="righe.${i}.lotto" value="${esc(r.lotto)}" placeholder="Come sulla confezione" autocomplete="off"></label>
      <label class="fld"><span>Scadenza</span><input type="date" data-k="righe.${i}.scadenza" value="${esc(r.scadenza)}"></label></div></div>`;
  };
  const attHTML = o => `<div class="att">${st.allegati.map((a, i) => `<span class="chip">${esc(a.nome || 'Allegato')}<button type="button" class="attx" data-act="del-att" data-i="${i}" aria-label="Togli ${esc(a.nome || 'allegato')}">×</button></span>`).join('')}</div>
    ${S.assets ? `<label class="btn">${IC.plus}Allega foto o PDF<input type="file" accept="image/*,application/pdf" data-file="att" multiple></label>${o?.uploading ? ' <span class="hint">Caricamento in corso…</span>' : ''}` : '<small class="hint">Gli allegati si possono aggiungere aprendo la pagina su claude.ai come proprietario o editor.</small>'}`;
  openSheet({form: true, st, title: ex ? 'Modifica documento' : 'Registra acquisto',
    body: () => { const o = stack.find(x => x.st === st); return `<div class="fld"><span>Tipo di documento</span>${fseg('tipo', st.tipo, [['fattura', 'Fattura'], ['ddt', 'DDT'], ['scontrino', 'Scontrino'], ['inventario', 'Inventario iniziale']])}</div>
      ${st.tipo === 'inventario' ? '<p class="note">«Inventario iniziale» serve a caricare la merce che hai già in magazzino quando cominci a usare Barista Flow.</p>' : ''}
      <div class="g2"><label class="fld"><span>Numero</span><input type="text" data-k="numero" value="${esc(st.numero)}" placeholder="${st.tipo === 'inventario' ? 'Facoltativo' : 'Es. 1187'}" autocomplete="off"></label>
      <label class="fld"><span>Data</span><input type="date" data-k="data" value="${esc(st.data)}"></label></div>
      <label class="fld"><span>Fornitore${st.tipo === 'inventario' ? ' (facoltativo)' : ''}</span><select data-k="fornitoreId"><option value="">Scegli il fornitore…</option>${fornOpts(st.fornitoreId)}<option value="__new">+ Nuovo fornitore…</option></select></label>
      ${st.tipo === 'ddt' ? `<label class="fld"><span>Fattura collegata (facoltativa)</span><input type="text" data-k="fatturaRif" value="${esc(st.fatturaRif)}" placeholder="Es. n. 1203 del 30/11, quando arriva" autocomplete="off"></label>` : ''}
      ${st.tipo !== 'inventario' ? `<label class="chk"><input type="checkbox" data-k="soloPrezzi" ${st.soloPrezzi ? 'checked' : ''}>Solo storico prezzi: non carica merce in magazzino</label><p class="hint" style="margin:-4px 0 14px">Per inserire fatture vecchie e vedere subito l’andamento dei prezzi, senza toccare le giacenze.</p>` : ''}
      <div class="fld"><span>Foto o PDF del documento</span>${attHTML(o)}</div>
      <h3>Righe del documento</h3><p class="hint" style="margin:-4px 0 10px">${priceOnly() ? 'Per lo storico bastano articolo, quantità e importo della riga.' : 'Ogni riga diventa un lotto in magazzino: indica il lotto e la scadenza scritti sulla confezione. L’importo serve allo storico dei prezzi.'}</p>
      ${st.righe.map(rigaHTML).join('')}
      <p><button type="button" class="btn" data-act="add-riga">${IC.plus}Aggiungi riga</button></p>
      <label class="fld"><span>Note</span><textarea data-k="note" rows="3">${esc(st.note)}</textarea></label>
      <p class="err" id="ferr" role="alert"></p>`; },
    foot: () => foot(ex ? 'Salva modifiche' : 'Registra documento'),
    onField: (k, o, kind, el) => {
      const m = k.match(/^righe\.(\d+)\.articoloId$/);
      if (m) {
        const r = st.righe[+m[1]];
        if (r.articoloId === '__new') { r.articoloId = ''; el.value = ''; formArticolo(null, nid => { r.articoloId = nid; r.unita = unitOk(S.data.articoli.get(nid)?.unita) || 'kg'; paintSheet(o); }); return; }
        r.unita = unitOk(S.data.articoli.get(r.articoloId)?.unita) || 'kg'; paintSheet(o); return;
      }
      if (k === 'fornitoreId' && st.fornitoreId === '__new') { st.fornitoreId = ''; el.value = ''; formFornitore(null, nid => { st.fornitoreId = nid; paintSheet(o); }); return; }
      if (k === 'tipo' || k === 'soloPrezzi') paintSheet(o);
    },
    onSave: async o => {
      if (o.uploading) return ferr(o, 'Attendi la fine del caricamento degli allegati.');
      if (priceOnly() && ex && (ex.righe || []).some(r => usedLot(r.id))) return ferr(o, 'Alcuni lotti di questo documento sono già stati usati: non può diventare solo storico prezzi.');
      if (!validIso(st.data)) return ferr(o, 'Indica la data del documento.');
      if (st.tipo !== 'inventario' && !S.data.fornitori.has(st.fornitoreId)) return ferr(o, 'Scegli il fornitore: serve per risalire alla provenienza dei lotti.');
      const righe = [];
      for (const [i, r] of st.righe.entries()) {
        if (!r.articoloId && !String(r.qta).trim() && !String(r.importo).trim() && !String(r.lotto).trim()) continue;
        const a = S.data.articoli.get(r.articoloId);
        if (!a) return ferr(o, `Riga ${i + 1}: scegli l'articolo.`);
        const q = r6(conv(pnum(r.qta), unitOk(r.unita) || a.unita, a.unita, +a.pesoPz || 0));
        if (!(q > 0)) return ferr(o, `Riga ${i + 1} (${a.nome}): quantità non valida.`);
        let imp = null;
        if (String(r.importo).trim()) { imp = pnum(r.importo); if (!(imp >= 0)) return ferr(o, `Riga ${i + 1} (${a.nome}): importo non valido.`); imp = Math.round(imp * 100) / 100; }
        if (priceOnly() && imp == null) return ferr(o, `Riga ${i + 1} (${a.nome}): per lo storico prezzi serve l'importo.`);
        if (!priceOnly() && r.scadenza && !validIso(r.scadenza)) return ferr(o, `Riga ${i + 1} (${a.nome}): scadenza non valida.`);
        const l = ex ? drv().acq.get(`${id}:${r.id}`) : null;
        if (l) { const min = r6(l.usedQ - l.movQ); if (q < min - EPS) return ferr(o, `Riga ${i + 1} (${a.nome}): sono già stati usati o scaricati ${fmtQ(min, a.unita).replace(/ /g, ' ')}, la quantità non può essere minore.`); }
        righe.push({id: r.id, articoloId: a.id, qta: q, importo: imp, lotto: priceOnly() ? '' : String(r.lotto).trim(), scadenza: priceOnly() ? '' : (r.scadenza || '')});
      }
      if (!righe.length) return ferr(o, 'Aggiungi almeno una riga con articolo e quantità.');
      if (ex) for (const orr of (ex.righe || [])) if (!righe.some(x => x.id === orr.id) && usedLot(orr.id)) return ferr(o, 'Una riga già usata in produzione non può essere tolta.');
      const doc = {...(ex ? strip(ex) : {}), tipo: st.tipo, numero: st.numero.trim(), data: st.data, fornitoreId: st.fornitoreId || '', fatturaRif: st.tipo === 'ddt' ? st.fatturaRif.trim() : '', soloPrezzi: priceOnly(), note: st.note.trim(), allegati: st.allegati, righe, creato: ex?.creato || Date.now()};
      const nid = id || uid();
      if (await put('documenti', nid, doc)) { o.dirty = false; closeSheet(); toast(ex ? 'Documento aggiornato' : priceOnly() ? `Documento registrato nello storico prezzi: ${righe.length === 1 ? '1 riga' : righe.length + ' righe'}` : `Documento registrato: ${righe.length === 1 ? '1 lotto' : righe.length + ' lotti'} in magazzino`); }
    }});

          if (!(v >= 0)) return ferr(o, `${rg.nome}: quantità non valida.`);
          const vb = r6(v * rg.fct);
          if (vb > l.res + EPS) return ferr(o, `${rg.nome}: dal ${l.label} puoi usare al massimo ${fmtQ(l.res / rg.fct, rg.du).replace(/ /g, ' ')}.`);
          if (vb > EPS) { consumi.push({tipo: rg.tipo, refId: rg.refId, nome: rg.nome, lotId: l.key, qta: vb}); tot += vb; }
        }
        const miss = r6(rg.needBase - tot);
        if (miss > Math.max(EPS, rg.needBase * 1e-6)) {
          if (st.forza) consumi.push({tipo: rg.tipo, refId: rg.refId, nome: rg.nome, lotId: null, qta: miss});
          else missing.push(`${rg.nome} (${fmtQ(miss / rg.fct, rg.du).replace(/ /g, ' ')})`);
        }

      if (missing.length) { const f = $('#forza', o.el); if (f) f.hidden = false; return ferr(o, `Mancano: ${missing.join(', ')}. Registra l'acquisto mancante oppure spunta «Registra comunque».`); }
      const doc = {lotto: lotCode(r.sigla || autoSigla(r.nome), st.data), ricettaId: r.id, ricettaNome: r.nome, data: st.data, qta: r6(qta), unita: unitOk(r.resaUnita) || 'pz', scadenza: st.scadenza, tipoScadenza: r.tipoScadenza === 'entro' ? 'entro' : 'preferibilmente', operatore: st.operatore.trim(), note: st.note.trim(), consumi, allergeni: algSort([...recAllergensOf(r, [r.id])]), tracce: algSort([...recTracceOf(r, [r.id])]), creato: Date.now()};

}
function prodDyn(o) {
  const st = o.st; let miss = false, minScad = null, minName = '';

    let tot = 0;
    rg.lots.forEach(l => { const v = pnum(l.q); if (v > 0) { tot += v; if (l.scad && (!minScad || l.scad < minScad)) { minScad = l.scad; minName = rg.nome; } } });
    const el = $(`#sum-${i}`, o.el); if (!el) return;
    if (!rg.valid) { el.className = 'chip red'; el.textContent = 'Ingrediente non valido: controlla la scheda'; miss = true; return; }
    const need = rg.needBase / rg.fct, diff = r6(tot - need), tol = Math.max(EPS, need * 1e-6);
    if (diff < -tol) { el.className = 'chip amb'; el.textContent = `Mancano ${fmtQ(-diff, rg.du)}`; miss = true; }
    else if (diff > tol) { el.className = 'chip'; el.textContent = `${fmtQ(diff, rg.du)} in più della ricetta`; }
    else { el.className = 'chip ok'; el.textContent = 'Quantità coperta'; }
  });
  const f = $('#forza', o.el); if (f && !st.forza) f.hidden = !miss;
  const w = $('#scadwarn', o.el);
  if (w) {
    const show = !!minScad && validIso(st.scadenza) && st.scadenza > minScad;
    w.hidden = !show;
    if (show) w.textContent = `Nota: un ingrediente usato scade prima del prodotto (${minName}, ${fmtD(minScad)}). Va bene per i prodotti cotti; per creme e prodotti freschi verifica la scadenza.`;
  }
}

/* scarichi (vendita, scarto, uso interno) e rettifiche */
function formMov(t) {
  const Dd = drv();
  const lot = t.item ? null : (t.kind === 'prod' ? Dd.prod.get(t.id) : Dd.acq.get(t.id));
  if (!t.item && !lot) return;

  if (t.item && !it) return;
  const lots = t.item ? ((t.tipo === 'ric' ? Dd.ricLots : Dd.artLots).get(t.id) || []).filter(l => l.res > EPS) : [lot];
  const u = t.item ? baseOf(t.tipo, it) : lotUnit(lot);
  const totRes = r6(lots.reduce((s, l) => s + Math.max(0, l.res), 0));
  const isProd = t.item ? t.tipo === 'ric' : lot.kind === 'prod';
  const types = [['vendita', 'Venduto'], ['scarto', 'Scartato'], ['uso', 'Uso interno']];
  if (!t.item) types.push(['rettifica', 'Rettifica']);
  const st = {tipo: (isProd || it?.categoria === 'rivendita') ? 'vendita' : 'scarto', qta: '', contata: '', data: today(), nota: ''};
  if (!t.item && lot.res <= EPS) st.tipo = 'rettifica';

  openSheet({form: true, st, title: `Scarico: ${name}`, totRes, u,
    body: () => `<p class="muted">${t.item ? `Giacenza ${fmtQ(totRes, u)} in ${lots.length === 1 ? '1 lotto' : lots.length + ' lotti'}: si scarica prima dai lotti che scadono prima.` : `${lot.kind === 'prod' ? 'Lotto ' + esc(lot.p.lotto) : 'Lotto del fornitore ' + esc(lot.lottoF || 'senza codice')} · residuo ${fmtQ(lot.res, u)}`}</p>
      <div class="fld"><span>Motivo</span>${fseg('tipo', st.tipo, types)}</div>
      ${st.tipo === 'rettifica'
        ? `<label class="fld"><span>Quantità contata davvero (${esc(u)})</span><input type="text" inputmode="decimal" data-k="contata" value="${esc(st.contata)}" placeholder="${esc(fmtIn(lot.res))}" autocomplete="off"><small class="hint">La giacenza del lotto viene portata a questo valore.</small></label>`
        : `<label class="fld"><span>Quantità (${esc(u)})</span><input type="text" inputmode="decimal" data-k="qta" value="${esc(st.qta)}" placeholder="0" autocomplete="off"></label>${totRes > EPS ? `<p><button type="button" class="btn" data-act="mov-all">Tutto il residuo: ${fmtQ(totRes, u)}</button></p>` : ''}`}
      <div class="g2"><label class="fld"><span>Data</span><input type="date" data-k="data" value="${esc(st.data)}"></label></div>
      <label class="fld"><span>Nota</span><input type="text" data-k="nota" value="${esc(st.nota)}" placeholder="Facoltativa" autocomplete="off"></label>
      <p class="err" id="ferr" role="alert"></p>`,
    foot: () => foot('Registra'),
    onField: (k, o) => { if (k === 'tipo') paintSheet(o); },
    onSave: async o => {
      if (!validIso(st.data)) return ferr(o, 'Data non valida.');
      if (st.tipo === 'rettifica') {
        const cur = drv()[lot.kind === 'prod' ? 'prod' : 'acq'].get(lot.key); if (!cur) return ferr(o, 'Il lotto non esiste più.');
        const c = pnum(st.contata);
        if (!(c >= 0)) return ferr(o, 'Indica la quantità contata.');
        const delta = r6(c - cur.res);
        if (Math.abs(delta) < EPS) { o.dirty = false; closeSheet(); toast('Nessuna differenza: la giacenza era già giusta.'); return; }
        if (await put('movimenti', uid(), {data: st.data, tipo: 'rettifica', lotKind: cur.kind, lotId: cur.key, delta, nota: st.nota.trim(), creato: Date.now()})) { o.dirty = false; closeSheet(); toast('Giacenza rettificata'); }
        return;

      const avail = r6(fresh.reduce((s, l) => s + l.res, 0));

    }});
