      const r = S.data.ricette.get(st.ricettaId), u = unitOk(r?.resaUnita);
      return `<label class="fld"><span>Prodotto da scheda tecnica</span><select data-k="ricettaId"><option value="">Scegli il prodotto…</option>${recs.map(x => opt(x.id, x.nome, st.ricettaId)).join('')}</select></label>
      ${r ? `<div class="g3">${dateFld('data', 'Data di produzione', st.data)}
        <label class="fld"><span>Quantità prodotta (${u === 'pz' ? 'pezzi' : u})</span>${u === 'pz' ? `<span class="stepper"><button type="button" class="btn" data-act="step" data-d="-1" aria-label="Un pezzo in meno">${IC.minus}</button><input type="text" inputmode="decimal" data-k="qta" value="${esc(st.qta)}" autocomplete="off"><button type="button" class="btn" data-act="step" data-d="1" aria-label="Un pezzo in più">${IC.plus}</button></span>` : `<input type="text" inputmode="decimal" data-k="qta" value="${esc(st.qta)}" autocomplete="off">`}</label>
        <label class="fld"><span>${esc(scadLabel(r.tipoScadenza))}</span><input type="date" data-k="scadenza" value="${esc(st.scadenza)}"></label></div>
        <p class="hint" style="margin:-6px 0 12px">Resa della scheda: ${fmtQ(+r.resaQta, u)}. Scadenza calcolata con la durata della scheda (${esc(shelfTxt(r))}): puoi cambiarla.</p>
        ${validIso(st.data) ? `<div class="lotcode">${IC.tag}<span>Codice del lotto</span><b>${esc(lotCode(r.sigla || autoSigla(r.nome), st.data))}</b></div>` : ''}
        <p class="note" id="scadwarn" hidden></p>
        <h3>Ingredienti e lotti usati</h3>
        <p class="hint" style="margin:-4px 0 10px">Per ogni ingrediente sono proposti per primi i lotti che scadono prima. Correggi le quantità se hai usato lotti diversi.</p>
        ${st.righe.map(ingPick).join('') || empty('La scheda non ha ingredienti.')}
        <label class="chk" id="forza" hidden><input type="checkbox" data-k="forza" ${st.forza ? 'checked' : ''}>Registra comunque: le quantità mancanti restano senza lotto</label>
        <div class="g2"><label class="fld"><span>Operatore</span><input type="text" data-k="operatore" value="${esc(st.operatore)}" placeholder="Chi ha prodotto" autocomplete="off"></label></div>
        <label class="fld"><span>Note</span><textarea data-k="note" rows="3">${esc(st.note)}</textarea></label>` : ''}
      <p class="err" id="ferr" role="alert"></p>`;
    },
    foot: () => foot('Registra lotto'),
    after: o => prodDyn(o),
    onField: (k, o) => {
      if (k === 'ricettaId') { st.qta = ''; st.scadTouched = false; st.forza = false; build(); paintSheet(o); return; }
      if (k === 'data') { if (validIso(st.data)) { build(); paintSheet(o); } return; }
      if (k === 'qta') { clearTimeout(o.qt); o.qt = setTimeout(() => rescale(o), 250); return; }
      if (k === 'scadenza') { st.scadTouched = true; prodDyn(o); return; }
      if (/^righe\.\d+\.lots\.\d+\.q$/.test(k)) prodDyn(o);
    },
    onSave: async o => {
      const r = S.data.ricette.get(st.ricettaId);
      if (!r) return ferr(o, 'Scegli il prodotto da produrre.');
      const qta = pnum(st.qta);
      if (!(qta > 0)) return ferr(o, 'Quantità prodotta non valida.');
      if (!validIso(st.data)) return ferr(o, 'Data di produzione non valida.');
      if (!validIso(st.scadenza)) return ferr(o, 'Indica la scadenza del lotto.');
      if (st.scadenza < st.data) return ferr(o, 'La scadenza è prima della data di produzione.');
      if (!st.righe.length) return ferr(o, 'La scheda non ha ingredienti: completala prima di produrre.');
      const consumi = [], missing = [];
      for (const rg of st.righe) {
        if (!rg.valid) return ferr(o, `Ingrediente non valido nella scheda: ${rg.nome}. Correggi la scheda tecnica.`);
        let tot = 0;
        for (const l of rg.lots) {
          const v = String(l.q).trim() === '' ? 0 : pnum(l.q);
          if (!(v >= 0)) return ferr(o, `${rg.nome}: quantità non valida.`);
          const vb = r6(v * rg.fct);
          if (vb > l.res + EPS) return ferr(o, `${rg.nome}: dal ${l.label} puoi usare al massimo ${fmtQ(l.res / rg.fct, rg.du).replace(/ /g, ' ')}.`);
          if (vb > EPS) { consumi.push({tipo: rg.tipo, refId: rg.refId, nome: rg.nome, lotId: l.key, qta: vb}); tot += vb; }
        }
        const miss = r6(rg.needBase - tot);
        if (miss > Math.max(EPS, rg.needBase * 1e-6)) {
          if (st.forza) consumi.push({tipo: rg.tipo, refId: rg.refId, nome: rg.nome, lotId: null, qta: miss});
          else missing.push(`${rg.nome} (${fmtQ(miss / rg.fct, rg.du).replace(/ /g, ' ')})`);
        }
      }
      if (missing.length) { const f = $('#forza', o.el); if (f) f.hidden = false; return ferr(o, `Mancano: ${missing.join(', ')}. Registra l'acquisto mancante oppure spunta «Registra comunque».`); }
      const doc = {lotto: lotCode(r.sigla || autoSigla(r.nome), st.data), ricettaId: r.id, ricettaNome: r.nome, data: st.data, qta: r6(qta), unita: unitOk(r.resaUnita) || 'pz', scadenza: st.scadenza, tipoScadenza: r.tipoScadenza === 'entro' ? 'entro' : 'preferibilmente', operatore: st.operatore.trim(), note: st.note.trim(), consumi, allergeni: algSort([...recAllergensOf(r, [r.id])]), tracce: algSort([...recTracceOf(r, [r.id])]), creato: Date.now()};
      if (doc.operatore) lsSet('bf-operatore', doc.operatore);
      const nid = uid();
      if (await put('produzioni', nid, doc)) { o.dirty = false; closeSheet(); toast(`Lotto ${doc.lotto} registrato`); sheetLotto(nid); }
    }});
}
function prodDyn(o) {
  const st = o.st; let miss = false, minScad = null, minName = '';
  st.righe.forEach((rg, i) => {
    let tot = 0;
    rg.lots.forEach(l => { const v = pnum(l.q); if (v > 0) { tot += v; if (l.scad && (!minScad || l.scad < minScad)) { minScad = l.scad; minName = rg.nome; } } });
    const el = $(`#sum-${i}`, o.el); if (!el) return;
    if (!rg.valid) { el.className = 'chip red'; el.textContent = 'Ingrediente non valido: controlla la scheda'; miss = true; return; }
    const need = rg.needBase / rg.fct, diff = r6(tot - need), tol = Math.max(EPS, need * 1e-6);
    if (diff < -tol) { el.className = 'chip amb'; el.textContent = `Mancano ${fmtQ(-diff, rg.du)}`; miss = true; }
    else if (diff > tol) { el.className = 'chip'; el.textContent = `${fmtQ(diff, rg.du)} in più della ricetta`; }
    else { el.className = 'chip ok'; el.textContent = 'Quantità coperta'; }
  });
  const f = $('#forza', o.el); if (f && !st.forza) f.hidden = !miss;
  const w = $('#scadwarn', o.el);
  if (w) {
    const show = !!minScad && validIso(st.scadenza) && st.scadenza > minScad;
    w.hidden = !show;
    if (show) w.textContent = `Nota: un ingrediente usato scade prima del prodotto (${minName}, ${fmtD(minScad)}). Va bene per i prodotti cotti; per creme e prodotti freschi verifica la scadenza.`;
  }
}

/* modifica dei dati di un lotto già prodotto */
function formEditProd(id) {
  const l = drv().prod.get(id); if (!l) return;
  const p = l.p, u = lotUnit(l);
  const st = {qta: fmtIn(l.qta), scadenza: p.scadenza || '', operatore: p.operatore || '', note: p.note || ''};
  openSheet({form: true, st, title: `Modifica lotto ${p.lotto}`,
    body: () => `<p class="muted">Ingredienti e lotti usati non si modificano: se sono sbagliati, elimina il lotto e registralo di nuovo.</p>
      <div class="g2"><label class="fld"><span>Quantità prodotta (${esc(u)})</span><input type="text" inputmode="decimal" data-k="qta" value="${esc(st.qta)}" autocomplete="off"></label>
      <label class="fld"><span>${esc(scadLabel(p.tipoScadenza))}</span><input type="date" data-k="scadenza" value="${esc(st.scadenza)}"></label></div>
      <label class="fld"><span>Operatore</span><input type="text" data-k="operatore" value="${esc(st.operatore)}" autocomplete="off"></label>
      <label class="fld"><span>Note</span><textarea data-k="note" rows="3">${esc(st.note)}</textarea></label>
      <p class="err" id="ferr" role="alert"></p>`,
    foot: () => foot('Salva modifiche'),
    onSave: async o => {
      const cur = drv().prod.get(id); if (!cur) return ferr(o, 'Il lotto non esiste più.');
      const q = pnum(st.qta);
      if (!(q > 0)) return ferr(o, 'Quantità non valida.');
      const min = r6(cur.usedQ - cur.movQ);
      if (q < min - EPS) return ferr(o, `Sono già stati usati o scaricati ${fmtQ(min, u).replace(/ /g, ' ')}: la quantità non può essere minore.`);
      if (!validIso(st.scadenza) || st.scadenza < cur.p.data) return ferr(o, 'Scadenza non valida.');
      if (await put('produzioni', id, {...strip(cur.p), qta: r6(q), scadenza: st.scadenza, operatore: st.operatore.trim(), note: st.note.trim()})) { o.dirty = false; closeSheet(); toast('Lotto aggiornato'); }
    }});
}

/* scarichi (vendita, scarto, uso interno) e rettifiche */
function formMov(t) {
  const Dd = drv();
  const lot = t.item ? null : (t.kind === 'prod' ? Dd.prod.get(t.id) : Dd.acq.get(t.id));
  if (!t.item && !lot) return;
  const it = t.item ? itemOf(t.tipo, t.id) : lot.item;
  if (t.item && !it) return;
  const lots = t.item ? ((t.tipo === 'ric' ? Dd.ricLots : Dd.artLots).get(t.id) || []).filter(l => l.res > EPS) : [lot];
  const u = t.item ? baseOf(t.tipo, it) : lotUnit(lot);
  const totRes = r6(lots.reduce((s, l) => s + Math.max(0, l.res), 0));
  const isProd = t.item ? t.tipo === 'ric' : lot.kind === 'prod';
  const types = [['vendita', 'Venduto'], ['scarto', 'Scartato'], ['uso', 'Uso interno']];
  if (!t.item) types.push(['rettifica', 'Rettifica']);
  const st = {tipo: (isProd || it?.categoria === 'rivendita') ? 'vendita' : 'scarto', qta: '', contata: '', data: today(), nota: ''};
  if (!t.item && lot.res <= EPS) st.tipo = 'rettifica';
  const name = t.item ? it.nome : lotName(lot);
  openSheet({form: true, st, title: `Scarico: ${name}`, totRes, u,
    body: () => `<p class="muted">${t.item ? `Giacenza ${fmtQ(totRes, u)} in ${lots.length === 1 ? '1 lotto' : lots.length + ' lotti'}: si scarica prima dai lotti che scadono prima.` : `${lot.kind === 'prod' ? 'Lotto ' + esc(lot.p.lotto) : 'Lotto del fornitore ' + esc(lot.lottoF || 'senza codice')} · residuo ${fmtQ(lot.res, u)}`}</p>
      <div class="fld"><span>Motivo</span>${fseg('tipo', st.tipo, types)}</div>
      ${st.tipo === 'rettifica'
        ? `<label class="fld"><span>Quantità contata davvero (${esc(u)})</span><input type="text" inputmode="decimal" data-k="contata" value="${esc(st.contata)}" placeholder="${esc(fmtIn(lot.res))}" autocomplete="off"><small class="hint">La giacenza del lotto viene portata a questo valore.</small></label>`
        : `<label class="fld"><span>Quantità (${esc(u)})</span><input type="text" inputmode="decimal" data-k="qta" value="${esc(st.qta)}" placeholder="0" autocomplete="off"></label>${totRes > EPS ? `<p><button type="button" class="btn" data-act="mov-all">Tutto il residuo: ${fmtQ(totRes, u)}</button></p>` : ''}`}
      <div class="g2">${dateFld('data', 'Data', st.data)}</div>
      <label class="fld"><span>Nota</span><input type="text" data-k="nota" value="${esc(st.nota)}" placeholder="Facoltativa" autocomplete="off"></label>
      <p class="err" id="ferr" role="alert"></p>`,
    foot: () => foot('Registra'),
    onField: (k, o) => { if (k === 'tipo') paintSheet(o); },
    onSave: async o => {
      if (!validIso(st.data)) return ferr(o, 'Data non valida.');
      if (st.tipo === 'rettifica') {
        const cur = drv()[lot.kind === 'prod' ? 'prod' : 'acq'].get(lot.key); if (!cur) return ferr(o, 'Il lotto non esiste più.');
        const c = pnum(st.contata);
        if (!(c >= 0)) return ferr(o, 'Indica la quantità contata.');
        const delta = r6(c - cur.res);
        if (Math.abs(delta) < EPS) { o.dirty = false; closeSheet(); toast('Nessuna differenza: la giacenza era già giusta.'); return; }
        if (await put('movimenti', uid(), {data: st.data, tipo: 'rettifica', lotKind: cur.kind, lotId: cur.key, delta, nota: st.nota.trim(), creato: Date.now()})) { o.dirty = false; closeSheet(); toast('Giacenza rettificata'); }
        return;
      }
      const q = pnum(st.qta);
      if (!(q > 0)) return ferr(o, 'Indica la quantità.');
      const fresh = lots.map(l => drv()[l.kind === 'prod' ? 'prod' : 'acq'].get(l.key)).filter(l => l && l.res > EPS);
      const avail = r6(fresh.reduce((s, l) => s + l.res, 0));
      if (q > avail + EPS) return ferr(o, `Puoi scaricare al massimo ${fmtQ(avail, u).replace(/ /g, ' ')}.`);
      const t0 = today();
      const ordered = st.tipo === 'scarto' ? fresh : [...fresh.filter(l => !(l.scad && l.scad < t0)), ...fresh.filter(l => l.scad && l.scad < t0)];
      let rem = q; const movs = [];
      for (const l of ordered) { if (rem <= EPS) break; const x = Math.min(l.res, rem); movs.push({data: st.data, tipo: st.tipo, lotKind: l.kind, lotId: l.key, delta: -r6(x), nota: st.nota.trim(), creato: Date.now()}); rem = r6(rem - x); }
      let ok = true;
      for (const m of movs) ok = (await put('movimenti', uid(), m)) && ok;
      if (ok) { o.dirty = false; closeSheet(); toast(`Scarico registrato: ${fmtQ(q, u).replace(/ /g, ' ')} (${MOV[st.tipo].toLowerCase()})`); }
    }});
}

/* le produzioni delle ultime sei settimane, dalle più frequenti, con la quantità fatta più spesso:
   un tocco e il modulo è già compilato */
function prodAbituali(n = 3) {
  const t = today(), from = addDays(t, -42), m = new Map();
  for (const p of S.data.produzioni.values()) {
    const r = S.data.ricette.get(p.ricettaId);
    if (!r || r.archiviato || !validIso(p.data) || p.data < from || p.data > t || !(+p.qta > 0)) continue;
    const x = m.get(r.id) || {r, n: 0, last: p, qs: new Map()};
    x.n++;
    if (p.data > x.last.data || (p.data === x.last.data && (p.creato || 0) > (x.last.creato || 0))) x.last = p;
    const q = r6(+p.qta); x.qs.set(q, (x.qs.get(q) || 0) + 1);
    m.set(r.id, x);
  }
  return [...m.values()].map(x => {
    const lq = r6(+x.last.qta);
    x.qta = [...x.qs.entries()].sort((a, b) => b[1] - a[1] || (b[0] === lq) - (a[0] === lq))[0][0];
    return x;
  }).sort((a, b) => b.n - a.n || b.last.data.localeCompare(a.last.data)).slice(0, n);
}
const quando = d => { const n = daysBetween(d, today()); return n <= 0 ? 'oggi' : n === 1 ? 'ieri' : `${n} giorni fa`; };

      return `<div class="bar">${`<label class="srch">${IC.search}<input type="search" id="q-scarico" data-sq="1" value="${esc(o.q)}" placeholder="Cerca prodotto o articolo" aria-label="Cerca prodotto o articolo" autocomplete="off"></label>`}</div>

    }};
  openSheet(o);
}

/* ricerca globale: lotti, articoli, schede, documenti, fornitori */
function sheetSearch() {
  if (top()?.isSearch) return;
  const o = {title: 'Cerca', isSearch: true, q: '',
    body: () => {
      const q = o.q.trim().toLowerCase();
      if (q.length < 2) return `<div class="bar">${searchInput(o)}</div>${empty('Scrivi almeno due lettere: codice di un lotto (anche del fornitore), prodotto, articolo, numero di fattura o fornitore.', IC.search)}`;
      const Dd = drv(), has = v => String(v || '').toLowerCase().includes(q);
      const prod = [...Dd.prod.values()].filter(l => has(l.p.lotto) || has(lotName(l))).sort((a, b) => b.data.localeCompare(a.data)).slice(0, 6);
      const acq = [...Dd.acq.values()].filter(l => l.lottoF && has(l.lottoF)).slice(0, 6);
      const arts = [...S.data.articoli.values()].filter(a => has(a.nome) || has(a.etichetta)).sort(byName).slice(0, 6);
      const ric = [...S.data.ricette.values()].filter(r => has(r.nome) || has(r.sigla)).sort(byName).slice(0, 6);
      const docs = [...S.data.documenti.values()].filter(d => has(d.numero) || has(docName(d)) || has(fornName(d.fornitoreId)) || has(d.fatturaRif)).sort((a, b) => String(b.data).localeCompare(String(a.data))).slice(0, 6);
      const forn = [...S.data.fornitori.values()].filter(f => has(f.nome) || has(f.piva)).sort(byName).slice(0, 6);
      const sec = (t, rows) => rows.length ? `<h3>${esc(t)}</h3><div class="list">${rows.join('')}</div>` : '';
      const out = [
        sec('Lotti prodotti', prod.map(l => prodRow(l))),
        sec('Lotti dei fornitori', acq.map(l => lotRow(l))),
        sec('Articoli', arts.map(artRow)),
        sec('Schede tecniche', ric.map(r => `<button type="button" class="row" data-act="open-ric" data-id="${esc(r.id)}">${av(esc(r.sigla || autoSigla(r.nome)), 'pri')}<span class="m"><b>${esc(r.nome)}</b><span>${esc(r.categoria || 'Senza categoria')}${r.semilavorato ? ' · semilavorato' : ''}</span></span></button>`)),
        sec('Documenti', docs.map(d => `<button type="button" class="row" data-act="open-doc" data-id="${esc(d.id)}">${av(DOCAB[d.tipo] || 'DOC')}<span class="m"><b>${esc(docName(d))}</b><span>${esc(fornName(d.fornitoreId) || '—')}</span></span><span class="s"><span class="q">${EUR(docTot(d))}</span></span></button>`)),
        sec('Fornitori', forn.map(f => `<button type="button" class="row" data-act="open-forn" data-id="${esc(f.id)}">${av(initials(f.nome))}<span class="m"><b>${esc(f.nome)}</b><span>${esc(f.note || f.piva || 'Fornitore')}</span></span></button>`))
      ].join('');
      return `<div class="bar">${searchInput(o)}</div><div class="sres">${out || empty('Nessun risultato.', IC.search)}</div>`;
    }};
  openSheet(o);
  const i = $('#q-globale', o.el); if (i) i.focus({preventScroll: true});
}
const searchInput = o => `<label class="srch">${IC.search}<input type="search" id="q-globale" data-gq="1" value="${esc(o.q)}" placeholder="Lotto, prodotto, fattura, fornitore…" aria-label="Cerca in tutta l'app" autocomplete="off" enterkeyhint="search"></label>`;

/* carosello delle etichette */
function scrollLabels(dir) {
  const el = $('#labels'); if (!el) return;
  const card = el.firstElementChild, step = card ? card.getBoundingClientRect().width + 12 : el.clientWidth * 0.8;
  el.scrollBy({left: dir * step, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

/* installabile sul telefono quando è pubblicata su un sito (non dentro claude.ai) */
function setupPWA() {
  if (S.mode !== 'local' || !/^https?:$/.test(location.protocol)) return;
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.append(l);
  const ic = document.createElement('link'); ic.rel = 'apple-touch-icon'; ic.href = 'icone/icon-180.png'; document.head.append(ic);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => {
      // l'app installata può restare aperta per giorni: quando torna in primo piano controlla se c'è una versione nuova
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { reg.update().catch(() => {}); checkVersion(); } });
    }).catch(() => { /* senza lavoro offline */ });
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) checkVersion(); });
  }
  setTimeout(checkVersion, 2500);
}
/* se sul sito c'è una versione diversa da quella aperta, un avviso propone di ricaricare */
let versionAsked = false;
async function checkVersion() {
  const cur = $('meta[name=barista-versione]')?.content;
  if (versionAsked || !cur || !navigator.onLine) return;
  try {
    const html = await (await fetch('index.html', {cache: 'no-cache'})).text();
    const v = html.match(/name="barista-versione" content="([0-9a-f]+)"/)?.[1];
    if (v && v !== cur && !versionAsked) { versionAsked = true; toast('C’è una versione nuova di Barista Flow.', false, {label: 'Aggiorna', stay: true, fn: () => location.reload()}); }
  } catch { /* senza rete: si riprova la prossima volta */ }
}

/* ---------- Banco: lo scontrino interno ----------
   Alla cassa il bar batte solo il reparto, quindi l'app non sa cosa è stato venduto. Il Banco è lo scontrino
   interno: i prodotti in vendita a tasti grandi, ogni tocco ne aggiunge uno, le quantità si sistemano e si preme
   Invio. Il magazzino si scarica subito, prima dai lotti che scadono prima; l'ultimo scontrino si annulla con un
   tocco e in fondo alla pagina ci sono gli scontrini della giornata. */
const BANCO = {cart: new Map(), pop: null, draft: null, tutti: false, busy: false, t: 0};

/* i prodotti in vendita: le schede tecniche (tranne i semilavorati) e gli articoli di rivendita,
   per categoria e per nome, così ogni tasto resta sempre allo stesso posto */
function bancoItems() {
  const Dd = drv(), out = [];
  const add = (tipo, it, lots, u, cat) => {
    const p = +it.prezzoVendita;
    out.push({k: `${tipo}:${it.id}`, tipo, it, nome: String(it.nome || '').trim() || 'Senza nome', u, cat, s: stockOf(lots), prezzo: p > 0 ? p : null, step: u === 'pz' ? 1 : 0.1});
  };
  for (const r of S.data.ricette.values()) if (!r.archiviato && !r.semilavorato) add('ric', r, Dd.ricLots.get(r.id), unitOk(r.resaUnita) || 'pz', String(r.categoria || '').trim() || 'Altri prodotti');
  for (const a of S.data.articoli.values()) if (!a.archiviato && a.categoria === 'rivendita') add('art', a, Dd.artLots.get(a.id), unitOk(a.unita) || 'pz', 'Rivendita');
  return out.sort((x, y) => bancoCatOrd(x.cat, y.cat) || byName(x, y));
}
const bancoCatOrd = (a, b) => { const r = c => c === 'Rivendita' ? 2 : c === 'Altri prodotti' ? 1 : 0; return r(a) - r(b) || a.localeCompare(b, 'it'); };
const bancoIdx = () => new Map(bancoItems().map(x => [x.k, x]));
const bancoQ = (q, u) => u === 'pz' ? num(q) : fmtQ(q, u);
const bancoPrezzo = x => x.prezzo == null ? '' : EUR(x.prezzo) + (x.u === 'pz' ? '' : '/' + x.u);
const bancoRiga = (nome, q, u) => `${nome} ${u === 'pz' ? '×' + num(q) : fmtQ(q, u)}`;
const bancoResta = x => `${x.nome}: ne ${x.u === 'pz' && x.s.usable === 1 ? 'resta' : 'restano'} solo ${fmtQ(x.s.usable, x.u)}.`;
const bancoDom = k => k.replace(/[^\w-]/g, '-');
const bancoNome = n => esc(n).replace(/(\d) (?=(?:l|cl|ml|g|kg|pz)\b)/gi, '$1\u00a0');

/* le righe dello scontrino in corso, nell'ordine in cui sono state toccate; quelle sparite dall'archivio escono */
function bancoRighe(idx = bancoIdx()) {
  const out = [];
  for (const [k, q] of BANCO.cart) { const x = idx.get(k); if (x && q > EPS) out.push({x, q}); else BANCO.cart.delete(k); }
  return out;
}
function bancoConto(rs) {
  let tot = 0, senza = 0, pz = 0, altro = 0;
  for (const {x, q} of rs) { if (x.prezzo != null) tot += q * x.prezzo; else senza++; if (x.u === 'pz') pz += q; else altro++; }
  return {tot: Math.round(tot * 100) / 100, senza, pz, altro, n: rs.length};
}
const bancoPezzi = c => c.altro ? (c.n === 1 ? '1 prodotto' : `${c.n} prodotti`) : (c.pz === 1 ? '1 pezzo' : `${num(c.pz)} pezzi`);

/* ---------- modifiche allo scontrino ---------- */
function bancoPaint() { clearTimeout(BANCO.t); renderMain(); BANCO.pop = null; refreshSheets(); }
/* una quantità che si sta scrivendo vale subito: su iPhone il tocco su Invio può arrivare prima che il campo la confermi */
function bancoFlush() { if (BANCO.draft) bancoSet(BANCO.draft.k, BANCO.draft.v, true); }
function bancoAdd(k) {
  if (!guard()) return;
  bancoFlush();
  const x = bancoIdx().get(k); if (!x) return;
  if (x.s.usable <= EPS) { toast(x.s.expired > EPS ? `${x.nome}: c’è solo merce scaduta, da smaltire.` : `${x.nome} non risulta in giacenza: registra la produzione o l’acquisto per venderlo.`, true); return; }
  const cur = BANCO.cart.get(k) || 0, nq = r6(Math.min(cur + x.step, x.s.usable));
  if (nq <= cur + EPS) { toast(bancoResta(x), true); return; }
  BANCO.cart.set(k, nq); BANCO.pop = k; bancoPaint();
}
function bancoSub(k) {
  bancoFlush();
  const cur = BANCO.cart.get(k); if (!cur) return;
  const x = bancoIdx().get(k), nq = r6(cur - (x?.step || 1));
  if (nq <= EPS) BANCO.cart.delete(k); else BANCO.cart.set(k, nq);
  bancoPaint();
}
/* quantità scritta a mano: vuota o zero toglie la riga, oltre la giacenza si ferma a quella */
function bancoSet(k, v, later) {
  BANCO.draft = null;
  const x = bancoIdx().get(k);
  let q = String(v ?? '').trim() === '' ? 0 : pnum(v);
  if (x && !(q >= 0)) toast('Quantità non valida.', true);
  else if (x) {
    if (x.u === 'pz') q = Math.round(q);
    if (q > x.s.usable + EPS) { toast(bancoResta(x), true); q = x.s.usable; }
    if (q <= EPS) BANCO.cart.delete(k); else BANCO.cart.set(k, r6(q));
  }
  // dopo aver scritto si tocca spesso subito Invio: la pagina si ridisegna un attimo dopo, così quel tocco non va perso
  if (later) { clearTimeout(BANCO.t); BANCO.t = setTimeout(bancoPaint, 400); } else bancoPaint();
}
function bancoSvuota() {
  if (!BANCO.cart.size) return;
  const prima = new Map(BANCO.cart);
  BANCO.cart.clear(); BANCO.draft = null;
  if (top()?.banco) closeSheet();
  bancoPaint();
  toast('Scontrino svuotato', false, {label: 'Ripristina', fn: () => { if (BANCO.cart.size) return; BANCO.cart = prima; bancoPaint(); }});
}

/* Invio: una vendita per ogni lotto toccato, prima i lotti che scadono prima; tutto o niente */
async function bancoInvio() {
  if (!guard() || BANCO.busy) return;
  bancoFlush();
  const rs = bancoRighe();
  if (!rs.length) { toast('Tocca prima i prodotti venduti.', true); return; }
  // la giacenza si ricontrolla adesso: da un altro dispositivo qualcuno può aver venduto o scaricato
  const corto = rs.find(r => r.q > r.x.s.usable + EPS);
  if (corto) { toast(`${bancoResta(corto.x)} Correggi la quantità.`, true); return; }
  const t = today(), Dd = drv(), id = 'bc' + uid(), ult = bancoScontrini(t)[0];
  const creato = Math.max(Date.now(), (ult?.creato || 0) + 1), d = new Date(creato), ora = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const extra = countSample() ? {esempio: true} : {};   // durante la prova anche le vendite sono di prova
  const ops = [];
  for (const {x, q} of rs) {
    let rem = q;
    for (const l of (x.tipo === 'ric' ? Dd.ricLots : Dd.artLots).get(x.it.id) || []) {
      if (rem <= EPS) break;
      if (l.res <= EPS || (l.scad && l.scad < t)) continue;
      const qq = r6(Math.min(l.res, rem)); rem = r6(rem - qq);
      ops.push(['movimenti', uid(), {data: t, tipo: 'vendita', lotKind: l.kind, lotId: l.key, delta: -qq, nota: `Banco, ore ${ora}`, banco: id, ...(x.prezzo != null ? {prezzo: x.prezzo} : {}), creato, ...extra}]);
    }
  }
  const c = bancoConto(rs), prima = new Map(BANCO.cart);
  // lo scontrino si libera subito: si può già battere il prossimo mentre questo si salva
  BANCO.busy = true; BANCO.cart.clear(); BANCO.draft = null; UI.q.banco = '';
  if (top()?.banco) closeSheet();
  let ok = 0;
  try { ok = await writeMany(ops); } finally { BANCO.busy = false; }
  if (ok < ops.length) {
    await writeMany(ops.map(([col, i]) => [col, i, null]));
    if (!BANCO.cart.size) BANCO.cart = prima;
    bancoPaint();
    toast('Scontrino non registrato: controlla la connessione e riprova.', true);
    return;
  }
  buzz(); bancoPaint();
  toast(`Scontrino registrato: ${bancoPezzi(c)}${c.tot > 0 ? ' · ' + EUR(c.tot) : ''}`, false, {label: 'Annulla', fn: () => bancoAnnulla(id, true)});
}
async function bancoAnnulla(id, subito) {
  if (!guard()) return;
  const ms = [...S.data.movimenti.values()].filter(m => m.banco === id);
  if (!ms.length) return;
  if (!subito) {
    const s = bancoScontrini(ms[0].data).find(x => x.id === id);
    if (!(await ask(`Annullo lo scontrino delle ${s?.ora || '—'}${s ? ` (${bancoPezzi(s)}${s.tot > 0 ? ', ' + EUR(s.tot) : ''})` : ''}? I prodotti tornano in giacenza.`, 'Sì, annulla', true, 'No, lascialo'))) return;
  }
  const ok = await writeMany(ms.map(m => ['movimenti', m.id, null]));
  toast(ok === ms.length ? 'Scontrino annullato: i prodotti sono tornati in giacenza.' : 'Non sono riuscito ad annullare tutto lo scontrino: riprova.', ok < ms.length);
}

/* gli scontrini di un giorno, dal più recente: righe per prodotto (anche se presi da più lotti) e totale */
function bancoScontrini(t = today()) {
  const Dd = drv(), m = new Map();
  for (const v of S.data.movimenti.values()) {
    if (!v.banco || v.data !== t) continue;
    let s = m.get(v.banco);
    if (!s) m.set(v.banco, s = {id: v.banco, creato: +v.creato || 0, righe: new Map(), tot: 0, senza: 0, pz: 0, altro: 0});
    const l = (v.lotKind === 'prod' ? Dd.prod : Dd.acq).get(v.lotId), k = l ? `${l.kind}:${l.itemId}` : 'x';
    const r = s.righe.get(k) || {nome: l ? lotName(l) : 'Prodotto eliminato', u: l ? lotUnit(l) : '', q: 0, prezzo: +v.prezzo > 0 ? +v.prezzo : null};
    r.q = r6(r.q + Math.abs(+v.delta || 0)); s.righe.set(k, r);
  }
  for (const s of m.values()) {
    for (const r of s.righe.values()) { if (r.prezzo != null) s.tot += r.q * r.prezzo; else s.senza++; if (r.u === 'pz') s.pz += r.q; else s.altro++; }
    s.tot = Math.round(s.tot * 100) / 100; s.n = s.righe.size;
    const d = new Date(s.creato); s.ora = s.creato ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
  }
  return [...m.values()].sort((a, b) => b.creato - a.creato || (a.id < b.id ? 1 : -1));
}
const bancoDesc = s => [...s.righe.values()].map(r => bancoRiga(r.nome, r.q, r.u)).join(', ');

/* ---------- la pagina ---------- */
function vBanco() {
  const all = bancoItems(), idx = new Map(all.map(x => [x.k, x])), rs = bancoRighe(idx), c = bancoConto(rs), sc = bancoScontrini();
  const head = `<div class="ph"><div><h1>Banco</h1><p>Tocca i prodotti venduti e premi Invio: il magazzino si aggiorna da solo.</p></div></div>`;
  if (!all.length) return `<section id="v-banco">${head}${empty('Non c’è ancora niente da vendere. Al Banco compaiono le schede tecniche dei prodotti (non i semilavorati) e gli articoli di rivendita, come le bibite.', IC.banco)}
    <div class="acts w bk-new"><button type="button" class="btn" data-act="new-ric">${IC.plus}Nuova scheda tecnica</button><button type="button" class="btn" data-act="banco-new-art">${IC.plus}Nuovo articolo di rivendita</button></div></section>`;
  const cats = [...new Set(all.map(x => x.cat))];
  if (UI.bancoCat && !cats.includes(UI.bancoCat)) UI.bancoCat = '';
  const q = UI.q.banco.trim().toLowerCase();
  const vis = all.filter(x => (!UI.bancoCat || x.cat === UI.bancoCat) && (!q || x.nome.toLowerCase().includes(q)));
  const groups = [];
  for (const x of vis) { let g = groups[groups.length - 1]; if (!g || g.c !== x.cat) groups.push(g = {c: x.cat, xs: []}); g.xs.push(x); }
  const heads = !UI.bancoCat && cats.length > 1;
  const grid = groups.length ? groups.map(g => `${heads ? `<h3 class="bk-gh">${esc(g.c)}</h3>` : ''}<div class="bgrid">${g.xs.map(bancoTasto).join('')}</div>`).join('')
    : empty(q ? 'Nessun prodotto corrisponde alla ricerca.' : 'Nessun prodotto in questa categoria.', IC.search);
  const bar = S.ro ? '' : bancoBar(rs, c, sc[0]);
  return `<section id="v-banco"${bar ? ' class="has-bar"' : ''}>${head}
    <div class="bk"><div class="bk-main">
      <div class="bar">${search('banco', 'Cerca un prodotto')}${cats.length > 1 ? seg('bancoCat', [['', 'Tutti'], ...cats.map(x => [x, x])]) : ''}</div>
      ${S.ro ? `<p class="note">${IC.info}<span>Hai accesso solo in lettura: puoi guardare i prodotti, ma non registrare vendite.</span></p>` : ''}
      ${grid}${bancoOggi(sc)}</div>
      ${S.ro ? '' : bancoSide(rs, c, sc[0])}</div>${bar}</section>`;
}
function bancoTasto(x) {
  const q = BANCO.cart.get(x.k) || 0, off = x.s.usable <= EPS, exp = off && x.s.expired > EPS;
  const stato = off ? (exp ? 'Scaduto' : 'Esaurito') : fmtQ(x.s.usable, x.u), pr = bancoPrezzo(x);
  const label = `${x.nome}: ${off ? stato.toLowerCase() : 'disponibili ' + stato}${pr ? ', ' + pr : ''}${q ? `, nello scontrino ${bancoQ(q, x.u)}` : ''}`;
  return `<div class="bt${q ? ' sel' : ''}${off ? ' off' : ''}${exp ? ' exp' : ''}${BANCO.pop === x.k ? ' pop' : ''}"><button type="button" class="bt-add" id="bk-${bancoDom(x.k)}" data-act="banco-add" data-k="${esc(x.k)}" aria-label="${esc(label)}"${off ? ' aria-disabled="true"' : ''}><span class="bt-n">${bancoNome(x.nome)}</span><span class="bt-f"><span class="bt-s">${esc(stato)}</span>${pr ? `<span class="bt-p">${esc(pr)}</span>` : ''}</span></button>${q ? `<span class="bt-q" aria-hidden="true">${esc(bancoQ(q, x.u))}</span><button type="button" class="bt-sub" id="bm-${bancoDom(x.k)}" data-act="banco-sub" data-k="${esc(x.k)}" aria-label="Uno in meno: ${esc(x.nome)}">${IC.minus}</button>` : ''}</div>`;
}
/* le righe con le quantità da sistemare: nel riquadro di lato (computer) o nel foglio dello scontrino (telefono) */
function bancoRigheHtml(rs, pre) {
  return `<div class="bk-rows">${rs.map(({x, q}) => {
    const d = bancoDom(x.k), v = BANCO.draft?.k === x.k ? BANCO.draft.v : fmtIn(q);
    return `<div class="bk-r"><span class="bk-rn"><b>${bancoNome(x.nome)}</b><small>${x.prezzo != null ? `${esc(bancoPrezzo(x))}${x.u === 'pz' ? ' l’uno' : ''} · ${EUR(q * x.prezzo)}` : 'Senza prezzo di vendita'}</small></span>
      <span class="bk-st"><button type="button" class="btn icon" id="${pre}m-${d}" data-act="banco-sub" data-k="${esc(x.k)}" aria-label="Uno in meno: ${esc(x.nome)}">${IC.minus}</button><input type="text" inputmode="${x.u === 'pz' ? 'numeric' : 'decimal'}" id="${pre}q-${d}" data-bq="${esc(x.k)}" value="${esc(v)}" aria-label="Quantità di ${esc(x.nome)}${x.u === 'pz' ? '' : ' in ' + x.u}" autocomplete="off" enterkeyhint="done">${x.u === 'pz' ? '' : `<small class="bk-u">${esc(x.u)}</small>`}<button type="button" class="btn icon" id="${pre}p-${d}" data-act="banco-add" data-k="${esc(x.k)}" aria-label="Uno in più: ${esc(x.nome)}">${IC.plus}</button></span></div>`;
  }).join('')}</div>`;
}
const bancoTot = c => `<div class="bk-tot"><span>${c.n ? esc(bancoPezzi(c)) : 'Totale'}</span><b>${EUR(c.tot)}</b></div>${c.senza ? `<p class="hint bk-senza">${c.senza === 1 ? 'Un prodotto non ha' : `${c.senza} prodotti non hanno`} il prezzo di vendita: non entra nel totale.</p>` : ''}`;
function bancoSide(rs, c, last) {
  return `<aside class="bk-side" aria-label="Scontrino"><div class="bk-card">
      <div class="bk-h"><h2>Scontrino</h2>${rs.length ? '<button type="button" class="lnk" data-act="banco-svuota">Svuota</button>' : ''}</div>
      ${rs.length ? bancoRigheHtml(rs, 'b') : '<p class="bk-vuoto">Tocca i prodotti venduti: compaiono qui, con le quantità.</p>'}
      ${bancoTot(c)}
      <button type="button" class="btn pri bk-ok" id="bk-invio" data-act="banco-invio"${rs.length ? '' : ' disabled'}>Invio</button>
      <p class="hint bk-kbd">Con la tastiera basta premere Invio.</p></div>
    ${last ? `<div class="bk-last"><span class="m"><b>Ultimo scontrino · ${esc(last.ora)}</b><span>${esc(bancoPezzi(last))}${last.tot > 0 ? ' · ' + EUR(last.tot) : ''} · ${esc(bancoDesc(last))}</span></span><button type="button" class="btn sm" data-act="banco-annulla" data-id="${esc(last.id)}">Annulla</button></div>` : ''}</aside>`;
}
/* sul telefono: in basso lo scontrino in corso con Invio; a scontrino vuoto, l'ultimo battuto da annullare */
function bancoBar(rs, c, last) {
  if (rs.length) return `<div class="bk-bar on" role="region" aria-label="Scontrino in corso"><button type="button" class="bk-sum" data-act="banco-apri" aria-label="Apri lo scontrino per cambiare le quantità"><b>${esc(bancoPezzi(c))}</b><span>${c.tot > 0 || !c.senza ? EUR(c.tot) : 'Senza prezzi'} · Modifica</span></button><button type="button" class="bk-x" data-act="banco-svuota" aria-label="Svuota lo scontrino">${IC.x}</button><button type="button" class="bk-inv" data-act="banco-invio">Invio</button></div>`;
  if (last) return `<div class="bk-bar" role="region" aria-label="Ultimo scontrino"><span class="m"><b>Ultimo scontrino · ${esc(last.ora)}</b><span>${esc(bancoPezzi(last))}${last.tot > 0 ? ' · ' + EUR(last.tot) : ''} · ${esc(bancoDesc(last))}</span></span><button type="button" class="btn sm" data-act="banco-annulla" data-id="${esc(last.id)}">Annulla</button></div>`;
  return '';
}
function bancoOggi(sc) {
  if (!sc.length) return '';
  const tot = Math.round(sc.reduce((s, x) => s + x.tot, 0) * 100) / 100, pz = r6(sc.reduce((s, x) => s + x.pz, 0)), senza = sc.some(x => x.senza);
  const vis = BANCO.tutti || sc.length <= 5 ? sc : sc.slice(0, 4);
  const row = s => `<div class="row has-act"><span class="row-main">${av(IC.receipt)}<span class="m"><b>${esc(s.ora)}${s.tot > 0 ? ' · ' + EUR(s.tot) : ''}</b><span>${esc(bancoDesc(s))}</span></span></span>${S.ro ? '' : `<button type="button" class="btn sm" data-act="banco-annulla" data-id="${esc(s.id)}">Annulla</button>`}</div>`;
  return `<h2 id="bk-oggi">Scontrini di oggi</h2>
    <p class="bk-stat">${sc.length === 1 ? '1 scontrino' : `${sc.length} scontrini`}${pz ? ` · ${num(pz)} ${pz === 1 ? 'pezzo' : 'pezzi'}` : ''}${tot > 0 ? ` · ${EUR(tot)}${senza ? ' (senza i prodotti che non hanno prezzo)' : ''}` : ''}</p>
    <div class="list bk-list">${vis.map(row).join('')}${vis.length < sc.length ? `<button type="button" class="row" data-act="banco-tutti">${av(IC.clock)}<span class="m"><b>Altri ${sc.length - vis.length} scontrini</b><span>Mostra tutti quelli di oggi</span></span></button>` : ''}</div>`;
}
/* il foglio dello scontrino sul telefono, per cambiare le quantità o scriverle */
function sheetBanco() {

/* --- salvataggio --- */
async function feSave(e, fid, solo, lines) {
  // lines: per riga {skip} oppure {a, f, q, lotto, scadenza}
  const f = e.f, newF = !fid;
  if (newF) {
    fid = uid();
    if (!(await put('fornitori', fid, {nome: (f.forn.nome || 'Fornitore').slice(0, 80), piva: fePiva(f.forn.piva) || f.forn.cf || '', telefono: f.forn.telefono || '', email: f.forn.email || '', note: f.forn.sede ? `Sede: ${f.forn.sede}` : '', abbinamenti: {}, creato: Date.now()}))) return false;
  }
  const used = f.righe.map((r, i) => ({r, x: lines[i]})).filter(({x}) => !x.skip).map(({r, x}) => {
    const tot = x.imp != null ? x.imp : r.totale, qta = r6(x.q * x.f), imp = tot != null ? Math.round(tot * 100) / 100 : null;
    return {a: x.a, qta, imp, pu: imp != null && qta > 0 ? imp / qta : null, lotto: x.lotto, scadenza: x.scadenza};
  });
  // fattura differita con i DDT già registrati: si completano i loro prezzi, la merce non si carica di nuovo
  const ddts = solo ? feDdtDocs(f, fid) : [], inDdt = new Set(ddts.flatMap(d => (d.righe || []).map(r => r.articoloId)));
  for (const d of ddts) {
    const righe = (d.righe || []).map(r => { if (r.importo != null && r.importo !== '') return r; const s = used.find(u => u.a === r.articoloId && u.pu != null); return s ? {...r, importo: Math.round(s.pu * r.qta * 100) / 100} : r; });
    if (!(await put('documenti', d.id, {...strip(d), righe, fatturaRif: d.fatturaRif || feRif(f)}, true))) return false;
  }
  const keep = solo ? used.filter(u => !inDdt.has(u.a)) : used;
  if (keep.length) {
    const righe = keep.map(u => ({id: uid(), articoloId: u.a, qta: u.qta, importo: u.imp, lotto: solo ? '' : String(u.lotto || '').trim(), scadenza: solo ? '' : u.scadenza || ''}));
    const note = [`Importata dalla fattura elettronica ${f.file}.`, f.ddt.length ? `DDT: ${f.ddt.map(x => `n. ${x.numero}${x.data ? ' del ' + fmtD(x.data) : ''}`).join(', ')}.` : ''].filter(Boolean).join(' ');
    if (!(await put('documenti', uid(), {tipo: 'fattura', numero: f.numero, data: f.data, fornitoreId: fid, fatturaRif: '', soloPrezzi: solo, note, allegati: [], righe, creato: Date.now()}))) return false;
  }
  // il fornitore ricorda gli abbinamenti e la partita IVA per la prossima volta
  const F = S.data.fornitori.get(fid);
  if (F) {
    const ab = {...(F.abbinamenti || {})};
    f.righe.forEach((r, i) => { const x = lines[i]; ab[feKey(r)] = x.skip ? {skip: true} : {a: x.a, f: x.f}; });
    await put('fornitori', fid, {...strip(F), piva: F.piva || fePiva(f.forn.piva) || '', abbinamenti: ab}, true);
  }
  for (const id of e.nuovi || []) { const a = S.data.articoli.get(id); if (a && !a.fornitoreId) await put('articoli', id, {...strip(a), fornitoreId: fid}, true); }
  e.done = true;
  if (e.posta) await fePostaClose();
  return true;
}

/* --- fogli: elenco delle fatture lette e controllo di una fattura --- */
function sheetFatture() {
  if (!guard()) return;
  FE.list = []; FE.ignored = 0;
  const o = {title: 'Importa fatture', busy: false, live: true, fe: true,
    body: () => {
      const rows = FE.list.map((e, i) => {
        const s = feStatus(e), f = e.f;
        const tone = {ready: 'good', done: 'good', check: 'amb', err: 'red'}[s.k] || '';
        const title = f ? (f.numero ? `Fattura n. ${f.numero}${f.data ? ' del ' + fmtD(f.data) : ''}` : e.file) : e.file;
        const sub = f ? `${f.pdf ? 'PDF · ' : ''}${f.forn.nome || 'Fornitore'} · ${f.righe.length === 1 ? '1 riga' : f.righe.length + ' righe'}${f.totale != null ? ' · ' + EUR(f.totale) : ''}` : 'File non importato';
        const open = f && !['done', 'dup', 'skip'].includes(s.k);
        return `<${open ? 'button type="button"' : 'div'} class="row${open ? '' : ' static'}" ${open ? `data-act="fe-open" data-i="${i}"` : ''}>${av(s.k === 'done' || s.k === 'ready' ? IC.check : s.k === 'err' ? IC.alert : IC.receipt, tone)}<span class="m"><b>${esc(title)}</b><span>${esc(sub)}</span><span class="mc"><span class="chip ${tone}">${esc(s.txt)}</span></span></span></${open ? 'button' : 'div'}>`;
      }).join('');
      return `${postaBar()}<p class="muted">Carica le fatture dei fornitori. Gli XML delle fatture elettroniche, anche firmati (.p7m) o tanti insieme in uno .zip, si leggono in modo esatto. Dei PDF l'app legge il testo e ti propone righe e importi da controllare; le foto e le scansioni invece non si possono leggere.</p>
        ${countSample() ? '<p class="note warn">' + IC.info + '<span>Stai usando i dati di esempio: anche le fatture che importi ora vengono cancellate quando registri il bar.</span></p>' : ''}
        <p><label class="btn ${FE.list.length ? '' : 'pri'}">${IC.plus}${FE.list.length ? 'Aggiungi altri file' : 'Scegli i file'}<input type="file" accept=".xml,.p7m,.zip,.pdf,application/xml,text/xml,application/zip,application/pkcs7-mime,application/pdf" multiple data-file="fe"></label></p>
        ${o.busy === 'posta' ? '<p class="hint">Scarico le fatture arrivate dalla posta…</p>' : o.busy ? '<p class="hint">Leggo i file…</p>' : ''}
        ${FE.list.length ? `<div class="list">${rows}</div>` : ''}
        ${FE.ignored ? `<p class="hint" style="margin-top:10px">${FE.ignored === 1 ? 'Un file' : FE.ignored + ' file'} senza fattura (ricevute e metadati del Sistema di Interscambio) ${FE.ignored === 1 ? 'è stato saltato' : 'sono stati saltati'}.</p>` : ''}
        ${FE.list.some(e => e.f && feStatus(e).k === 'check') ? '<p class="hint" style="margin-top:10px">Tocca le fatture da controllare: la prima volta abbini le righe ai tuoi articoli, poi l’app se lo ricorda per quel fornitore.</p>' : ''}`;
    },
    foot: () => { const n = FE.list.filter(e => e.f && feStatus(e).k === 'ready').length; return n ? `<button type="button" class="btn pri" data-act="fe-all">Importa ${n === 1 ? 'la fattura pronta' : `le ${n} fatture pronte`}</button>` : ''; }};
  openSheet(o);
  if (postaCoda().length) fePostaLoad(o);
}
async function feAddFiles(o, files) {
  if (o.busy) { toast('Aspetta un attimo: sto ancora leggendo le fatture.'); return; }
  o.busy = true; paintSheet(o);
  try { const {out, ignored} = await feRead(files); FE.list.push(...out); FE.ignored += ignored; }
  catch { toast('Non sono riuscito a leggere i file.', true); }
  o.busy = false;
  if (stack.includes(o)) paintSheet(o);
}
async function feAll() {
  if (!guard()) return;
  const ready = FE.list.filter(e => e.f && feStatus(e).k === 'ready');
  let ok = 0;
  for (const e of ready) {
    const fid = feFornOf(e.f), m = feMatch(e.f, fid);
    const lines = m.map((x, i) => x.skip ? {skip: true} : {a: x.a, f: x.f, q: e.f.righe[i].qta, lotto: e.f.righe[i].lotto, scadenza: e.f.righe[i].scadenza});
    if (await feSave(e, fid, feDdtDocs(e.f, fid).length > 0, lines)) ok++;
  }
  refreshSheets();
  toast(ok === ready.length ? (ok === 1 ? 'Fattura importata' : `${ok} fatture importate`) : `Importate ${ok} fatture su ${ready.length}.`, ok < ready.length);
}
function sheetFattura(e) {
  const f = e.f, fid0 = feFornOf(f), pdf = !!f.pdf;
  const st = {forn: fid0 || '__new', solo: false, numero: f.numero || '', data: f.data || '', fnome: f.forn.nome || '', fpiva: fePiva(f.forn.piva) || '', righe: []};
  const fill = () => {
    const fid = st.forn === '__new' ? null : st.forn, m = feMatch(f, fid);
    st.solo = feDdtDocs(f, fid).length > 0;
    st.righe = f.righe.map((r, i) => ({a: m[i].skip ? '__skip' : m[i].a || '', fat: fmtIn(m[i].f || 1), q: r.qta > 0 ? fmtIn(r.qta) : '', imp: r.totale != null ? fmtIn(r.totale) : '', lotto: r.lotto || '', scad: r.scadenza || '', guess: !!m[i].guess}));
  };
  fill();
  const unitTxt = r => r.um ? esc(r.um) : 'unità';
  const totOf = i => pdf ? (String(st.righe[i].imp).trim() ? pnum(st.righe[i].imp) : null) : f.righe[i].totale;
  const hint = i => {
    const x = st.righe[i], a = S.data.articoli.get(x.a), tot = totOf(i);
    if (!a) return '';
    const q = r6(pnum(x.q) * pnum(x.fat));
    if (!(q > 0)) return 'Indica quantità e conversione.';
    return `In magazzino: ${fmtQ(q, a.unita)}${tot != null && tot >= 0 ? ` · ${EUR(tot / q)} ${a.unita === 'pz' ? 'al pezzo' : 'al ' + a.unita}` : ''}`;
  };
  const sumTxt = () => {
    const s = Math.round(f.righe.reduce((t, r, i) => t + (st.righe[i].a === '__skip' && !pdf ? 0 : totOf(i) || 0), 0) * 100) / 100;
    const ref = f.imponibile;
    return ref == null ? `Somma delle righe: ${EUR(s)}. Imponibile non trovato nel PDF: confrontala con la fattura.` : Math.abs(s - ref) < .02 ? `Somma delle righe ${EUR(s)}: torna con l'imponibile della fattura.` : `Somma delle righe ${EUR(s)}, imponibile in fattura ${EUR(ref)}: controlla gli importi.`;
  };
  const lineHTML = (r, i) => {
    const x = st.righe[i], a = S.data.articoli.get(x.a);
    return `<div class="card fe-line"><p class="fe-d"><b>${esc(r.descr || 'Riga ' + r.n)}</b></p>
      <p class="muted fe-q">${r.qta != null ? `${esc(fmtIn(r.qta))} ${unitTxt(r)}` : 'Quantità non indicata'}${r.prezzo != null ? ` × ${EUR(r.prezzo)}` : ''}${r.totale != null ? ` = <b>${EUR(r.totale)}</b>` : ''}${r.codice ? ` · cod. ${esc(r.codice)}` : ''}${pdf && !r.ok && x.a !== '__skip' ? ' <span class="chip amb">Quantità × prezzo non torna</span>' : ''}</p>
      <label class="fld"><span>Articolo${x.guess && x.a ? ' <span class="chip amb">Proposto: controlla</span>' : ''}</span><select data-k="righe.${i}.a"><option value="__skip" ${x.a === '__skip' ? 'selected' : ''}>Non è merce: non caricare</option><option value="" ${x.a === '' ? 'selected' : ''}>Scegli l'articolo…</option>${artOptions(x.a)}<option value="__new">+ Nuovo articolo…</option></select></label>
      ${a ? `<div class="${pdf ? 'g3' : 'g2'}"><label class="fld"><span>Quantità in fattura</span><input type="text" inputmode="decimal" data-k="righe.${i}.q" value="${esc(x.q)}" placeholder="0" autocomplete="off"></label>
      <label class="fld"><span>1 ${unitTxt(r)} = quanti ${a.unita === 'pz' ? 'pezzi' : a.unita}</span><input type="text" inputmode="decimal" data-k="righe.${i}.fat" value="${esc(x.fat)}" autocomplete="off"></label>
      ${pdf ? `<label class="fld"><span>Importo € senza IVA</span><input type="text" inputmode="decimal" data-k="righe.${i}.imp" value="${esc(x.imp)}" placeholder="0,00" autocomplete="off"></label>` : ''}</div>
      <p class="hint fe-h" id="fe-h-${i}">${esc(hint(i))}</p>
      ${st.solo ? '' : `<div class="g2"><label class="fld"><span>Lotto del fornitore</span><input type="text" data-k="righe.${i}.lotto" value="${esc(x.lotto)}" placeholder="Come sulla confezione" autocomplete="off"></label>
      <label class="fld"><span>Scadenza</span><input type="date" data-k="righe.${i}.scad" value="${esc(x.scad)}"></label></div>`}` : ''}</div>`;
  };
  const o = {form: true, st, title: () => `Fattura${st.numero ? ' n. ' + st.numero : ''}${pdf ? ' (PDF)' : ''}`,
    body: () => {
      const fid = st.forn === '__new' ? null : st.forn, ddts = feDdtDocs(f, fid);
      return `${pdf ? `<p class="note">${IC.info}<span>Letta dal PDF: controlla numero, data e importi prima di importare. Dall'XML la lettura è esatta.</span></p>
          <div class="g2"><label class="fld"><span>Numero della fattura</span><input type="text" data-k="numero" value="${esc(st.numero)}" autocomplete="off"></label>
          <label class="fld"><span>Data</span><input type="date" data-k="data" value="${esc(st.data)}"></label></div>`
        : `<p class="muted">${esc(f.forn.nome || 'Fornitore')}${f.forn.piva ? ' · P.IVA ' + esc(fePiva(f.forn.piva)) : ''} · ${fmtD(f.data)}${f.totale != null ? ' · totale ' + EUR(f.totale) : ''}</p>`}
        <label class="fld"><span>Fornitore</span><select data-k="forn"><option value="__new" ${st.forn === '__new' ? 'selected' : ''}>+ Crea «${esc(st.fnome || 'Fornitore')}»</option>${fornOpts(st.forn === '__new' ? '' : st.forn)}</select>${!fid0 ? '<small class="hint">Non l’ho trovato fra i tuoi fornitori: se c’è con un altro nome, sceglilo qui.</small>' : ''}</label>
        ${pdf && st.forn === '__new' ? `<div class="g2"><label class="fld"><span>Nome del nuovo fornitore</span><input type="text" data-k="fnome" value="${esc(st.fnome)}" autocomplete="off"></label>
          <label class="fld"><span>Partita IVA</span><input type="text" data-k="fpiva" value="${esc(st.fpiva)}" inputmode="numeric" autocomplete="off"></label></div>` : ''}
        ${f.ddt.length ? `<p class="note">${IC.info}<span>Fattura dei DDT ${esc(f.ddt.map(x => `n. ${x.numero}${x.data ? ' del ' + fmtD(x.data) : ''}`).join(', '))}${ddts.length ? `: ${ddts.length === f.ddt.length ? 'li hai già registrati' : `ne hai registrati ${ddts.length}`}.` : ', non ancora registrati nell’app.'}</span></p>
          ${ddts.length ? `<label class="chk"><input type="checkbox" data-k="solo" ${st.solo ? 'checked' : ''}>La merce è già in magazzino con i DDT: completa i loro prezzi senza caricarla di nuovo</label>` : ''}` : ''}
        <h3>Righe della fattura</h3><p class="hint" style="margin:-4px 0 10px">Abbina ogni riga a un tuo articolo e controlla la conversione: per esempio «1 CT = 24 pezzi». L'app se lo ricorda per le prossime fatture di questo fornitore.</p>
        ${f.righe.map(lineHTML).join('')}
        ${pdf ? `<p class="hint" id="fe-sum">${esc(sumTxt())}</p>
          <details class="fe-raw"><summary>Testo letto dal PDF</summary><pre>${esc((f.testo || []).join('\n'))}</pre></details>` : ''}
        <p class="err" id="ferr" role="alert"></p>`;
    },
    entry: e,
    foot: () => e.posta ? `<button type="button" class="btn" data-act="fe-scarta">Non importare</button><button type="button" class="btn pri" data-act="save">Importa fattura</button>` : foot('Importa fattura'),
    onField: (k, oo, kind, el) => {
      if (k === 'forn') { fill(); paintSheet(oo); return; }
      if (k === 'solo') { paintSheet(oo); return; }
      if (k === 'numero') { $('.sh-head h2', oo.el).textContent = oo.title(); return; }
      const m = k.match(/^righe\.(\d+)\.(a|q|fat|imp)$/); if (!m) return;
      const i = +m[1], x = st.righe[i];
      if (m[2] === 'a') {
        x.guess = false;
        if (x.a === '__new') {
          x.a = ''; el.value = '';
          const r = f.righe[i], um = feUm(r.um), pk = fePack(r.descr), sz = pk?.size != null ? (FE_SIZE[pk.u] || [])[1] : null;
          const nome = String(r.descr || '').replace(/\b(\d+\s*[X×*]\s*)?\d+(?:[.,]\d+)?\s*(KG|GRAMMI|GR|G|LITRI|LT|L|CL|ML)\b.*$/i, '').replace(/\b(CT|CF|CONF|CRT|PZ)\b\.?\s*\d*/gi, '').replace(/\s+/g, ' ').trim().toLowerCase();
          formArticolo(null, nid => { x.a = nid; const a = S.data.articoli.get(nid); x.fat = fmtIn(feFactor(r, a)); (e.nuovi ||= []).push(nid); paintSheet(oo); },
            {nome: nome ? nome[0].toUpperCase() + nome.slice(1) : '', unita: um === 'kg' || um === 'g' ? 'kg' : um === 'l' || um === 'ml' || um === 'cl' ? 'l' : sz || 'pz', fornitoreId: st.forn === '__new' ? '' : st.forn});
          return;
        }
        const a = S.data.articoli.get(x.a); if (a) x.fat = fmtIn(feFactor(f.righe[i], a));
        paintSheet(oo); return;
      }
      const h = document.getElementById('fe-h-' + i); if (h) h.textContent = hint(i);
      const sm = document.getElementById('fe-sum'); if (sm) sm.textContent = sumTxt();
    },
    onSave: async oo => {
      if (pdf) {
        if (!st.numero.trim()) return ferr(oo, 'Scrivi il numero della fattura.');
        if (!validIso(st.data)) return ferr(oo, 'Indica la data della fattura.');
        if (st.forn === '__new' && !st.fnome.trim()) return ferr(oo, 'Scrivi il nome del fornitore.');
      }
      const lines = [];
      for (const [i, x] of st.righe.entries()) {
        const r = f.righe[i], name = (r.descr || 'Riga ' + r.n).slice(0, 40);
        if (x.a === '__skip') { lines.push({skip: true}); continue; }
        if (!S.data.articoli.has(x.a)) return ferr(oo, `«${name}»: scegli l'articolo o «Non è merce».`);
        const q = pnum(x.q), fat = pnum(x.fat);
        if (!(q > 0)) return ferr(oo, `«${name}»: quantità non valida.`);
        if (!(fat > 0)) return ferr(oo, `«${name}»: conversione non valida.`);
        let imp;
        if (pdf) { if (!String(x.imp).trim()) imp = null; else { imp = pnum(x.imp); if (!(imp >= 0)) return ferr(oo, `«${name}»: importo non valido.`); } }
        if (!st.solo && x.scad && !validIso(x.scad)) return ferr(oo, `«${name}»: scadenza non valida.`);
        lines.push({a: x.a, f: fat, q, lotto: x.lotto, scadenza: x.scad, ...(pdf ? {imp} : {})});
      }
      if (!lines.some(x => !x.skip)) return ferr(oo, 'Nessuna riga da caricare: abbina almeno una riga a un articolo.');
      if (pdf) {
        f.numero = st.numero.trim(); f.data = st.data;
        if (st.forn === '__new') { f.forn.nome = st.fnome.trim(); f.forn.piva = st.fpiva.trim(); }
        if (feDup(f, st.forn === '__new' ? null : st.forn)) return ferr(oo, 'Questa fattura risulta già importata.');
      }
      oo.dirty = false;
      if (await feSave(e, st.forn === '__new' ? null : st.forn, st.solo, lines)) {
        closeSheet(); refreshSheets();
        toast(st.solo ? 'Fattura collegata ai DDT: prezzi completati' : 'Fattura importata: merce caricata in magazzino');
      }
    }};
  openSheet(o);
}

/* ---------- fatture dalla posta: una casella Gmail collegata con uno script di Google ----------
   Lo script (apps-script/fatture-dalla-posta.gs) elenca gli allegati XML, P7M, ZIP e PDF arrivati nella casella
   e li passa all'app. Le mail nuove finiscono in una coda; «Importa fatture» le scarica e le legge come i file scelti a mano. */
const POSTA_GS = "/*\n * Barista Flow \u00b7 script di Google\n *\n * - passa a Barista Flow le fatture che arrivano come allegato (XML, P7M, ZIP o PDF)\n *   nella casella Gmail dell'account con cui crei questo script;\n * - manda sul telefono le notifiche di Barista Flow (scadenze, scorte, fatture arrivate),\n *   anche quando l'app \u00e8 chiusa.\n * Come si installa: in Barista Flow, Impostazioni \u2192 Fatture dalla posta.\n */\n\n// La sceglie l'app: lo script copiato da Barista Flow la contiene gi\u00e0.\nvar CHIAVE = '__CHIAVE__';\n\n// Quali mail guardare, con la ricerca di Gmail. Con una casella usata solo per le fatture va bene cos\u00ec;\n// altrimenti limita al mittente, per esempio: 'from:fatture@servizio.it has:attachment'\nvar RICERCA = 'has:attachment';\n\nvar ALLEGATI = /\\.(xml|p7m|zip|pdf)$/i;\nvar GIORNI = 60;   // non si guarda pi\u00f9 indietro di cos\u00ec\nvar VERSIONE = 2;\n\n// La prima volta premi \u00abEsegui\u00bb con questa funzione: Google chiede i permessi (Gmail, notifiche, controllo\n// ogni 15 minuti) e nel registro compaiono gli allegati che lo script passerebbe all'app.\nfunction prova() {\n  installa();\n  var r = elenco(0);\n  Logger.log('Casella ' + r.casella + ': ' + r.file.length + ' allegati negli ultimi ' + GIORNI + ' giorni');\n  r.file.forEach(function (f) { Logger.log(new Date(f.data).toLocaleString() + '  ' + f.nome + '  da ' + f.da); });\n  Logger.log('Dispositivi iscritti alle notifiche: ' + (leggi('iscrizioni') || []).length);\n}\n\n/* ---------- richieste dell'app ---------- */\n// GET ?k=chiave&dal=\u2026 elenca gli allegati; ?op=file&id=\u2026 ne scarica uno; ?op=vapid d\u00e0 la chiave pubblica delle notifiche.\n// POST (testo JSON con k e op): iscrivi, disiscrivi, stato (riepilogo di scadenze e scorte), prova-notifica.\nfunction doGet(e) { return rispondi((e && e.parameter) || {}); }\nfunction doPost(e) {\n  var p = {};\n  try { p = JSON.parse((e && e.postData && e.postData.contents) || '{}') || {}; } catch (e sola, dall'ora scelta in poi\n  if (n.inviata === oggi || hm < (n.ora || '08:00')) return;\n  aggiorna(function (m) { m.inviata = oggi; });\n  var msg = avvisi(leggi('stato'), oggi, temi);\n  if (msg) inviaATutti(msg);\n}\nfunction aggiorna(fn) { conLock(function () { var m = leggi('notifiche') || {}; fn(m); scrivi('notifiche', m); }); }\n\n// il testo della notifica: lotti scaduti, che scadono oggi o a breve, articoli da riordinare\nfunction avvisi(st, oggi, temi) {\n  if (!st) return null;\n  var righe = [], lotti = st.lotti || [], fine = piuGiorni(oggi, st.giorni >= 0 ? st.giorni : 3);\n  if (temi.scadenze !== false) {\n    var scaduti = lotti.filter(function (l) { return l.s < oggi; }), oggiL = lotti.filter(function (l) { return l.s === oggi; });\n    var presto = lotti.filter(function (l) { return l.s > oggi && l.s <= fine; });\n    if (scaduti.length) righe.push((scaduti.length === 1 ? '1 lotto scaduto' : scaduti.length + ' lotti scaduti') + ' da smaltire: ' + nomi(scaduti));\n    if (oggiL.length) righe.push('Scade oggi: ' + nomi(oggiL));\n    if (presto.length) righe.push('In scadenza: ' + nomi(presto, true));\n  }\n  if (temi.scorte !== false && (st.scorte || []).length) righe.push('Da riordinare: ' + nomi(st.scorte));\n  if (!righe.length) return null;\n  return {title: 'Barista Flow', body: righe.join('\\n'), tag: 'avvisi-' + oggi, url: './#oggi'};\n}\nfunction nomi(xs, conData) {\n  var u = [];\n  xs.forEach(function (x) { var t = String(x.n || '') + (conData && x.s ? ' (' + x.s.slice(8, 10) + '/' + x.s.slice(5, 7) + ')' : ''); if (t && u.indexOf(t) < 0) u.push(t); });\n  return u.slice(0, 3).join(', ') + (u.length > 3 ? ' e altri ' + (u.length - 3) : '');\n}\nfunction piuGiorni(iso, g) {\n  var d = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10) + g));\n  return d.toISOString().slice(0, 10);\n}\n\n/* ---------- invio delle notifiche (Web Push: RFC 8030, 8291, 8292) ---------- */\nfunction inviaATutti(msg) {\n  var subs = legg const POSTA = {busy: false, last: 0, timer: 0};
const postaCfg = () => S.data.impostazioni.get('posta') || null;
const postaOk = () => S.mode === 'local';   // su claude.ai la pagina non può chiamare siti esterni
const postaOn = () => { const p = postaCfg(); return postaOk() && !!(p && p.url && p.chiave); };
const postaCoda = () => (postaOn() && Array.isArray(postaCfg().coda) ? postaCfg().coda : []);
const postaMail = coda => new Set(coda.map(x => String(x.id).split(':')[0])).size;   // una mail = una fattura, anche con XML e PDF allegati
const postaScript = k => POSTA_GS.replace('__CHIAVE__', k);
const postaLink = p => p.url + (p.url.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(p.chiave);   // per collegare un altro dispositivo senza rifare lo script
const POSTA_TRENTA = 30 * 864e5;
function postaChiave() {
  const b = crypto.getRandomValues(new Uint8Array(18));
  return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fmtWhen(ts) {
  const d = new Date(+ts); if (!+ts || isNaN(d)) return '';
  const iso = isoOf(d), hm = d.toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'});
  return `${iso === today() ? 'oggi' : iso === isoOf(new Date(Date.now() - 864e5)) ? 'ieri' : 'il ' + fmtD(iso)} alle ${hm}`;
}

/* --- chiamate allo script --- */
const postaFetch = (p, params) => postaReq(p, params, null);
// GET con i parametri nell'indirizzo, o POST con un testo JSON: in entrambi i casi richieste «semplici», che lo script accetta da un altro sito
async function postaReq(p, params, body) {
  const u = new URL(p.url);
  if (!body) { u.searchParams.set('k', p.chiave); for (const [k, v] of Object.entries(params || {})) u.searchParams.set(k, String(v)); }
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 45000);
  let txt;
  try {
    const r = await fetch(u.href, body ? {method: 'POST', body: JSON.stringify({...body, k: p.chiave}), signal: ctl.signal, cache: 'no-store'} : {signal: ctl.signal, cache: 'no-store'});
    if (!r.ok) throw Object.assign(new Error('http'), {code: 'risposta'});
    txt = await r.text();
  } finally { clearTimeout(t); }
  let j; try { j = JSON.parse(txt); } catch { throw Object.assign(new Error('json'), {code: 'risposta'}); }
  if (!j || j.ok !== true) throw Object.assign(new Error('script'), {code: String(j?.errore || 'risposta')});
  return j;
}
function postaErr(e) {
  if (e?.code === 'chiave') return 'La chiave non corrisponde: copia di nuovo lo script da Barista Flow, incollalo e pubblica una nuova versione.';
  if (e?.name === 'AbortError') return 'Lo script non ha risposto in tempo: riprova tra poco.';
  if (!navigator.onLine) return 'Sei senza connessione: la posta si controlla quando torna.';
  if (!e?.code || e.code === 'risposta') return 'Lo script non risponde: controlla l’URL (finisce con /exec) e che l’accesso sia «Chiunque».';
  return 'Lo script ha dato un errore: ' + String(e.code).slice(0, 160);
}

/* --- controllo della casella: all'avvio, quando si torna sull'app e ogni 15 minuti mentre è aperta --- */
async function postaSync(manual) {
  const p = postaCfg();
  if (!postaOn() || POSTA.busy || !allLoaded() || S.ro) return null;
  if (!manual && !navigator.onLine) return null;
  POSTA.busy = true; POSTA.last = Date.now(); refreshSheets();
  let n = null;
  try {
    const j = await postaFetch(p, {dal: p.dal || Date.now() - POSTA_TRENTA});
    const cur = postaCfg(); if (!cur || cur.url !== p.url) return null;   // scollegata o cambiata nel frattempo
    const files = (Array.isArray(j.file) ? j.file : []).filter(x => x && typeof x.id === 'string' && x.id.length < 200);
    const visti = {...(cur.visti || {})}, coda = [...(cur.coda || [])];
    const nuovi = files.filter(x => !visti[x.id]);
    for (const x of nuovi) {
      visti[x.id] = +x.data || Date.now();
      coda.push({id: x.id, nome: String(x.nome || 'allegato').slice(0, 120), data: +x.data || Date.now(), da: String(x.da || '').slice(0, 120), oggetto: String(x.oggetto || '').slice(0, 160)});
    }
    const old = Date.now() - 120 * 864e5;
    for (const k of Object.keys(visti)) if (visti[k] < old) delete visti[k];
    const dal = Math.max(+cur.dal || 0, ...files.map(x => +x.data || 0)) || Date.now() - POSTA_TRENTA;
    await put('impostazioni', 'posta', {...strip(cur), visti, coda, dal, controllata: Date.now(), casella: String(j.casella || cur.casella || '').slice(0, 120), errore: ''}, true);
    n = nuovi.length;
    const m = postaMail(nuovi), o = stack.find(x => x.fe);
    if (m) toast(m === 1 ? 'È arrivata una fattura dalla posta' : `Sono arrivate ${m} fatture dalla posta`, false, o ? null : {label: 'Vedi', fn: () => sheetFatture()});
    else if (manual) toast('Nessuna fattura nuova nella posta');
    if (o && n) fePostaLoad(o);
  } catch (e) {
    const msg = postaErr(e), cur = postaCfg();
    if (cur) await put('impostazioni', 'posta', {...strip(cur), errore: msg, controllata: Date.now()}, true);
    if (manual) toast(msg, true);
  } finally { POSTA.busy = false; refreshSheets(); }
  return n;
}
function postaStart() {
  clearInterval(POSTA.timer); POSTA.timer = 0;
  if (!postaOn()) return;
  POSTA.timer = setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - POSTA.last > 14 * 60e3) postaSync(); }, 60e3);
  postaSync();
}
function postaBoot() {   // appena l'archivio è caricato
  let n = 0;
  const t = setInterval(() => { if (allLoaded() || ++n > 80) { clearInterval(t); postaStart(); } }, 250);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && postaOn() && Date.now() - POSTA.last > 10 * 60e3) postaSync(); });
async function postaRiparti() {   // finita la prova, le fatture importate con gli esempi sono state cancellate: si riprendono dalla posta
  const p = postaCfg(); if (!p || !p.url) return;
  await put('impostazioni', 'posta', {...strip(p), visti: {}, coda: [], dal: Date.now() - POSTA_TRENTA}, true);

}
async function postaOff() {
  if (!(await ask('Scollego la posta? Le fatture già importate restano; quelle arrivate e non ancora importate escono dall’elenco.', 'Scollega', true))) return;
  clearInterval(POSTA.timer); POSTA.timer = 0;
  if (notifCfg().attive) await notifSpegni();
  if (await del('impostazioni', 'posta')) toast('Posta scollegata. Lo script resta nel tuo account Google: puoi eliminarlo da script.google.com.');
}

/* --- nell'elenco di «Importa fatture» --- */
async function fePostaLoad(o) {
  const p = postaCfg(); if (!p || o.busy) return;
  const todo = postaCoda().filter(x => !FE.list.some(e => e.posta === x.id));
  if (!todo.length) return;
  o.busy = 'posta'; paintSheet(o);
  const vuoti = [];
  for (const x of todo) {
    let file;
    try { const j = await postaFetch(p, {op: 'file', id: x.id}); file = new File([Uint8Array.from(atob(String(j.b64 || '')), c => c.charCodeAt(0))], String(j.nome || x.nome)); }
    catch (err) { FE.list.push({key: 'posta:' + x.id, file: x.nome, posta: x.id, retry: true, err: 'non scaricato dalla posta. ' + postaErr(err)}); continue; }
    const {out, ignored} = await feRead([file]);
    for (const e of out) e.posta = x.id;
    FE.list.push(...out); FE.ignored += ignored;
    if (!out.length) vuoti.push(x.id);   // metadati del Sistema di Interscambio o doppione (lo stesso documento in XML e in PDF)
  }
  o.busy = false;
  await fePostaClose(vuoti);
  if (stack.includes(o)) paintSheet(o);
}
/* un allegato esce dalla coda quando tutte le sue fatture sono importate, già presenti, scartate o non leggibili */
async function fePostaClose(extra = []) {
  const p = postaCfg(); if (!p || !(p.coda || []).length) return;
  const by = new Map();
  for (const e of FE.list) if (e.posta) { if (!by.has(e.posta)) by.set(e.posta, []); by.get(e.posta).push(e); }
  const fine = e => !e.retry && (e.done || e.scartata || !e.f || ['dup', 'skip', 'err'].includes(feStatus(e).k));
  const coda = p.coda.filter(x => !extra.includes(x.id) && !(by.has(x.id) && by.get(x.id).every(fine)));
  if (coda.length !== p.coda.length) await put('impostazioni', 'posta', {...strip(p), coda}, true);
}

      <p class="hint" style="margin-top:-6px">Se la posta è già collegata su un altro dispositivo, incolla qui il link copiato da lì (Impostazioni → Fatture dalla posta): lo script non va rifatto.</p>
      <details class="fe-raw posta-gs"><summary>Vedi lo script</summary><pre>${esc(postaScript(key))}</pre></details>
      <p class="hint">Lo script copiato da qui contiene la chiave di questo collegamento. Chi ha l’URL e la chiave può leggere gli allegati delle fatture: non condividerli.</p>
      <p class="err" id="ferr" role="alert"></p>`,
    foot: () => foot(p.url ? 'Prova e salva' : 'Prova e collega'),
    onSave: async o => {
      let url = st.url.trim(), k = key;
      if (!/^https:\/\/\S+$/i.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/\S*$/i.test(url)) return ferr(o, 'Incolla l’URL dell’app web: comincia con https://script.google.com/ e finisce con /exec.');
      try {   // link copiato da un altro dispositivo: contiene anche la chiave
        const u = new URL(url), kk = u.searchParams.get('k');
        if (kk != null) { if (kk.length < 16) return ferr(o, 'Il link non è completo: copialo di nuovo dall’altro dispositivo.'); k = kk; u.searchParams.delete('k'); url = u.href; }
      } catch { return ferr(o, 'Questo URL non è valido.'); }
      let j;
      try { j = await postaFetch({url, chiave: k}, {dal: Date.now() - POSTA_TRENTA}); }
      catch (e) { return ferr(o, postaErr(e)); }
      // stessa casella con un nuovo deployment: le mail già viste restano viste
      const cur = postaCfg() || p, casella = String(j.casella || '').slice(0, 120), same = !!cur.casella && cur.casella === casella;
      const rec = {...strip(cur), url, chiave: k, casella, dal: same && cur.dal ? cur.dal : Date.now() - POSTA_TRENTA, visti: same ? cur.visti || {} : {}, coda: same ? cur.coda || [] : [], controllata: 0, errore: ''};
      if (!(await put('impostazioni', 'posta', rec))) return;
      o.dirty = false; closeSheet();
      toast(rec.casella ? `Posta collegata: ${rec.casella}` : 'Posta collegata');
      postaStart();
    }});
}
async function postaCopia(b) {
  const o = sheetOf(b), k = postaCfg()?.chiave; if (!k) return;
  try { await navigator.clipboard.writeText(postaScript(k)); toast('Script copiato: incollalo nel progetto di script.google.com'); }

    if (d) { d.open = true; const r = document.createRange(); r.selectNodeContents($('pre', d)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

/* ---------- notifiche sul telefono ----------
   L'app manda allo script di Google un riepilogo (lotti con la scadenza, articoli da riordinare) quando i dati cambiano;
   lo script, anche con l'app chiusa, ogni mattina all'ora scelta manda la notifica (Web Push) ai dispositivi iscritti. */
const NOTIF = {busy: false, syncing: false, t: 0};
const NOTIF_ORE = ['05:00', '05:30', '06:00', '06:30', '07:00', '07:30', '08:00', '08:30', '09:00', '09:30', '10:00', '11:00', '12:00', '15:00', '18:00', '21:00'];
const NOTIF_TEMI = [['scadenze', 'Lotti scaduti e in scadenza'], ['scorte', 'Articoli da riordinare'], ['fatture', 'Fatture arrivate dalla posta']];
const notifCfg = () => postaCfg()?.notifiche || {};
const notifTemi = () => ({scadenze: true, scorte: true, fatture: true, ...(notifCfg().temi || {})});
const notifFuso = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Rome'; } catch { return 'Europe/Rome'; } };
const notifIos = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const notifDispositivo = () => notifIos() ? 'iPhone o iPad' : /Android/i.test(navigator.userAgent) ? 'Android' : 'Computer';
const nErr = msg => Object.assign(new Error(msg), {msg});
function notifSupporto() {
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (notifIos() && !standalone) return {ok: false, msg: 'Su iPhone le notifiche arrivano solo dall’app sulla schermata Home: in Safari tocca Condividi, poi «Aggiungi alla schermata Home», e apri Barista Flow da lì.'};
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return {ok: false, msg: 'Questo browser non riceve notifiche: usa Chrome su Android o l’app sulla schermata Home dell’iPhone.'};
  if (Notification.permission === 'denied') return {ok: false, msg: 'Le notifiche sono bloccate per Barista Flow: riattivale nelle impostazioni del telefono, alla voce Notifiche.'};
  return {ok: true};
}
async function notifSalva(patch) {
  const p = postaCfg(); if (!p) return false;
  return put('impostazioni', 'posta', {...strip(p), notifiche: {...(p.notifiche || {}), ...patch}}, true);
}
function notifHash(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); }
async function swPronto() {
  if (!('serviceWorker' in navigator)) throw nErr('Questo browser non riceve notifiche.');
  return Promise.race([navigator.serviceWorker.ready, sleep(8000).then(() => { throw nErr('Il servizio dell’app non è ancora attivo: chiudi e riapri Barista Flow, poi riprova.'); })]);
}
const b64uBytes = s => Uint8Array.from(atob(String(s).replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(String(s).length / 4) * 4, '=')), c => c.charCodeAt(0));

/* --- riepilogo per lo script: lotti con scadenza nei prossimi 30 giorni (o già scaduti) e articoli sotto scorta --- */
function notifRiepilogo() {
  const Dd = drv(), lim = addDays(today(), 30);
  const lotti = [...Dd.acq.values(), ...Dd.prod.values()].filter(l => l.res > EPS && l.scad && l.scad <= lim)
    .map(l => ({n: lotName(l), s: l.scad})).sort((a, b) => a.s.localeCompare(b.s) || a.n.localeCompare(b.n)).slice(0, 400);
  const scorte = [...S.data.articoli.values()].filter(a => !a.archiviato && +a.scortaMin > 0 && artStock(a.id).usable < +a.scortaMin)
    .map(a => ({n: a.nome})).sort((a, b) => a.n.localeCompare(b.n)).slice(0, 200);
  return {lotti, scorte, giorni: cfg().giorniAvviso};
}
async function notifSync(force) {
  const n = notifCfg(), p = postaCfg();
  if (!postaOn() || !n.attive || !allLoaded() || NOTIF.syncing || S.ro) return false;
  const stato = notifRiepilogo(), body = {op: 'stato', stato, ora: n.ora || '08:00', fuso: notifFuso(), temi: notifTemi(), origine: location.origin};
  const hash = notifHash(JSON.stringify([stato, body.ora, body.fuso, body.temi]));
  if (!force && hash === n.hash) return false;
  NOTIF.syncing = true;
  try { await postaReq(p, null, body); await notifSalva({hash, inviato: Date.now(), errore: ''}); return true; }
  catch (e) { await notifSalva({errore: postaErr(e)}); return false; }
  finally { NOTIF.syncing = false; }
}
function notifSoon() { clearTimeout(NOTIF.t); NOTIF.t = setTimeout(() => notifSync(), 4000); }   // dopo ogni modifica, a riposo

/* --- attivare, provare, disattivare --- */
async function notifAttiva() {
  if (!guard() || NOTIF.busy) return;
  const sup = notifSupporto();
  if (!postaOn() || !sup.ok) { toast(sup.msg || 'Collega prima lo script di Google.', true); return; }
  NOTIF.busy = true; renderMain();
  try {
    // il permesso va chiesto subito, dentro il tocco sul pulsante (iPhone)
    if ((await Notification.requestPermission()) !== 'granted') throw nErr('Senza il permesso il telefono non mostra le notifiche: quando te lo chiede, tocca «Consenti».');
    const p = postaCfg(), j = await postaFetch(p, {op: 'vapid'});
    if (!j.pub) throw nErr('Lo script di Google è di una versione precedente: copia di nuovo lo script da «Fatture dalla posta», incollalo e pubblica una nuova versione.');
    const reg = await swPronto(), key = b64uBytes(j.pub);
    let sub = await reg.pushManager.getSubscription();
    const old = sub?.options?.applicationServerKey;
    if (sub && (!old || new Uint8Array(old).join() !== key.join())) { await sub.unsubscribe().catch(() => false); sub = null; }
    sub = sub || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: key});
    const n = notifCfg(), ora = n.ora || '08:00';
    await postaReq(p, null, {op: 'iscrivi', sub: sub.toJSON(), ora, fuso: notifFuso(), temi: notifTemi(), da: notifDispositivo(), origine: location.origin});
    await notifSalva({attive: true, ora, endpoint: sub.endpoint, hash: '', errore: ''});
    await notifSync(true);
    toast(`Notifiche attive: ogni giorno dalle ${ora}. Prova a mandarne una.`);
  } catch (e) { toast(e.msg || postaErr(e), true); }
  finally { NOTIF.busy = false; bump(); }
}
async function notifProva() {
  if (NOTIF.busy) return;
  NOTIF.busy = true; renderMain();
  try {
    await notifSync();
    const j = await postaReq(postaCfg(), null, {op: 'prova-notifica'});
    if (j.inviate) toast(j.inviate === 1 ? 'Notifica di prova inviata: arriva tra pochi secondi.' : `Notifica di prova inviata a ${j.inviate} dispositivi.`);
    else toast(`Il servizio delle notifiche l’ha rifiutata (codice ${(j.esiti || []).join(', ')}): disattiva e riattiva le notifiche.`, true);
  } catch (e) { toast(e.code === 'nessun dispositivo iscritto' ? 'Nessun dispositivo iscritto: disattiva e riattiva le notifiche.' : postaErr(e), true); }
  finally { NOTIF.busy = false; bump(); }
}
async function notifSpegni() {   // senza domande: anche quando si scollega lo script
  const p = postaCfg(), n = notifCfg();
  try { const reg = await swPronto(), sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch { /* già spento */ }
  try { if (p?.url && n.endpoint) await postaReq(p, null, {op: 'disiscrivi', endpoint: n.endpoint}); } catch { /* lo script lo toglie al primo invio fallito */ }
  if (p) await notifSalva({attive: false, endpoint: '', hash: ''});
}
async function notifDisattiva() {
  if (!(await ask('Disattivo le notifiche su questo dispositivo?', 'Disattiva', true))) return;
  await notifSpegni(); toast('Notifiche disattivate su questo dispositivo.');
}
function notifImposta(k, v) {
  const n = notifCfg();
  if (k === 'ora' && NOTIF_ORE.includes(v)) notifSalva({ora: v}).then(() => notifSync(true));
  else if (NOTIF_TEMI.some(t => t[0] === k)) notifSalva({temi: {...notifTemi(), [k]: !!v}}).then(() => notifSync(true));
  if (n.attive) toast('Salvato: vale dalla prossima notifica.');
}
