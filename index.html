    if (!a) return '';
    const q = r6(pnum(x.q) * pnum(x.fat));
    if (!(q > 0)) return 'Indica quantità e conversione.';
    return `In magazzino: ${fmtQ(q, a.unita)}${r.totale != null ? ` · ${EUR(r.totale / q)} ${a.unita === 'pz' ? 'al pezzo' : 'al ' + a.unita}` : ''}`;
  };
  const lineHTML = (r, i) => {
    const x = st.righe[i], a = S.data.articoli.get(x.a);
    return `<div class="card fe-line"><p class="fe-d"><b>${esc(r.descr || 'Riga ' + r.n)}</b></p>
      <p class="muted fe-q">${r.qta != null ? `${esc(fmtIn(r.qta))} ${unitTxt(r)}` : 'Quantità non indicata'}${r.prezzo != null ? ` × ${EUR(r.prezzo)}` : ''}${r.totale != null ? ` = <b>${EUR(r.totale)}</b>` : ''}${r.codice ? ` · cod. ${esc(r.codice)}` : ''}</p>
      <label class="fld"><span>Articolo${x.guess && x.a ? ' <span class="chip amb">Proposto: controlla</span>' : ''}</span><select data-k="righe.${i}.a"><option value="__skip" ${x.a === '__skip' ? 'selected' : ''}>Non è merce: non caricare</option><option value="" ${x.a === '' ? 'selected' : ''}>Scegli l'articolo…</option>${artOptions(x.a)}<option value="__new">+ Nuovo articolo…</option></select></label>
      ${a ? `<div class="g2"><label class="fld"><span>Quantità in fattura</span><input type="text" inputmode="decimal" data-k="righe.${i}.q" value="${esc(x.q)}" placeholder="0" autocomplete="off"></label>
      <label class="fld"><span>1 ${unitTxt(r)} = quanti ${a.unita === 'pz' ? 'pezzi' : a.unita}</span><input type="text" inputmode="decimal" data-k="righe.${i}.fat" value="${esc(x.fat)}" autocomplete="off"></label></div>
      <p class="hint fe-h" id="fe-h-${i}">${esc(hint(i))}</p>
      ${st.solo ? '' : `<div class="g2"><label class="fld"><span>Lotto del fornitore</span><input type="text" data-k="righe.${i}.lotto" value="${esc(x.lotto)}" placeholder="Come sulla confezione" autocomplete="off"></label>
      <label class="fld"><span>Scadenza</span><input type="date" data-k="righe.${i}.scad" value="${esc(x.scad)}"></label></div>`}` : ''}</div>`;
  };
  const o = {form: true, st, title: `Fattura n. ${f.numero}`,
    body: () => {
      const fid = st.forn === '__new' ? null : st.forn, ddts = feDdtDocs(f, fid);
      return `<p class="muted">${esc(f.forn.nome || 'Fornitore')}${f.forn.piva ? ' · P.IVA ' + esc(fePiva(f.forn.piva)) : ''} · ${fmtD(f.data)}${f.totale != null ? ' · totale ' + EUR(f.totale) : ''}</p>
        <label class="fld"><span>Fornitore</span><select data-k="forn"><option value="__new" ${st.forn === '__new' ? 'selected' : ''}>+ Crea «${esc(f.forn.nome || 'Fornitore')}»</option>${fornOpts(st.forn === '__new' ? '' : st.forn)}</select>${!fid0 ? '<small class="hint">Non l’ho trovato fra i tuoi fornitori: se c’è con un altro nome, sceglilo qui.</small>' : ''}</label>
        ${f.ddt.length ? `<p class="note">${IC.info}<span>Fattura dei DDT ${esc(f.ddt.map(x => `n. ${x.numero}${x.data ? ' del ' + fmtD(x.data) : ''}`).join(', '))}${ddts.length ? `: ${ddts.length === f.ddt.length ? 'li hai già registrati' : `ne hai registrati ${ddts.length}`}.` : ', non ancora registrati nell’app.'}</span></p>
          ${ddts.length ? `<label class="chk"><input type="checkbox" data-k="solo" ${st.solo ? 'checked' : ''}>La merce è già in magazzino con i DDT: completa i loro prezzi senza caricarla di nuovo</label>` : ''}` : ''}
        <h3>Righe della fattura</h3><p class="hint" style="margin:-4px 0 10px">Abbina ogni riga a un tuo articolo e controlla la conversione: per esempio «1 CT = 24 pezzi». L'app se lo ricorda per le prossime fatture di questo fornitore.</p>
        ${f.righe.map(lineHTML).join('')}
        <p class="err" id="ferr" role="alert"></p>`;
    },
    foot: () => foot('Importa fattura'),
    onField: (k, oo, kind, el) => {
      if (k === 'forn') { fill(); paintSheet(oo); return; }
      if (k === 'solo') { paintSheet(oo); return; }
      const m = k.match(/^righe\.(\d+)\.(a|q|fat)$/); if (!m) return;
      const i = +m[1], x = st.righe[i];
      if (m[2] === 'a') {
        x.guess = false;
        if (x.a === '__new') {
          x.a = ''; el.value = '';
          const r = f.righe[i], um = feUm(r.um), p = fePack(r.descr), sz = p?.size != null ? (FE_SIZE[p.u] || [])[1] : null;
          const nome = String(r.descr || '').replace(/\b(\d+\s*[X×*]\s*)?\d+(?:[.,]\d+)?\s*(KG|GRAMMI|GR|G|LITRI|LT|L|CL|ML)\b.*$/i, '').replace(/\b(CT|CF|CONF|CRT|PZ)\b\.?\s*\d*/gi, '').replace(/\s+/g, ' ').trim().toLowerCase();
          formArticolo(null, nid => { x.a = nid; const a = S.data.articoli.get(nid); x.fat = fmtIn(feFactor(r, a)); (e.nuovi ||= []).push(nid); paintSheet(oo); },
            {nome: nome ? nome[0].toUpperCase() + nome.slice(1) : '', unita: um === 'kg' || um === 'g' ? 'kg' : um === 'l' || um === 'ml' || um === 'cl' ? 'l' : sz || 'pz', fornitoreId: st.forn === '__new' ? '' : st.forn});
          return;
        }
        const a = S.data.articoli.get(x.a); if (a) x.fat = fmtIn(feFactor(f.righe[i], a));
        paintSheet(oo); return;
      }
      const h = document.getElementById('fe-h-' + i); if (h) h.textContent = hint(i);
    },
    onSave: async oo => {
      const lines = [];
      for (const [i, x] of st.righe.entries()) {
        const r = f.righe[i], name = (r.descr || 'Riga ' + r.n).slice(0, 40);
        if (x.a === '__skip') { lines.push({skip: true}); continue; }
        if (!S.data.articoli.has(x.a)) return ferr(oo, `«${name}»: scegli l'articolo o «Non è merce».`);
        const q = pnum(x.q), fat = pnum(x.fat);
        if (!(q > 0)) return ferr(oo, `«${name}»: quantità non valida.`);
        if (!(fat > 0)) return ferr(oo, `«${name}»: conversione non valida.`);
        if (!st.solo && x.scad && !validIso(x.scad)) return ferr(oo, `«${name}»: scadenza non valida.`);
        lines.push({a: x.a, f: fat, q, lotto: x.lotto, scadenza: x.scad});
      }
      if (!lines.some(x => !x.skip)) return ferr(oo, 'Nessuna riga da caricare: abbina almeno una riga a un articolo.');
      oo.dirty = false;
      if (await feSave(e, st.forn === '__new' ? null : st.forn, st.solo, lines)) {
        closeSheet(); refreshSheets();
        toast(st.solo ? 'Fattura collegata ai DDT: prezzi completati' : 'Fattura importata: merce caricata in magazzino');
      }
    }};
  openSheet(o);
}

/* produzioni: ricetta, ogni quanti giorni, quanti giorni prima di oggi (resto), quantità */

/* vendite medie al giorno */
const ES_VENDITE = {biscotti: 7.5, cookies: 5, crostata: 3, tortamele: 3, tartellette: 8.5, tiramisu: 3.6, tramezzini: 5.5};
/* consumi al banco e vendite di rivendita al giorno, registrati la domenica */
const ES_USO = [
  ['caffe', 'uso', .85, 'Caffè al banco'], ['decaf', 'uso', .07, 'Caffè al banco'], ['latte', 'uso', 3.2, 'Cappuccini e latte macchiato'],
  ['panna', 'uso', .06, 'Caffè con panna'], ['arance', 'uso', 2.6, 'Spremute'], ['limoni', 'uso', .25, 'Tè e bibite al banco'],
  ['cornetti', 'vendita', 36, 'Cornetti sfornati e venduti'], ['acqua', 'vendita', 14, 'Vendite della settimana'], ['frizzante', 'vendita', 9, 'Vendite della settimana'],
  ['cola', 'vendita', 6, 'Vendite della settimana'], ['succo', 'vendita', 4, 'Vendite della settimana'], ['birra', 'vendita', 3, 'Vendite della settimana'],
  ['sacchetti', 'uso', 18, 'Asporto'], ['vaschette', 'uso', 7, 'Asporto pasticceria'], ['bicchieri', 'uso', 22, 'Caffè da asporto']
];

function buildSample(T = today()) {
  const N = ES_GIORNI, W = addDays(T, -(N - 1)), INV = addDays(W, -1), START = addDays(T, -ES_STORICO), UOVA_DA = addDays(T, -150), yday = addDays(T, -1);
  const h = (...p) => { const s = p.join('|'); let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } x ^= x >>> 15; x = Math.imul(x, 2246822507); x ^= x >>> 13; x = Math.imul(x, 3266489909); x ^= x >>> 16; return (x >>> 0) / 4294967296; };
  const dow = iso => parseIso(iso).getUTCDay();
  const doy = iso => daysBetween(`${iso.slice(0, 4)}-01-01`, iso);
  const ts = (iso, hh, mm = 0) => { const [y, mo, d] = iso.split('-').map(Number); return new Date(y, mo - 1, d, hh, mm).getTime(); };
  const eom = iso => { const d = parseIso(iso); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).toISOString().slice(0, 10); };
  const fid = k => 'es-f-' + k, aid = k => 'es-a-' + k, rid = k => 'es-r-' + k;
  const A = {};
  for (const x of ES_ART) A[x[0]] = {k: x[0], nome: x[1], cat: x[2], unita: x[3], pesoPz: x[4], etichetta: x[5], allergeni: x[6], cons: x[7], min: x[8], forn: x[9], pack: x[10], shelf: x[11], prezzi: x[12], stag: x[13]};
  const price = (a, iso, f = a.forn) => {
    const ago = daysBetween(iso, T), kp = a.prezzi;
    let p = ago >= kp[0][0] ? kp[0][1] : kp[kp.length - 1][1];
    for (let i = 0; i < kp.length - 1; i++) { const [g0, p0] = kp[i], [g1, p1] = kp[i + 1]; if (ago <= g0 && ago >= g1) { p = p1 + (p0 - p1) * (ago - g1) / (g0 - g1); break; } }

  };
  const algOf = k => { const out = new Set(); for (const [ik] of ES_RIC[k].ing) (ik[0] === '@' ? [...algOf(ik.slice(1))] : A[ik].allergeni).forEach(x => out.add(x)); return out; };
  const trOf = k => { const out = new Set(ES_RIC[k].tracce || []); for (const [ik] of ES_RIC[k].ing) if (ik[0] === '@') trOf(ik.slice(1)).forEach(x => out.add(x)); return out; };
  const lotF = (f, iso, k, id) => {
    const n = 1000 + Math.floor(h('l', id, k) * 9000), yy = iso.slice(2, 4), mm = iso.slice(5, 7), dd = iso.slice(8, 10);

      bevande: `L${yy.slice(1)}${String(doy(iso)).padStart(3, '0')}`, cascina: `CR${dd}${mm}`, cash: `CC${n}`}[f] || '';
  };

  /* la simulazione gira due volte: a secco per misurare i consumi giornalieri, poi davvero con acquisti, lotti e movimenti */
  function sim(dry, cons) {
    const lots = new Map(), all = [], docs = {}, prods = {}, movs = {}, pend = new Map(), nProd = {}, nOrd = {};
    let nDoc = 0, nMov = 0;
    const lotsOf = (kind, k) => { const key = kind + ':' + k; let a = lots.get(key); if (!a) lots.set(key, a = []); return a; };
    const ok = (l, iso) => l.res > EPS && l.data <= iso && (!l.scad || l.scad >= iso);
    const avail = (kind, k, iso) => r6(lotsOf(kind, k).filter(l => ok(l, iso)).reduce((s, l) => s + l.res, 0));
    const fefo = (a, b) => (a.scad || '9999').localeCompare(b.scad || '9999') || a.data.localeCompare(b.data);
    const take = (kind, k, q, iso) => {
      const out = []; let rem = r6(q);
      for (const l of lotsOf(kind, k).filter(x => ok(x, iso)).sort(fefo)) {
        if (rem <= EPS) break;
        const x = r6(Math.min(l.res, rem)); l.res = r6(l.res - x); rem = r6(rem - x); out.push([l, x]);
      }
      return out;
    };
    const newDoc = (f, iso, tipo, x = {}) => {
      const id = 'es-d-' + String(++nDoc).padStart(3, '0');
      return (docs[id] = {id, tipo, numero: '', data: iso, fornitoreId: f ? fid(f) : '', fatturaRif: '', soloPrezzi: !!x.storico, note: x.note || '', allegati: [], righe: [], creato: ts(iso, x.urg ? 11 : tipo === 'inventario' ? 18 : 8) + nDoc * 1000, _f: f, _urg: !!x.urg});
    };
    const addRiga = (d, k, q, p, scad) => {
      const a = A[k], id = 'r' + (d.righe.length + 1), q6 = r6(q);
      let sc = '', lotto = '';
      if (!d.soloPrezzi) {
        sc = scad ?? (a.shelf ? addDays(d.data, Math.max(2, Math.round(a.shelf * (.85 + .3 * h('s', d.id, k))))) : '');
        lotto = lotF(d._f || a.forn, d._f ? d.data : addDays(d.data, -6), k, d.id);
      }
      d.righe.push({id, articoloId: aid(k), qta: q6, importo: Math.round(q6 * p * 100) / 100, lotto, scadenza: sc});
      if (!d.soloPrezzi) { const l = {kind: 'acq', key: `${d.id}:${id}`, item: k, qta: q6, res: q6, scad: sc, data: d.data}; lotsOf('art', k).push(l); all.push(l); }
    };
    const avg = k => { const c = cons[k] || []; let s = 0; for (let j = 0; j < N - 1; j++) s += c[j] || 0; return s / (N - 1); };
    const nextDel = (f, day) => { for (let j = day + 1; j < day + 9; j++) if (ES_FORN[f].gg.includes(dow(addDays(W, j)))) return j; return day + 7; };
    const safety = a => (a.shelf && a.shelf <= 14 ? 1 : 3);
    /* quanto ordinare per arrivare alla consegna successiva, con un margine, senza scendere sotto la scorta minima */
    const order = (a, day) => {
      const until = nextDel(a.forn, day) - 1 + safety(a);
      let need = 0; for (let j = day; j <= until; j++) need += j < N - 1 ? (cons[a.k]?.[j] || 0) : Math.max(cons[a.k]?.[j] || 0, avg(a.k));
      const by = addDays(W, Math.min(until, day + 2));
      const stock = lotsOf('art', a.k).filter(l => l.res > EPS && (!l.scad || l.scad >= by)).reduce((s, l) => s + l.res, 0);
      const miss = r6(need + a.min - stock);
      return miss > EPS ? r6(Math.ceil(r6(miss / a.pack) - 1e-9) * a.pack) : 0;
    };
    const useArt = (k, q, iso, day) => {
      if (dry) { const c = cons[k] || (cons[k] = []); c[day] = r6((c[day] || 0) + q); return [[null, r6(q)]]; }
      const have = avail('art', k, iso);
      if (have < q - EPS) {   // manca qualcosa: spesa urgente al Cash & Carry
        const d = Object.values(docs).find(x => x._urg && x.data === iso) || newDoc('cash', iso, 'scontrino', {urg: true, note: 'Spesa urgente: merce finita prima della consegna.'});
        const a = A[k]; addRiga(d, k, Math.ceil(r6((q - have) / a.pack) - 1e-9) * a.pack, price(a, iso, 'cash'));
      }
      return take('art', k, q, iso);
    };
    const addMov = (iso, tipo, l, delta, nota, hh = 19, mm = 30) => {
      if (dry) return;
      const id = 'es-m-' + String(++nMov).padStart(3, '0');
      movs[id] = {data: iso, tipo, lotKind: l.kind, lotId: l.key, delta: r6(delta), nota, creato: ts(iso, hh, mm) + nMov * 1000};
    };
    const addPend = (l, tipo, nota, q, iso) => {

      const key = tipo + '|' + nota, b = m.get(key) || {tipo, nota, q: 0, last: iso};
      b.q = r6(b.q + q); b.last = iso; m.set(key, b);
    };
    const flush = (l, notaFine) => {
      const m = pend.get(l); if (!m) return;
      for (const b of m.values()) if (b.q > EPS) addMov(b.last, b.tipo, l, -b.q, notaFine && b.tipo === 'vendita' ? notaFine : b.nota);
      pend.delete(l);
    };
    const opOf = (rk, iso) => { const c = ES_RIC[rk].cat, o = c === 'Pasticceria fresca' ? 'Marco' : c === 'Salato' ? 'Sara' : 'Giulia'; return o === 'Giulia' && dow(iso) === 1 ? 'Marco' : o; };
    const produce = (rk, qty, iso, day) => {
      const r = ES_RIC[rk], f = qty / r.resa;
      for (const [ik, q, u] of r.ing) if (ik[0] === '@') {   // i semilavorati si preparano quando mancano
        const sk = ik.slice(1), s = ES_RIC[sk], need = r6(conv(q, u, s.u, 0) * f), have = avail('ric', sk, iso);
        if (have < need - EPS) produce(sk, r6(s.resa * Math.ceil(r6((need - have) / s.resa) - 1e-9)), iso, day);
      }
      const consumi = [];
      for (const [ik, q, u] of r.ing) {
        const isR = ik[0] === '@', k = isR ? ik.slice(1) : ik, need = r6(conv(q, u, isR ? ES_RIC[k].u : A[k].unita, isR ? 0 : A[k].pesoPz) * f);
        for (const [l, x] of (isR ? take('ric', k, need, iso) : useArt(k, need, iso, day))) consumi.push({tipo: isR ? 'ric' : 'art', refId: isR ? rid(k) : aid(k), nome: isR ? ES_RIC[k].nome : A[k].nome, lotId: l ? l.key : null, qta: x});
      }
      const code = `${r.sigla}-${iso.slice(8, 10)}${iso.slice(5, 7)}${iso.slice(2, 4)}`, n = nProd[code] = (nProd[code] || 0) + 1, lotto = `${code}-${n}`, id = 'es-p-' + lotto, scad = addDays(iso, r.shelf);
      nOrd[iso] = (nOrd[iso] || 0) + 1;
      prods[id] = {lotto, ricettaId: rid(rk), ricettaNome: r.nome, data: iso, qta: r6(qty), unita: r.u, scadenza: scad, tipoScadenza: r.tipo, operatore: opOf(rk, iso), note: '', consumi, allergeni: algSort([...algOf(rk)]), tracce: algSort([...trOf(rk)]), creato: ts(iso, 6, 10) + nOrd[iso] * 9 * 6e4};
      const l = {kind: 'prod', key: id, item: rk, qta: r6(qty), res: r6(qty), scad, data: iso};
      lotsOf('ric', rk).push(l); all.push(l);
    };

    if (!dry) {
      /* storico dei prezzi: fatture dei mesi prima di cominciare a usare l'app, solo per l'andamento dei prezzi */
      for (const [f, F] of Object.entries(ES_FORN)) {
        const dates = [];
        if (f === 'latteria') for (let d = eom(addDays(INV, -31)); d >= START; d = eom(addDays(d.slice(0, 8) + '01', -1))) dates.push(d);
        else for (let d = addDays(INV, -(4 + Math.floor(h('st', f) * Math.min(F.storico, 20)))); d >= START; d = addDays(d, -F.storico)) dates.push(d);
        for (const [i, d] of dates.reverse().entries()) {

          const extra = f === 'cash' ? [i % 2 ? 'burro' : null, i === 2 ? 'cioccolato' : null].filter(Boolean) : [];

      }

      const inv = newDoc('', INV, 'inventario', {note: 'Merce già in magazzino il primo giorno con Barista Flow.'});
      for (const a of Object.values(A)) {
        let q = ES_FISSO[a.k];
        if (q == null) {
          let first = 0; while (first < 7 && !ES_FORN[a.forn].gg.includes(dow(addDays(W, first)))) first++;
          let need = a.min; for (let j = 0; j < first + safety(a); j++) need += cons[a.k]?.[j] || 0;
          const step = a.unita === 'pz' ? Math.max(1, Math.round(a.pack / 4)) : a.pack >= 10 ? a.pack / 5 : a.pack;
          q = need > EPS ? r6(Math.ceil(r6(need / step) - 1e-9) * step) : 0;
        }
        if (q > EPS) addRiga(inv, a.k, q, price(a, INV), a.shelf ? addDays(INV, Math.max(3, Math.round(a.shelf * (.4 + .3 * h('i', a.k))))) : '');
      }
    }

    for (let day = 0; day < N; day++) {

      if (!oggi) for (const l of all) if (l.res > EPS && l.scad && l.scad < iso) { flush(l); addMov(iso, 'scarto', l, -l.res, 'Smaltito perché scaduto', 7, 40); l.res = 0; }
      // consegne dei fornitori
      if (!dry) for (const [f, F] of Object.entries(ES_FORN)) {
        if (!F.gg.includes(dow(iso))) continue;
        const lines = Object.values(A).filter(a => a.forn === f && ES_FISSO[a.k] == null).map(a => [a, order(a, day)]).filter(x => x[1] > 0);
        if (!lines.length) continue;

      }

      // vendite al banco dei prodotti, prima i lotti che scadono prima; dei lotti scaduti ieri restano due pezzi da smaltire oggi
      for (const [rk, mean] of Object.entries(ES_VENDITE)) {

        for (const l of lotsOf('ric', rk).filter(x => ok(x, iso)).sort(fefo)) {

      // consumi al banco e rivendita
      for (const [k, tipo, rate, nota] of ES_USO) {
        const a = A[k]; let q = rate * (.8 + .4 * h('u', k, iso)) * (we ? 1.15 : 1);
        q = a.unita === 'pz' ? Math.round(q) : Math.round(q * 100) / 100;
        if (q > 0) for (const [l, x] of useArt(k, q, iso, day)) addPend(l, tipo, nota, x, iso);
      }

      if (dow(iso) === 0) {
        if (j >= 7 && j < 14) {
          if (dry) { const c = cons.farina || (cons.farina = []); c[day] = r6((c[day] || 0) + .35); }
          else { const l = lotsOf('art', 'farina').filter(x => ok(x, iso)).sort(fefo)[0]; if (l && l.res > .5) { addMov(iso, 'rettifica', l, -.35, 'Conta di inventario: sacco aperto più leggero', 20, 10); l.res = r6(l.res - .35); } }
        }
        if (j < 7 && !dry) { const l = lotsOf('art', 'cornetti').filter(x => ok(x, iso)).sort(fefo)[0]; if (l) { addMov(iso, 'rettifica', l, 6, 'Conta del congelatore: 6 pezzi in più', 20, 15); l.res = r6(l.res + 6); } }

    }
    for (const l of all) flush(l);
    return {docs, prods, movs};
  }

  const cons = {};
  sim(true, cons);
  const {docs, prods, movs} = sim(false, cons);
  const docList = Object.values(docs).sort((a, b) => a.data.localeCompare(b.data) || a.creato - b.creato);

  /* l'ultimo DDT della latteria è arrivato senza prezzi: si completano con la fattura */
  const lastLat = docList.filter(d => d._f === 'latteria' && !d.soloPrezzi).pop();
  if (lastLat) { lastLat.righe.forEach(r => { r.importo = null; }); lastLat.note = 'Prezzi in fattura a fine mese.'; }
  /* tre rincari all'ultimo acquisto; per gli altri articoli nessuno sopra la soglia */
  const priced = k => docList.filter(d => d.tipo !== 'inventario').flatMap(d => d.righe.filter(r => r.articoloId === aid(k) && r.importo != null));
  const unit = r => r.importo / r.qta, setP = (r, p) => { r.importo = Math.round(r.qta * p * 100) / 100; };
  const RINC = {burro: .058, caffe: .068, cola: .062};
  for (const k of Object.keys(A)) {
    const s = priced(k); if (s.length < 2) continue;
    const pv = unit(s[s.length - 2]), last = s[s.length - 1];
    if (RINC[k]) setP(last, pv * (1 + RINC[k]));
    else if (unit(last) > pv * 1.04) setP(last, pv * 1.015);
  }
  /* numeri dei documenti: progressivi nell'anno; i DDT della latteria rimandano alla fattura di fine mese */
  const seq = {};
  const numOf = (f, tipo, iso, id) => { const key = `${f}|${tipo}|${iso.slice(0, 4)}`, n = Math.max(Math.floor(doy(iso) * ES_FORN[f].ritmo * (tipo === 'ddt' ? 2.5 : 1)) + 1 + Math.floor(h('n', id) * 3), (seq[key] || 0) + 1); seq[key] = n; return String(n); };
  for (const d of docList) {
    if (d.tipo === 'inventario') continue;
    d.numero = d.tipo === 'scontrino' ? String(100 + Math.floor(h('sc', d.id) * 8800)).padStart(4, '0') : numOf(d._f, d.tipo, d.data, d.id);
    if (d.tipo === 'ddt' && d.data.slice(0, 7) < T.slice(0, 7)) { const e = eom(d.data); d.fatturaRif = `n. ${Math.floor(doy(e) * ES_FORN.latteria.ritmo) + 1} del ${fmtD(e)}`; }
  }

  const E = {esempio: true}, out = {fornitori: {}, articoli: {}, ricette: {}, documenti: {}, produzioni: {}, movimenti: {}};
  let c0 = ts(START, 9);
  for (const [k, F] of Object.entries(ES_FORN)) out.fornitori[fid(k)] = {nome: F.nome, piva: '', telefono: '', email: F.email, note: F.note, creato: c0 += 6e4, ...E};
  for (const a of Object.values(A)) out.articoli[aid(a.k)] = {nome: a.nome, categoria: a.cat, unita: a.unita, pesoPz: a.pesoPz || null, etichetta: a.etichetta, allergeni: algSort(a.allergeni), conservazione: a.cons, scortaMin: a.min, fornitoreId: fid(a.forn), note: ES_NOTE_ART[a.k] || '', archiviato: false, creato: c0 += 6e4, ...E};
  for (const [k, r] of Object.entries(ES_RIC)) out.ricette[rid(k)] = {nome: r.nome, sigla: r.sigla, categoria: r.cat, semilavorato: !!r.semi, resaQta: r.resa, resaUnita: r.u, pesoPz: r.pesoPz || null,
    ingredienti: r.ing.map(([ik, q, u]) => ik[0] === '@' ? {tipo: 'ric', refId: rid(ik.slice(1)), qta: q, unita: u} : {tipo: 'art', refId: aid(ik), qta: q, unita: u}),
    shelfLife: r.shelf, tipoScadenza: r.tipo, conservazione: r.cons, procedimento: r.proc, tracce: algSort(r.tracce || []), prezzoVendita: r.prezzo || null, note: r.note || '', archiviato: !!r.arch, creato: c0 += 6e4, ...E};
  for (const d of docList) { const {id, _f, _urg, ...v} = d; out.documenti[id] = {...v, ...E}; }
  for (const [id, p] of Object.entries(prods)) out.produzioni[id] = {...p, ...E};
  for (const [id, m] of Object.entries(movs)) out.movimenti[id] = {...m, ...E};
  return out;
}

/* scrive o cancella tanti elementi insieme: nel browser in un colpo solo, su claude.ai a gruppi con qualche nuovo tentativo */
async function writeMany(ops, onStep) {
  for (const [c, id, v] of ops) { if (v) S.data[c].set(id, {...clone(v), id}); else S.data[c].delete(id); }
  bump();
  if (S.db.bulk) { await S.db.bulk(ops.map(([c, id, v]) => [c, id, v ? strip(v) : null])); onStep?.(ops.length); return ops.length; }
  let done = 0, ok = 0;
  await pool(ops, 6, async ([c, id, v]) => {
    for (let t = 0; t < 4; t++) {
      try { const ref = S.db.collection(c).doc(id); if (v) await ref.set(strip(v)); else await ref.delete(); ok++; break; }
      catch (e) { if (t === 3 || ['invalid_argument', 'quota_exceeded', 'revoked'].includes(e?.code)) break; await sleep(400 * (t + 1) + Math.random() * 400); }
    }
    onStep?.(++done);
  });
  return ok;
}
async function runOps(title, ops) {
  if (!ops.length) return 0;
  if (S.db.bulk) return writeMany(ops);
  const o = {title, small: true, n: 0, body: () => `<p>${esc(title)}: ${o.n} di ${ops.length}.</p><div class="prog" role="progressbar" aria-label="${esc(title)}" aria-valuemin="0" aria-valuemax="${ops.length}" aria-valuenow="${o.n}"><span style="width:${Math.round(o.n / ops.length * 100)}%"></span></div><p class="hint">Ci vuole qualche secondo: non chiudere la pagina finché non ha finito.</p>`};
  openSheet(o);
  let t = 0;
  const ok = await writeMany(ops, n => { o.n = n; const now = Date.now(); if ((now - t > 150 || n === ops.length) && stack.includes(o)) { t = now; paintSheet(o); } });
  if (top() === o) closeSheet();
  return ok;
}

async function saveFile(filename, data) {
  filename = filename.replace(/[\\/:*?"<>|]+/g, '-');
  if (S.mode === 'local') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data])); a.download = filename;
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return;
  }
  if (!S.downloads) { toast('Il download non è disponibile in questa vista.', true); return; }
  try { await S.downloads.save({filename, data}); }
  catch (e) {
    const c = e?.code;
    if (c === 'declined') return;
    if (c === 'host_unavailable') toast('Questa app non può salvare file: apri la pagina dal browser o dal computer.', true);
    else if (c === 'rate_limited') toast('Attendi un attimo e riprova.', true);
    else toast('Download non riuscito.', true);
  }
}

async function importBackup(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { toast('Il file non è un backup valido.', true); return; }
  if (!obj || !['barista-flow', 'gestionale-bar'].includes(obj.app) || typeof obj.dati !== 'object' || !obj.dati) { toast('Il file non è un backup di Barista Flow.', true); return; }
  const ops = [];
  for (const c of COLS) for (const v of (Array.isArray(obj.dati[c]) ? obj.dati[c] : [])) {
    if (!v || typeof v !== 'object' || typeof v.id !== 'string' || !/^[A-Za-z0-9_\-~:@+]{1,120}$/.test(v.id)) continue;
    ops.push([c, v.id, strip(v)]);
  }
  if (!ops.length) { toast('Il backup non contiene dati.', true); return; }
  const demo = sampleOps();
  if (!(await ask(demo.length ? `Stai usando i dati di esempio: li cancello e importo ${ops.length} elementi dal backup. Continuo?` : `Importo ${ops.length} elementi dal backup. Quelli con lo stesso codice verranno sostituiti, gli altri restano. Continuo?`, demo.length ? 'Cancella esempi e importa' : 'Importa', !!demo.length))) return;
  if (demo.length) {
    const keep = new Set(ops.map(([c, id]) => c + '/' + id)), del0 = demo.filter(([c, id]) => !keep.has(c + '/' + id));
    if (del0.length && (await runOps('Cancello i dati di prova', del0)) < del0.length) { toast('Non sono riuscito a cancellare tutti i dati di esempio: riprova.', true); return; }
  }
  const ok = await runOps('Importo il backup', ops);
  toast(ok === ops.length ? `Importati ${ok} elementi.` : `Importati ${ok} elementi su ${ops.length}: riprova per i mancanti.`, ok < ops.length);
}

/* ---------- azioni ---------- */
const guard = () => { if (S.ro) { toast('Hai accesso solo in lettura.', true); return false; } return true; };
const sheetOf = el => { const w = el.closest('.sheet-wrap'); return w ? stack.find(x => x.el === w) : null; };
const ACT = {
  close: () => requestClose(),
  ask: b => top()?.resolve?.(b.dataset.v === '1'),
  save: async () => {
    const o = top(); if (!o?.onSave || o.saving) return;
    o.saving = true; $$('.sh-foot .btn', o.el).forEach(x => { x.disabled = true; });
    try { await o.onSave(o); } finally { o.saving = false; if (stack.includes(o)) $$('.sh-foot .btn', o.el).forEach(x => { x.disabled = false; }); }
  },
  seg: b => { UI[b.dataset.k] = b.dataset.v; renderMain(); },
  'todo-all': () => { UI.todoAll = true; renderMain(); },
  jump: b => { if (b.dataset.all && !UI.todoAll) { UI.todoAll = true; renderMain(); } const el = document.getElementById(b.dataset.to); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'}); },
  fseg: b => { const o = sheetOf(b); if (!o) return; setPath(o.st, b.dataset.k, b.dataset.v); o.dirty = true; $$(`[data-act=fseg][data-k="${b.dataset.k}"]`, o.el).forEach(x => x.setAttribute('aria-pressed', x === b)); o.onField?.(b.dataset.k, o, 'change', b); },
  altog: b => { const o = sheetOf(b); if (!o) return; const arr = o.st[b.dataset.k], v = b.dataset.v, i = arr.indexOf(v); if (i < 0) arr.push(v); else arr.splice(i, 1); o.dirty = true; b.setAttribute('aria-pressed', i < 0); o.onField?.(b.dataset.k, o, 'change', b); },
  'toggle-arch': () => { UI.schArch = !UI.schArch; renderMain(); },
  'new-prod': b => { if (guard()) formProduzione(b.dataset.ric); },
  'new-doc': () => { if (guard()) formDocumento(); },
  'new-ric': () => { if (guard()) formRicetta(); },
  'new-art': () => { if (guard()) formArticolo(); },
  'new-forn': () => { if (guard()) formFornitore(); },
  'open-lotto': b => sheetLotto(b.dataset.id),
  'open-acq': b => sheetLottoAcq(b.dataset.id),
  'open-ric': b => sheetScheda(b.dataset.id),
  'open-art': b => sheetArticolo(b.dataset.id),
  'open-doc': b => sheetDocumento(b.dataset.id),
  'open-forn': b => formFornitore(b.dataset.id),
  'open-prezzi': b => sheetPrezzi(b.dataset.id),
  nav: b => { if (route() !== b.dataset.to) location.hash = b.dataset.to; },
  quick: () => sheetQuick(),
  qgo: b => { const a = b.dataset.go; closeSheet(); if (a === 'scarico') sheetScarico(); else ACT[a]?.(b); },
  'scarico-go': b => { const t = {item: true, tipo: b.dataset.tipo, id: b.dataset.id}; closeSheet(); formMov(t); },
  search: () => sheetSearch(),
  car: b => scrollLabels(+b.dataset.dir),
  riordina: b => { if (!guard()) return; const a = S.data.articoli.get(b.dataset.id); if (a) formDocumento(null, {fornitoreId: a.fornitoreId, articoloId: a.id}); },
  step: b => { const o = sheetOf(b); if (!o) return; const v = pnum(o.st.qta), nv = Math.max(1, Math.round((isNaN(v) ? 0 : v) + +b.dataset.d)); o.st.qta = String(nv); const i = $('[data-k=qta]', o.el); if (i) i.value = o.st.qta; o.dirty = true; o.onField?.('qta', o, 'input', i); },
  'dl-prezzi': () => saveFile(`Storico prezzi ${today()}.csv`, csvPrezzi()),
  'add-riga': b => { const o = sheetOf(b); o.st.righe.push({id: uid(), articoloId: '', qta: '', unita: '', importo: '', lotto: '', scadenza: ''}); o.dirty = true; paintSheet(o); const s = $$('.card', o.el).pop(); s?.scrollIntoView({block: 'nearest'}); $('select', s)?.focus({preventScroll: true}); },
  'del-riga': b => { const o = sheetOf(b); o.st.righe.splice(+b.dataset.i, 1); o.dirty = true; paintSheet(o); },
  'add-ing': b => { const o = sheetOf(b); o.st.ingredienti.push({ref: '', qta: '', unita: 'g'}); o.dirty = true; paintSheet(o); const s = $$('.card', o.el).pop(); s?.scrollIntoView({block: 'nearest'}); $('select', s)?.focus({preventScroll: true}); },
  'del-ing': b => { const o = sheetOf(b); o.st.ingredienti.splice(+b.dataset.i, 1); o.dirty = true; paintSheet(o); },
  'del-att': b => { const o = sheetOf(b); o.st.allegati.splice(+b.dataset.i, 1); o.dirty = true; paintSheet(o); },
  'mov-all': b => { const o = sheetOf(b); o.st.qta = fmtIn(o.totRes); const i = $('[data-k=qta]', o.el); if (i) i.value = o.st.qta; o.dirty = true; },
  mov: b => { if (guard()) formMov({kind: b.dataset.kind, id: b.dataset.id}); },
  'mov-item': b => { if (guard()) formMov({item: true, tipo: b.dataset.tipo, id: b.dataset.id}); },
  esaurito: b => {
    if (!guard()) return;
    const l = drv().prod.get(b.dataset.id); if (!l || l.res <= EPS) return;
    movWithUndo({data: today(), tipo: 'vendita', lotKind: 'prod', lotId: l.key, delta: -l.res, nota: 'Lotto esaurito', creato: Date.now()}, `Lotto ${l.p.lotto} esaurito: ${nb(fmtQ(l.res, lotUnit(l)))} venduti`);
  },
  smaltisci: b => {
    if (!guard()) return;
    const l = drv()[b.dataset.kind === 'prod' ? 'prod' : 'acq'].get(b.dataset.id); if (!l || l.res <= EPS) return;
    movWithUndo({data: today(), tipo: 'scarto', lotKind: l.kind, lotId: l.key, delta: -l.res, nota: 'Smaltito perché scaduto', creato: Date.now()}, `Smaltiti ${nb(fmtQ(l.res, lotUnit(l)))} di ${lotName(l)}`);
  },
  'del-mov': async b => {
    if (!guard()) return;
    if (!(await ask('Elimino questo movimento? La giacenza torna com’era prima.', 'Elimina movimento', true))) return;
    if (await del('movimenti', b.dataset.id)) toast('Movimento eliminato');
  },
  'edit-prod': b => { if (guard()) formEditProd(b.dataset.id); },
  'del-prod': async b => {
    if (!guard()) return;
    const l = drv().prod.get(b.dataset.id); if (!l) return;
    if (l.used.length) { toast(`Questo lotto è ingrediente di ${l.used.length === 1 ? 'un altro lotto' : l.used.length + ' lotti'}: elimina prima quelli.`, true); return; }
    if (!(await ask(`Elimino il lotto ${l.p.lotto}? Gli ingredienti usati tornano disponibili in magazzino.`, 'Elimina lotto', true))) return;
    for (const m of l.mov) await del('movimenti', m.id, true);
    if (await del('produzioni', l.key)) { if (top()?.live) closeSheet(); toast(`Lotto ${l.p.lotto} eliminato`); }
  },
  'edit-ric': b => { if (guard()) formRicetta(b.dataset.id); },
  'dup-ric': b => { if (guard()) formRicetta(null, b.dataset.id); },
  'arch-ric': async b => {
    if (!guard()) return;
    const r = S.data.ricette.get(b.dataset.id); if (!r) return;
    if (await put('ricette', r.id, {...strip(r), archiviato: !r.archiviato})) toast(r.archiviato ? 'Scheda ripristinata' : 'Scheda archiviata: non compare più tra i prodotti da produrre');
  },
  'del-ric': async b => {
    if (!guard()) return;
    const r = S.data.ricette.get(b.dataset.id); if (!r) return;
    const prods = (drv().ricLots.get(r.id) || []).length, users = [...S.data.ricette.values()].filter(x => x.id !== r.id && (x.ingredienti || []).some(g => g.tipo === 'ric' && g.refId === r.id));
    if (prods || users.length) { toast(prods ? 'Ci sono lotti prodotti con questa scheda: puoi archiviarla, non eliminarla.' : `È ingrediente di ${users.map(x => x.nome).join(', ')}: puoi archiviarla.`, true); return; }
    if (!(await ask(`Elimino la scheda «${r.nome}»?`, 'Elimina scheda', true))) return;
    if (await del('ricette', r.id)) { if (top()?.live) closeSheet(); toast('Scheda eliminata'); }
  },
  'edit-art': b => { if (guard()) formArticolo(b.dataset.id); },
  'arch-art': async b => {
    if (!guard()) return;
    const a = S.data.articoli.get(b.dataset.id); if (!a) return;
    if (await put('articoli', a.id, {...strip(a), archiviato: !a.archiviato})) toast(a.archiviato ? 'Articolo ripristinato' : 'Articolo archiviato');
  },
  'del-art': async b => {
    if (!guard()) return;
    const a = S.data.articoli.get(b.dataset.id); if (!a) return;
    const inDocs = (drv().artLots.get(a.id) || []).length, inRec = [...S.data.ricette.values()].some(r => (r.ingredienti || []).some(g => g.tipo !== 'ric' && g.refId === a.id));
    if (inDocs || inRec) { toast('L’articolo compare in acquisti o schede: puoi archiviarlo, non eliminarlo.', true); return; }
    if (!(await ask(`Elimino l'articolo «${a.nome}»?`, 'Elimina articolo', true))) return;
    if (await del('articoli', a.id)) { if (top()?.live) closeSheet(); toast('Articolo eliminato'); }
  },
  'edit-doc': b => { if (guard()) formDocumento(b.dataset.id); },
  'del-doc': async b => {
    if (!guard()) return;
    const d = S.data.documenti.get(b.dataset.id); if (!d) return;
    const busy = (d.righe || []).some(r => { const l = drv().acq.get(`${d.id}:${r.id}`); return l && (l.used.length || l.mov.length); });
    if (busy) { toast('Alcuni lotti di questo documento sono già stati usati o scaricati: non si può eliminare.', true); return; }
    if (!(await ask(`Elimino ${docName(d)}? Le sue righe escono dal magazzino.`, 'Elimina documento', true))) return;
    if (await del('documenti', d.id)) {
      if (S.assets) for (const a of (d.allegati || [])) { try { await S.assets.delete(a.id); } catch { /* resta orfano */ } }
      if (top()?.live) closeSheet(); toast('Documento eliminato');
    }
  },
  'del-forn': async b => {
    if (!guard()) return;
    const f = S.data.fornitori.get(b.dataset.id); if (!f) return;
    if (!(await ask(`Elimino il fornitore «${f.nome}»?`, 'Elimina fornitore', true))) return;
    if (await del('fornitori', f.id)) { const o = top(); if (o) { o.dirty = false; closeSheet(); } toast('Fornitore eliminato'); }
  },
  'copy-ing': async b => {
    const r = S.data.ricette.get(b.dataset.id); if (!r) return;
    try { await navigator.clipboard.writeText(labelPlain(r, [r.id])); toast('Testo copiato: incollalo nel cartello ingredienti'); }
    catch { toast('Copia non riuscita: seleziona il testo e copialo a mano.', true); }
  },
  'dl-scheda': b => { const r = S.data.ricette.get(b.dataset.id); if (r) saveFile(`Scheda tecnica - ${r.nome}.html`, schedaDoc(r)); },
  'dl-lotto': b => { const p = S.data.produzioni.get(b.dataset.id); if (p) saveFile(`Lotto ${p.lotto}.html`, lottoDoc(p.id)); },
  'dl-libro': () => saveFile(`Libro ingredienti ${today()}.html`, libroDoc()),
  'dl-csv': () => saveFile(`Giacenze ${today()}.csv`, csvGiacenze()),
  'dl-backup': () => saveFile(`Backup Barista Flow ${today()}.json`, backupJSON()),
  'del-sample': () => { if (guard()) clearSample(); },
  'fe-import': () => sheetFatture(),
  'fe-open': b => { const e = FE.list[+b.dataset.i]; if (e?.f) sheetFattura(e); },
  'fe-all': () => feAll(),
  'load-sample': () => loadSample(),
  'reset-sample': () => { if (guard()) resetSample(); },
  register: () => { if (!guard()) return; while (stack.length) closeSheet(); if (registered()) clearSample(); else formRegistra(); },
  prova: () => sheetProva(),
  'inv-start': () => { if (guard()) formDocumento(null, {tipo: 'inventario'}); },
  'primi-hide': () => { lsSet('bf-primi-passi', 'no'); renderMain(); toast('Primi passi nascosti'); }
};

const nb = t => String(t).replace(/\u00a0/g, ' ');
async function movWithUndo(m, msg) {
  const id = uid();
  if (await put('movimenti', id, m)) toast(msg, false, {label: 'Annulla', fn: async () => { if (await del('movimenti', id)) toast('Operazione annullata'); }});
}

/* ---------- eventi ---------- */
function onClick(e) {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  e.preventDefault();
  f(b, e);
}
function onFieldEvent(e, kind) {
  const t = e.target;
  if (t.dataset && t.dataset.q !== undefined) { if (kind === 'input') { UI.q[t.dataset.q] = t.value; renderMain(); } return; }
  if (t.dataset && (t.dataset.gq || t.dataset.sq)) {
    if (kind !== 'input') return;
    const o = sheetOf(t); if (!o) return;
    o.q = t.value; const sel = [t.selectionStart, t.selectionEnd], id = t.id;
    clearTimeout(o.qt);
    o.qt = setTimeout(() => { if (!stack.includes(o)) return; paintSheet(o); const i = document.getElementById(id); if (i) { i.focus({preventScroll: true}); try { i.setSelectionRange(sel[0], sel[1]); } catch { /* nessuna selezione */ } } }, 120);
    return;
  }
  if (t.type === 'file') { if (kind === 'change') onFile(t); return; }
  const k = t.dataset?.k; if (!k) return;
  const o = sheetOf(t); if (!o || !o.st) return;
  const isText = t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !['checkbox', 'radio', 'date'].includes(t.type));
  if ((kind === 'input') !== isText) return;
  setPath(o.st, k, t.type === 'checkbox' ? t.checked : t.value);
  o.dirty = true;
  o.onField?.(k, o, kind, t);
}
function onFile(t) {
  const files = [...(t.files || [])]; t.value = '';
  if (!files.length) return;
  if (t.dataset.file === 'import') { if (guard()) importBackup(files[0]); }
  else if (t.dataset.file === 'att') { const o = sheetOf(t); if (o) uploadAtt(o, files); }
  else if (t.dataset.file === 'fe') { const o = sheetOf(t); if (o) feAddFiles(o, files); }
}
async function saveCfg(f) {
  if (!guard()) return;
  const fd = new FormData(f), prev = S.data.impostazioni.get('generale'), c = cfg();
  const txt = (k, max, cur) => fd.has(k) ? String(fd.get(k) || '').trim().slice(0, max) : cur;
  const nome = txt('nome', 80, c.nome), indirizzo = txt('indirizzo', 140, c.indirizzo), piva = txt('piva', 20, c.piva);
  const g = Math.round(pnum(fd.get('giorniAvviso'))), iva = pnum(fd.get('iva')), sr = pnum(fd.get('sogliaRincaro'));
  if (!(g >= 0 && g <= 60)) { toast('Avviso scadenze: scrivi un numero di giorni da 0 a 60.', true); return; }
  if (!(iva >= 0 && iva <= 50)) { toast('Percentuale IVA non valida.', true); return; }
  if (!(sr >= 0 && sr <= 100)) { toast('Soglia dei rincari: scrivi una percentuale da 0 a 100.', true); return; }
  const reg = prev?.registrato || (nome && !countSample() ? Date.now() : null);
  if (await put('impostazioni', 'generale', {...(prev ? strip(prev) : {}), nome, indirizzo, piva, giorniAvviso: g, iva, sogliaRincaro: sr, ...(reg ? {registrato: reg} : {})})) toast('Impostazioni salvate');
}
function wire() {
  document.addEventListener('click', onClick);
  document.addEventListener('input', e => onFieldEvent(e, 'input'));
  document.addEventListener('change', e => onFieldEvent(e, 'change'));
  document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'cfgForm') saveCfg(e.target); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && stack.length) { e.preventDefault(); requestClose(); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if (((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) && !stack.length) { e.preventDefault(); sheetSearch(); return; }
    if (document.activeElement?.id === 'labels' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); scrollLabels(e.key === 'ArrowRight' ? 1 : -1); }
  });
  window.addEventListener('hashchange', () => { while (stack.length) closeSheet(); paint(); window.scrollTo(0, 0); });
  const tb = $('#topbar'); let ticking = false;
  window.addEventListener('scroll', () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { tb.classList.toggle('scrolled', window.scrollY > 36); ticking = false; }); }, {passive: true});
}

/* ---------- avvio ---------- */
function subscribe() {
  const timer = setTimeout(() => { if (S.fresh.size < COLS.length) { S.slow = true; bump(); } }, 10000);
  for (const c of COLS) {
    S.db.collection(c).onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs) { const v = d.data(); if (v && typeof v === 'object') m.set(d.id, {...v, id: d.id}); }
      S.data[c] = m; S.got.add(c);
      if (!snap.metadata?.fromCache) S.fresh.add(c);
      if (S.fresh.size === COLS.length) { clearTimeout(timer); S.slow = false; }
      bump();
    }, err => {
      S.got.add(c); S.fresh.add(c);
      if (err?.code === 'revoked') { S.ro = true; document.body.classList.add('ro'); }
      if (!S.errShown) { S.errShown = true; toast('Una parte dei dati non è raggiungibile in questo momento. Ricarica la pagina più tardi.', true); }
      bump();
    });
  }
}
async function init() {
  wire(); paint();
  const w = window.claude;
  if (!w || typeof w.use !== 'function') { S.db = localDB('barista-flow-v1'); S.mode = 'local'; document.body.classList.remove('nodl'); }
  else {
    const get = n => Promise.resolve().then(() => w.use(n)).catch(() => null);
    const [db, user] = await Promise.all([get('db'), get('user')]);
    S.user = user;
    if (db) { S.db = db; S.mode = 'cloud'; } else { S.db = localDB(null); S.mode = 'temp'; }
    if (user && db) { try { if ((await user.can('data.write')) === false) S.ro = true; } catch { /* nessuna informazione */ } }
    get('downloads').then(d => { S.downloads = d; document.body.classList.toggle('nodl', !d); bump(); });
    get('assets').then(a => { S.assets = a; bump(); });
  }
  document.body.classList.toggle('ro', S.ro);
  setupPWA();
  subscribe();
  paint();
}
init();

}
