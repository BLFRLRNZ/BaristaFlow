      lotsOf('ric', rk).push(l); all.push(l);
    };

    if (!dry) {
      /* storico dei prezzi: fatture dei mesi prima di cominciare a usare l'app, solo per l'andamento dei prezzi */
      for (const [f, F] of Object.entries(ES_FORN)) {
        const dates = [];
        if (f === 'latteria') for (let d = eom(addDays(INV, -31)); d >= START; d = eom(addDays(d.slice(0, 8) + '01', -1))) dates.push(d);
        else for (let d = addDays(INV, -(4 + Math.floor(h('st', f) * Math.min(F.storico, 20)))); d >= START; d = addDays(d, -F.storico)) dates.push(d);
        for (const [i, d] of dates.reverse().entries()) {
          if (f === 'cascina' && d < UOVA_DA) continue;
          const arts = Object.values(A).filter(a => (a.forn === f && (a.k !== 'uova' || d >= UOVA_DA)) || (f === 'dolciaria' && a.k === 'uova' && d < UOVA_DA));
          const extra = f === 'cash' ? [i % 2 ? 'burro' : null, i === 2 ? 'cioccolato' : null].filter(Boolean) : [];
          const days = f === 'latteria' ? 30 : F.storico;
          const doc = newDoc(f, d, f === 'cash' ? 'scontrino' : 'fattura', {storico: true});
          for (const a of [...arts, ...extra.map(k => A[k])]) {
            const base = extra.includes(a.k) ? (a.k === 'burro' ? 4 : 2) : Math.max(avg(a.k) * days, a.pack);
            addRiga(doc, a.k, Math.ceil(r6(base / a.pack) - 1e-9) * a.pack, price(a, d, f));
          }
        }
      }
      /* il giorno prima di cominciare: inventario della merce già in casa */
      const inv = newDoc('', INV, 'inventario', {note: 'Merce già in magazzino il primo giorno con Barista Flow.'});
      for (const a of Object.values(A)) {
        let q = ES_FISSO[a.k];
        if (q == null) {
          let first = 0; while (first < 7 && !ES_FORN[a.forn].gg.includes(dow(addDays(W, first)))) first++;
          let need = a.min; for (let j = 0; j < first + safety(a); j++) need += cons[a.k]?.[j] || 0;
          const step = a.unita === 'pz' ? Math.max(1, Math.round(a.pack / 4)) : a.pack >= 10 ? a.pack / 5 : a.pack;
          q = need > EPS ? r6(Math.ceil(r6(need / step) - 1e-9) * step) : 0;
        }
        if (q > EPS) addRiga(inv, a.k, q, price(a, INV), a.shelf ? addDays(INV, Math.max(3, Math.round(a.shelf * (.4 + .3 * h('i', a.k))))) : '');
      }
    }

    for (let day = 0; day < N; day++) {
      const iso = addDays(W, day), oggi = day === N - 1, j = N - 1 - day, we = [0, 6].includes(dow(iso));
      // la mattina si smaltisce quello che è scaduto: quello scaduto ieri resta da fare oggi
      if (!oggi) for (const l of all) if (l.res > EPS && l.scad && l.scad < iso) { flush(l); addMov(iso, 'scarto', l, -l.res, 'Smaltito perché scaduto', 7, 40); l.res = 0; }
      // consegne dei fornitori
      if (!dry) for (const [f, F] of Object.entries(ES_FORN)) {
        if (!F.gg.includes(dow(iso))) continue;
        const lines = Object.values(A).filter(a => a.forn === f && ES_FISSO[a.k] == null).map(a => [a, order(a, day)]).filter(x => x[1] > 0);
        if (!lines.length) continue;
        const d = newDoc(f, iso, F.tipo);
        for (const [a, q] of lines) addRiga(d, a.k, q, price(a, iso, f));
      }
      // produzioni del giorno
      for (const [rk, every, phase, qty] of ES_PIANO) if (j % every === phase) produce(rk, qty, iso, day);
      if (oggi) break;   // le vendite e i consumi di oggi non sono ancora registrati
      // vendite al banco dei prodotti, prima i lotti che scadono prima; dei lotti scaduti ieri restano due pezzi da smaltire oggi
      for (const [rk, mean] of Object.entries(ES_VENDITE)) {
        let q = Math.round(mean * (rk === 'tramezzini' ? (we ? .6 : 1.15) : (we ? 1.3 : .9)) * (.7 + .6 * h('v', rk, iso)));
        for (const l of lotsOf('ric', rk).filter(x => ok(x, iso)).sort(fefo)) {
          const x = Math.min(q, l.scad === yday ? Math.max(0, r6(l.res - 2)) : l.res);
          if (q <= 0) break; if (x <= EPS) continue;
          l.res = r6(l.res - x); q = r6(q - x);
          addPend(l, 'vendita', 'Vendite al banco', x, iso);
          if (l.res <= EPS) flush(l, 'Lotto esaurito');
        }
      }
      for (const l of lotsOf('ric', 'biscotti')) if (l.data === addDays(iso, -1) && l.res >= 4) { l.res = r6(l.res - 4); addPend(l, 'uso', 'Offerti con il caffè', 4, iso); }
      // consumi al banco e rivendita
      for (const [k, tipo, rate, nota] of ES_USO) {
        const a = A[k]; let q = rate * (.8 + .4 * h('u', k, iso)) * (we ? 1.15 : 1);
        q = a.unita === 'pz' ? Math.round(q) : Math.round(q * 100) / 100;
        if (q > 0) for (const [l, x] of useArt(k, q, iso, day)) addPend(l, tipo, nota, x, iso);
      }
      // la domenica: conta di inventario, poi si registrano consumi e vendite della settimana
      if (dow(iso) === 0) {
        if (j >= 7 && j < 14) {
          if (dry) { const c = cons.farina || (cons.farina = []); c[day] = r6((c[day] || 0) + .35); }
          else { const l = lotsOf('art', 'farina').filter(x => ok(x, iso)).sort(fefo)[0]; if (l && l.res > .5) { addMov(iso, 'rettifica', l, -.35, 'Conta di inventario: sacco aperto più leggero', 20, 10); l.res = r6(l.res - .35); } }
        }
        if (j < 7 && !dry) { const l = lotsOf('art', 'cornetti').filter(x => ok(x, iso)).sort(fefo)[0]; if (l) { addMov(iso, 'rettifica', l, 6, 'Conta del congelatore: 6 pezzi in più', 20, 15); l.res = r6(l.res + 6); } }
        for (const l of all) if (l.kind === 'acq') flush(l);
      }
    }
    for (const l of all) flush(l);
    return {docs, prods, movs};
  }

  const cons = {};
  sim(true, cons);
  const {docs, prods, movs} = sim(false, cons);
  const docList = Object.values(docs).sort((a, b) => a.data.localeCompare(b.data) || a.creato - b.creato);

  /* l'ultimo DDT della latteria è arrivato senza prezzi: si completano con la fattura */
  const lastLat = docList.filter(d => d._f === 'latteria' && !d.soloPrezzi).pop();
  if (lastLat) { lastLat.righe.forEach(r => { r.importo = null; }); lastLat.note = 'Prezzi in fattura a fine mese.'; }
  /* tre rincari all'ultimo acquisto; per gli altri articoli nessuno sopra la soglia */
  const priced = k => docList.filter(d => d.tipo !== 'inventario').flatMap(d => d.righe.filter(r => r.articoloId === aid(k) && r.importo != null));
  const unit = r => r.importo / r.qta, setP = (r, p) => { r.importo = Math.round(r.qta * p * 100) / 100; };
  const RINC = {burro: .058, caffe: .068, cola: .062};
  for (const k of Object.keys(A)) {
    const s = priced(k); if (s.length < 2) continue;
    const pv = unit(s[s.length - 2]), last = s[s.length - 1];
    if (RINC[k]) setP(last, pv * (1 + RINC[k]));
    else if (unit(last) > pv * 1.04) setP(last, pv * 1.015);
  }
  /* numeri dei documenti: progressivi nell'anno; i DDT della latteria rimandano alla fattura di fine mese */
  const seq = {};
  const numOf = (f, tipo, iso, id) => { const key = `${f}|${tipo}|${iso.slice(0, 4)}`, n = Math.max(Math.floor(doy(iso) * ES_FORN[f].ritmo * (tipo === 'ddt' ? 2.5 : 1)) + 1 + Math.floor(h('n', id) * 3), (seq[key] || 0) + 1); seq[key] = n; return String(n); };
  for (const d of docList) {
    if (d.tipo === 'inventario') continue;
    d.numero = d.tipo === 'scontrino' ? String(100 + Math.floor(h('sc', d.id) * 8800)).padStart(4, '0') : numOf(d._f, d.tipo, d.data, d.id);
    if (d.tipo === 'ddt' && d.data.slice(0, 7) < T.slice(0, 7)) { const e = eom(d.data); d.fatturaRif = `n. ${Math.floor(doy(e) * ES_FORN.latteria.ritmo) + 1} del ${fmtD(e)}`; }
  }

  const E = {esempio: true}, out = {fornitori: {}, articoli: {}, ricette: {}, documenti: {}, produzioni: {}, movimenti: {}};
  let c0 = ts(START, 9);
  for (const [k, F] of Object.entries(ES_FORN)) out.fornitori[fid(k)] = {nome: F.nome, piva: '', telefono: '', email: F.email, note: F.note, creato: c0 += 6e4, ...E};
  for (const a of Object.values(A)) out.articoli[aid(a.k)] = {nome: a.nome, categoria: a.cat, unita: a.unita, pesoPz: a.pesoPz || null, etichetta: a.etichetta, allergeni: algSort(a.allergeni), conservazione: a.cons, scortaMin: a.min, fornitoreId: fid(a.forn), ...(a.cat === 'rivendita' ? {prezzoVendita: ES_VENDITA[a.k] || null} : {}), note: ES_NOTE_ART[a.k] || '', archiviato: false, creato: c0 += 6e4, ...E};
  for (const [k, r] of Object.entries(ES_RIC)) out.ricette[rid(k)] = {nome: r.nome, sigla: r.sigla, categoria: r.cat, semilavorato: !!r.semi, resaQta: r.resa, resaUnita: r.u, pesoPz: r.pesoPz || null,
    ingredienti: r.ing.map(([ik, q, u]) => ik[0] === '@' ? {tipo: 'ric', refId: rid(ik.slice(1)), qta: q, unita: u} : {tipo: 'art', refId: aid(ik), qta: q, unita: u}),
    shelfLife: r.shelf, tipoScadenza: r.tipo, conservazione: r.cons, procedimento: r.proc, tracce: algSort(r.tracce || []), prezzoVendita: r.prezzo || null, note: r.note || '', archiviato: !!r.arch, creato: c0 += 6e4, ...E};
  for (const d of docList) { const {id, _f, _urg, ...v} = d; out.documenti[id] = {...v, ...E}; }
  for (const [id, p] of Object.entries(prods)) out.produzioni[id] = {...p, ...E};
  for (const [id, m] of Object.entries(movs)) out.movimenti[id] = {...m, ...E};
  return out;
}

/* ---------- prova con i dati di esempio e registrazione del bar ---------- */
const ownCount = () => COLS.reduce((s, c) => c === 'impostazioni' ? s : s + [...S.data[c].values()].filter(v => !v.esempio).length, 0);
const registered = () => { const g = S.data.impostazioni.get('generale') || {}; return !!g.registrato || (!!String(g.nome || '').trim() && !countSample()); };
const allLoaded = () => S.mode !== 'loading' && S.fresh.size >= COLS.length;   // finché l'archivio non è arrivato tutto non si sa se è vuoto
const showWelcome = () => allLoaded() && !S.ro && !registered() && !countSample() && !ownCount();
const sampleOps = () => COLS.flatMap(c => [...S.data[c].values()].filter(v => v.esempio).map(v => [c, v.id, null]));

/* scrive o cancella tanti elementi insieme: nel browser in un colpo solo, su claude.ai a gruppi con qualche nuovo tentativo */
async function writeMany(ops, onStep) {
  for (const [c, id, v] of ops) { if (v) S.data[c].set(id, {...clone(v), id}); else S.data[c].delete(id); }
  bump();
  if (S.db.bulk) { await S.db.bulk(ops.map(([c, id, v]) => [c, id, v ? strip(v) : null])); onStep?.(ops.length); return ops.length; }
  let done = 0, ok = 0;
  await pool(ops, 6, async ([c, id, v]) => {
    for (let t = 0; t < 4; t++) {
      try { const ref = S.db.collection(c).doc(id); if (v) await ref.set(strip(v)); else await ref.delete(); ok++; break; }
      catch (e) { if (t === 3 || ['invalid_argument', 'quota_exceeded', 'revoked'].includes(e?.code)) break; await sleep(400 * (t + 1) + Math.random() * 400); }
    }
    onStep?.(++done);
  });
  return ok;
}
async function runOps(title, ops) {
  if (!ops.length) return 0;
  if (S.db.bulk) return writeMany(ops);
  const o = {title, small: true, n: 0, body: () => `<p>${esc(title)}: ${o.n} di ${ops.length}.</p><div class="prog" role="progressbar" aria-label="${esc(title)}" aria-valuemin="0" aria-valuemax="${ops.length}" aria-valuenow="${o.n}"><span style="width:${Math.round(o.n / ops.length * 100)}%"></span></div><p class="hint">Ci vuole qualche secondo: non chiudere la pagina finché non ha finito.</p>`};
  openSheet(o);
  let t = 0;
  const ok = await writeMany(ops, n => { o.n = n; const now = Date.now(); if ((now - t > 150 || n === ops.length) && stack.includes(o)) { t = now; paintSheet(o); } });
  if (top() === o) closeSheet();
  return ok;
}
const goOggi = () => { if (route() !== 'oggi') location.hash = 'oggi'; window.scrollTo(0, 0); };

async function loadSample(replace) {
  if (!guard()) return;
  if (!allLoaded()) { toast('I dati non sono ancora arrivati tutti: riprova tra qualche secondo.', true); return; }
  if (ownCount()) { toast('Nell’archivio ci sono già dati tuoi: gli esempi si caricano solo in un archivio vuoto.', true); return; }
  const data = buildSample(today()), ops = [];
  for (const [c, docs] of Object.entries(data)) for (const [id, v] of Object.entries(docs)) ops.push([c, id, v]);
  if (replace) for (const c of COLS) for (const v of S.data[c].values()) if (v.esempio && !data[c]?.[v.id]) ops.push([c, v.id, null]);
  const ok = await runOps(replace ? 'Aggiorno i dati di esempio' : 'Carico i dati di esempio', ops);
  if (ok < ops.length) { toast(`Caricati ${ok} elementi su ${ops.length}: riprova da Impostazioni.`, true); return; }
  goOggi();
  toast(replace ? 'Esempi riportati alla data di oggi' : 'Ecco il bar di esempio: prova tutto liberamente');
}
async function resetSample() {
  if (!(await ask('Rimetto i dati di esempio come all’inizio, con le date di oggi. Quello che hai inserito durante la prova si perde.', 'Riporta a oggi'))) return;
  while (stack.length) closeSheet();
  await loadSample(true);
}
async function clearSample() {
  const items = sampleOps(); if (!items.length) return;
  if (!(await ask(`Cancello i dati di esempio e quello che hai inserito durante la prova (${items.length} elementi)?`, 'Cancella gli esempi', true))) return;
  while (stack.length) closeSheet();
  const ok = await runOps('Cancello i dati di prova', items);
  toast(ok === items.length ? 'Dati di esempio cancellati' : `Cancellati ${ok} elementi su ${items.length}: riprova per gli altri.`, ok < items.length);
  await postaRiparti();
}
function formRegistra() {

      o.dirty = false; closeSheet();

      goOggi();
      toast(`Benvenuto, ${nome}! Si comincia dai primi passi.`);
    }});
}

/* ---------- file scaricabili ---------- */
async function saveFile(filename, data) {
  filename = filename.replace(/[\\/:*?"<>|]+/g, '-');
  if (S.mode === 'local') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data])); a.download = filename;
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return;
  }
  if (!S.downloads) { toast('Il download non è disponibile in questa vista.', true); return; }
  try { await S.downloads.save({filename, data}); }
  catch (e) {
    const c = e?.code;
    if (c === 'declined') return;
    if (c === 'host_unavailable') toast('Questa app non può salvare file: apri la pagina dal browser o dal computer.', true);
    else if (c === 'rate_limited') toast('Attendi un attimo e riprova.', true);
    else toast('Download non riuscito.', true);
  }
}

const csvCell = v => { let s = String(v ?? '').replace(/ /g, ' '); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[";\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
function csvGiacenze() {
  const Dd = drv(), rows = [['Tipo', 'Nome', 'Lotto', 'Origine', 'Fornitore', 'Scadenza', 'Residuo', 'Unità', 'Stato']];
  for (const l of [...Dd.acq.values()].filter(l => l.res > EPS).sort((a, b) => lotName(a).localeCompare(lotName(b), 'it') || byScad(a, b))) rows.push([CAT[l.item?.categoria] || CAT.materia, lotName(l), l.lottoF, docName(l.doc), fornName(l.doc.fornitoreId), l.scad ? fmtD(l.scad) : '', String(l.res).replace('.', ','), lotUnit(l), st(l).t]);

function csvPrezzi() {
  const rows = [['Articolo', 'Data', 'Fornitore', 'Documento', 'Quantità', 'Unità', 'Importo senza IVA', 'Prezzo unitario']];
  for (const [id, s] of drv().prices) {
    const a = S.data.articoli.get(id); if (!a) continue;
    for (const x of s) rows.push([a.nome, fmtD(x.date), fornName(x.forn), docName(S.data.documenti.get(x.docId)), String(r6(x.q)).replace('.', ','), unitOk(a.unita), String(r6(x.imp)).replace('.', ','), String(Math.round(x.p * 10000) / 10000).replace('.', ',')]);
  }
  rows.splice(1, rows.length - 1, ...rows.slice(1).sort((a, b) => a[0].localeCompare(b[0], 'it') || a[1].split('/').reverse().join('').localeCompare(b[1].split('/').reverse().join(''))));

}

async function importBackup(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { toast('Il file non è un backup valido.', true); return; }
  if (!obj || !['barista-flow', 'gestionale-bar'].includes(obj.app) || typeof obj.dati !== 'object' || !obj.dati) { toast('Il file non è un backup di Barista Flow.', true); return; }
  const ops = [];
  for (const c of COLS) for (const v of (Array.isArray(obj.dati[c]) ? obj.dati[c] : [])) {
    if (!v || typeof v !== 'object' || typeof v.id !== 'string' || !/^[A-Za-z0-9_\-~:@+]{1,120}$/.test(v.id)) continue;
    ops.push([c, v.id, strip(v)]);
  }
  if (!ops.length) { toast('Il backup non contiene dati.', true); return; }
  const demo = sampleOps();
  if (!(await ask(demo.length ? `Stai usando i dati di esempio: li cancello e importo ${ops.length} elementi dal backup. Continuo?` : `Importo ${ops.length} elementi dal backup. Quelli con lo stesso codice verranno sostituiti, gli altri restano. Continuo?`, demo.length ? 'Cancella esempi e importa' : 'Importa', !!demo.length))) return;
  if (demo.length) {
    const keep = new Set(ops.map(([c, id]) => c + '/' + id)), del0 = demo.filter(([c, id]) => !keep.has(c + '/' + id));
    if (del0.length && (await runOps('Cancello i dati di prova', del0)) < del0.length) { toast('Non sono riuscito a cancellare tutti i dati di esempio: riprova.', true); return; }
  }
  const ok = await runOps('Importo il backup', ops);
  toast(ok === ops.length ? `Importati ${ok} elementi.` : `Importati ${ok} elementi su ${ops.length}: riprova per i mancanti.`, ok < ops.length);
}

const nb = t => String(t).replace(/\u00a0/g, ' ');
async function movWithUndo(m, msg) { return movsWithUndo([m], msg); }
async function movsWithUndo(ms, msg) {
  const ids = [];
  for (const m of ms) { const id = uid(); if (!(await put('movimenti', id, m))) break; ids.push(id); }
  if (ids.length) { buzz(); toast(msg, false, {label: 'Annulla', fn: async () => { let ok = true; for (const id of ids) ok = (await del('movimenti', id)) && ok; if (ok) toast('Operazione annullata'); }}); }
  return ids.length === ms.length;
}
/* la riga (o il gruppo) esce di lato e si richiude: quando i dati cambiano, l'elenco è già al suo posto */
function rowOut(el) {
  if (!el || !el.animate || calm()) return null;
  const h = el.offsetHeight, cs = getComputedStyle(el), full = {height: h + 'px', minHeight: h + 'px', paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom, marginBottom: cs.marginBottom};
  el.style.overflow = 'hidden'; el.style.pointerEvents = 'none';
  return el.animate([{opacity: 1, transform: 'none', ...full}, {opacity: 0, transform: 'translateX(-32px)', ...full, offset: .45}, {opacity: 0, transform: 'translateX(-32px)', height: '0px', minHeight: '0px', paddingTop: '0px', paddingBottom: '0px', marginBottom: el.classList.contains('todo-g') ? '-20px' : cs.marginBottom}], {duration: 380, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards'});
}
function rowBack(a) { if (!a) return; a.cancel(); const el = a.effect?.target; if (el) { el.style.overflow = ''; el.style.pointerEvents = ''; } }
/* una vibrazione brevissima conferma le operazioni sul telefono (dove il browser la permette) */
const buzz = () => { try { navigator.vibrate?.(12); } catch { /* non disponibile */ } };
/* le scelte rapide Oggi e Ieri sotto le date dei moduli */
function dchips(root, k, v) { $$(`[data-act=dset][data-k="${k}"]`, root).forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); }

/* ---------- eventi ---------- */
function onClick(e) {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  e.preventDefault();
  f(b, e);
}
function onFieldEvent(e, kind) {
  const t = e.target;
  if (t.dataset && t.dataset.notif !== undefined) { if (kind === 'change') notifImposta(t.dataset.notif, t.type === 'checkbox' ? t.checked : t.value); return; }
  if (t.dataset && t.dataset.q !== undefined) { if (kind === 'input') { UI.q[t.dataset.q] = t.value; renderMain(); } return; }
  if (t.dataset && t.dataset.bq !== undefined) { if (kind === 'input') BANCO.draft = {k: t.dataset.bq, v: t.value}; else bancoSet(t.dataset.bq, t.value, true); return; }
  if (t.dataset && (t.dataset.gq || t.dataset.sq)) {
    if (kind !== 'input') return;
    const o = sheetOf(t); if (!o) return;
    o.q = t.value; const sel = [t.selectionStart, t.selectionEnd], id = t.id;
    clearTimeout(o.qt);
    o.qt = setTimeout(() => { if (!stack.includes(o)) return; paintSheet(o); const i = document.getElementById(id); if (i) { i.focus({preventScroll: true}); try { i.setSelectionRange(sel[0], sel[1]); } catch { /* nessuna selezione */ } } }, 120);
    return;
  }
  if (t.type === 'file') { if (kind === 'change') onFile(t); return; }
  const k = t.dataset?.k; if (!k) return;
  const o = sheetOf(t); if (!o || !o.st) return;
  const isText = t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !['checkbox', 'radio', 'date'].includes(t.type));
  if ((kind === 'input') !== isText) return;
  setPath(o.st, k, t.type === 'checkbox' ? t.checked : t.value);
  o.dirty = true;
  if (t.type === 'date') dchips(o.el, k, t.value);
  o.onField?.(k, o, kind, t);
}
function onFile(t) {
  const files = [...(t.files || [])]; t.value = '';
  if (!files.length) return;
  if (t.dataset.file === 'import') { if (guard()) importBackup(files[0]); }
  else if (t.dataset.file === 'att') { const o = sheetOf(t); if (o) uploadAtt(o, files); }
  else if (t.dataset.file === 'fe') { const o = sheetOf(t); if (o) feAddFiles(o, files); }
}
async function saveCfg(f) {
  if (!guard()) return;
  const fd = new FormData(f), prev = S.data.impostazioni.get('generale'), c = cfg();
  const txt = (k, max, cur) => fd.has(k) ? String(fd.get(k) || '').trim().slice(0, max) : cur;
  const nome = txt('nome', 80, c.nome), indirizzo = txt('indirizzo', 140, c.indirizzo), piva = txt('piva', 20, c.piva);
  const g = Math.round(pnum(fd.get('giorniAvviso'))), iva = pnum(fd.get('iva')), sr = pnum(fd.get('sogliaRincaro'));
  if (!(g >= 0 && g <= 60)) { toast('Avviso scadenze: scrivi un numero di giorni da 0 a 60.', true); return; }
  if (!(iva >= 0 && iva <= 50)) { toast('Percentuale IVA non valida.', true); return; }
  if (!(sr >= 0 && sr <= 100)) { toast('Soglia dei rincari: scrivi una percentuale da 0 a 100.', true); return; }
  const reg = prev?.registrato || (nome && !countSample() ? Date.now() : null);
  if (await put('impostazioni', 'generale', {...(prev ? strip(prev) : {}), nome, indirizzo, piva, giorniAvviso: g, iva, sogliaRincaro: sr, ...(reg ? {registrato: reg} : {})})) toast('Impostazioni salvate');
}
function wire() {
  document.addEventListener('click', onClick);
  document.addEventListener('input', e => onFieldEvent(e, 'input'));
  document.addEventListener('change', e => onFieldEvent(e, 'change'));
  document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'cfgForm') saveCfg(e.target); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && stack.length) { e.preventDefault(); requestClose(); return; }
    if (e.key === 'Enter' && bancoEnter(e)) return;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if (((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) && !stack.length) { e.preventDefault(); sheetSearch(); return; }
    if (document.activeElement?.id === 'labels' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); scrollLabels(e.key === 'ArrowRight' ? 1 : -1); }
  });
  window.addEventListener('hashchange', goRoute);
  // toccare la sezione in cui sei già riporta in cima, come nelle app del telefono
  $('#tabs').addEventListener('click', e => {
    const a = e.target.closest('a[data-tab]');
    if (!a || a.getAttribute('href') !== '#' + route()) return;
    e.preventDefault(); window.scrollTo({top: 0, behavior: calm() ? 'auto' : 'smooth'});
  });
  const tb = $('#topbar'); let ticking = false;
  window.addEventListener('scroll', () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { tb.classList.toggle('scrolled', window.scrollY > 36); ticking = false; }); }, {passive: true});
}

/* cambio di pagina: ogni sezione ricorda dove eri arrivato, e la pagina nuova entra con una dissolvenza breve */
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const scrollMem = {};
let curRoute = null;
function goRoute() {
  const prev = curRoute ?? route(), next = route();
  bancoRicorda();
  if (prev !== next) scrollMem[prev] = window.scrollY;
  while (stack.length) closeSheet();
  let done = false;
  const apply = () => { if (done) return; done = true; curRoute = next; paint(); window.scrollTo(0, prev === next ? 0 : scrollMem[next] || 0); };
  if (!document.startViewTransition || calm() || prev === next || document.visibilityState !== 'visible') { apply(); return; }
  // se il passaggio animato non parte (scheda in secondo piano, browser occupato) la pagina cambia lo stesso
  const vt = document.startViewTransition(apply);
  vt.updateCallbackDone.catch(apply); vt.ready.catch(() => {}); vt.finished.catch(() => {});
  setTimeout(apply, 400);
}

/* ---------- avvio ---------- */
function subscribe() {
  const timer = setTimeout(() => { if (S.fresh.size < COLS.length) { S.slow = true; bump(); } }, 10000);
  for (const c of COLS) {
    S.db.collection(c).onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs) { const v = d.data(); if (v && typeof v === 'object') m.set(d.id, {...v, id: d.id}); }
      S.data[c] = m; S.got.add(c);
      if (!snap.metadata?.fromCache) S.fresh.add(c);
      if (S.fresh.size === COLS.length) { clearTimeout(timer); S.slow = false; }
      bump();
    }, err => {
      S.got.add(c); S.fresh.add(c);
      if (err?.code === 'revoked') { S.ro = true; document.body.classList.add('ro'); }
      if (!S.errShown) { S.errShown = true; toast('Una parte dei dati non è raggiungibile in questo momento. Ricarica la pagina più tardi.', true); }
      bump();
    });
  }
}
/* chi lascia l'app sul Banco (il telefono o il tablet della cassa) la ritrova lì quando la riapre */
const bancoRicorda = () => lsSet('bf-banco', route() === 'banco' ? '1' : '');
async function init() {
  if (!location.hash && lsGet('bf-banco') === '1') { try { history.replaceState(history.state, '', '#banco'); } catch { /* cronologia non disponibile */ } }
  wire(); paint(); curRoute = route(); bancoRicorda();
  const w = window.claude;
  if (!w || typeof w.use !== 'function') { S.db = localDB('barista-flow-v1'); S.mode = 'local'; document.body.classList.remove('nodl'); }
  else {
    const get = n => Promise.resolve().then(() => w.use(n)).catch(() => null);
    const [db, user] = await Promise.all([get('db'), get('user')]);
    S.user = user;
    if (db) { S.db = db; S.mode = 'cloud'; } else { S.db = localDB(null); S.mode = 'temp'; }
    if (user && db) { try { if ((await user.can('data.write')) === false) S.ro = true; } catch { /* nessuna informazione */ } }
    get('downloads').then(d => { S.downloads = d; document.body.classList.toggle('nodl', !d); bump(); });
    get('assets').then(a => { S.assets = a; bump(); });
  }
  document.body.classList.toggle('ro', S.ro);
  setupPWA();
  subscribe();
  paint();
  if (S.mode === 'local') postaBoot();
  // tocco su una notifica con l'app già aperta: il service worker dice quale pagina mostrare
  navigator.serviceWorker?.addEventListener('message', e => { if (e.data?.tipo === 'apri' && /^#[a-z-]*$/.test(e.data.hash || '')) location.hash = e.data.hash; });
}
init();

}
